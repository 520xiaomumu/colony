    g.fill();
    g.lineWidth = 2;
    g.strokeStyle = '#000';
    g.stroke();
    words(L.f, x + L.pw, y + L.ph, e.color || (/^#(B5FF00|5CE1E6|FF9500|FFE14D)/i.test(fill) ? 'ink' : null));
    glow(L.bb, st.hl, r);
  } else if (e.type === 'box' || e.type === 'file') {
    const r = e.r == null ? 16 : e.r;
    if (e.type === 'file') {
      // 纸: 右上角折一下
      const c = 36;
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x + w - c, y);
      g.lineTo(x + w, y + c);
      g.lineTo(x + w, y + h);
      g.lineTo(x, y + h);
      g.closePath();
    } else rr(x, y, w, h, r);
    if (e.fill !== 'none') {
      g.fillStyle = col(e.fill || 'card');
      g.fill();
    }
    if (e.stroke) {
      g.setLineDash(e.dash ? [12, 10] : []);
      g.lineWidth = e.sw || 2;
      g.strokeStyle = col(e.stroke);
      g.stroke();
      g.setLineDash([]);
    }
    if (L.f) words(L.f, x + 16, e.type === 'file' ? y + (h - L.f.lh) / 2 : y + 14, e.labelColor);
    glow(L.bb, st.hl, r);
  } else if (e.type === 'icon') {
    const sz = e.size || 64;
    g.font = sz * 0.8 + 'px ' + S.sans;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(e.text, x + w / 2, y + sz / 2);
    g.textAlign = 'left';
    if (L.f) words(L.f, x + w / 2 - L.f.w / 2, y + sz + 6);
    glow([x, y, w, sz], st.hl, 12);
  } else if (e.type === 'line') {
    const p = ends(e, boxes);
    if (p) {
      const [[x1, y1], [x2, y2]] = p;
      g.strokeStyle = col(e.color || 'accent');
      g.lineWidth = e.w || 3;
      g.setLineDash(e.dash ? [10, 8] : []);
      g.beginPath();
      g.moveTo(x1, y1);
      g.lineTo(x1 + (x2 - x1) * st.grow, y1 + (y2 - y1) * st.grow);
      g.stroke();
      g.setLineDash([]);
      L.seg = [x1, y1, x2, y2];
    }
  } else if (e.type === 'ring') {
    const cx = x + e.r,
      cy = y + e.r;
    g.strokeStyle = col(e.color || 'accent');
    g.lineWidth = e.w || 4;
    g.beginPath();
    g.arc(cx, cy, e.r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * st.grow);
    g.stroke();
    if (e.dot) {
      // 一个点绕圈走: dot = [开始秒, 转一圈几秒, 停下秒]
      const [d0, per, d1] = e.dot,
        lt = Math.min(st.lt, d1 == null ? Infinity : d1);
      if (lt >= d0) {
        const ang = -Math.PI / 2 + (Math.PI * 2 * (lt - d0)) / per;
        g.fillStyle = col(e.color || 'accent');
        g.beginPath();
        g.arc(cx + Math.cos(ang) * e.r, cy + Math.sin(ang) * e.r, 12, 0, Math.PI * 2);
        g.fill();
      }
    }
  } else if (e.type === 'cursor') {
    // 箭头 + 名字牌
    g.fillStyle = col(e.color || 'agent');
    g.strokeStyle = '#000';
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + 10, y + 32);
    g.lineTo(x + 15, y + 19);
    g.lineTo(x + 28, y + 16);
    g.closePath();
    g.fill();
    g.stroke();
    if (e.label) {
      const f = fit('small', e.label),
        bw = f.w + 16;
      g.fillStyle = col(e.color || 'agent');
      rr(x + 22, y + 30, bw, f.lh + 6, 6);
      g.fill();
      words(f, x + 30, y + 33, 'ink');
    }
  }
  g.restore();
}

// ═ 一场 ═ 标准版面: split = 左边画图、右边标题要点; center = 标题字幕在下半中间
function parts(sc) {
  const out = [],
    L = sc.layout || (sc.points ? 'split' : 'center');
  if (L === 'split') {
    if (sc.title)
      out.push({
        id: '_title',
        type: 'text',
        role: 'title',
        text: sc.title,
        x: 1040,
        y: 110,
        w: 820,
        t: 0.2,
        in: 'rise',
      });
    if (sc.sub)
      out.push({
        id: '_sub',
        type: 'text',
        role: 'sub',
        text: sc.sub,
        x: 1040,
        y: 230,
        w: 820,
        t: 0.5,
        in: 'rise',
      });
    out.push({
      id: '_rule',
      type: 'box',
      x: 1040,
      y: 302,
      w: 72,
      h: 6,
      r: 3,
      fill: 'accent',
      t: 0.7,
      in: 'fade',
    });
    (sc.points || []).forEach((p, i) => {
      const t = (sc.at || [])[i] != null ? sc.at[i] : 1.5 + i * 2.5;
      out.push({
        id: '_n' + i,
        type: 'chip',
        role: 'tag',
        text: String(i + 1),
        fill: 'accent',
        x: 1040,
        y: 356 + i * 104,
        t,
        in: 'rise',
      });
      out.push({
        id: '_p' + i,
        type: 'text',
        role: 'point',
        text: p,
        x: 1112,
        y: 360 + i * 104,
        w: 760,
        t,
        in: 'rise',
      });
    });
  } else {
    if (sc.title)
      out.push({
        id: '_title',
        type: 'text',
        role: 'title',
        text: sc.title,
        x: 960,
        y: 700,
        w: 1600,
        align: 'center',
        t: sc.titleAt || 0.3,
        in: 'rise',
      });
    if (sc.sub)
      out.push({
        id: '_sub',
        type: 'text',
        role: 'sub',
        text: sc.sub,
        x: 960,
        y: 820,
        w: 1600,
        align: 'center',
        t: (sc.titleAt || 0.3) + 0.4,
        in: 'rise',
      });
  }
  return (sc.els || []).concat(out);
}
function frame(sc, lt, paint) {
  // 这一刻场上每个元素的框; paint 为真就顺手画出来
  const items = [],
    boxes = {};
  for (const e of sc._parts) {
    const st = state(e, lt);
    if (!st) continue;
    st.lt = lt;
    const L = lay(e, st);
    if (e.id) boxes[e.id] = L.bb;
    items.push({ e, st, L });
  }
  if (paint) items.forEach(it => draw(it.e, it.st, it.L, boxes));
  else
    items
      .filter(it => it.e.type === 'line')
      .forEach(it => {
        const p = ends(it.e, boxes);
        if (p) it.L.seg = [...p[0], ...p[1]];
      });
  return items;
}
function paint(ctx, W, H, t) {
  // 整帧: 底色、按比例缩放到画布、换场时淡黑
  g = ctx;
  const k = Math.min(W / W0, H / H0);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#000';
  g.fillRect(0, 0, W, H);
  g.setTransform(k, 0, 0, k, (W - W0 * k) / 2, (H - H0 * k) / 2);
  g.fillStyle = S.bg;
  g.fillRect(0, 0, W0, H0);
  const sc = scenes.find(s => t < s._end) || scenes[scenes.length - 1],
    lt = t - sc._start;
  frame(sc, lt, true);
  const fade = Math.max(sc._start > 0 ? 1 - lt / 0.3 : 0, 1 - (sc._end - t) / 0.3, 0);
  if (fade > 0 && sc !== scenes[scenes.length - 1]) {
    g.fillStyle = 'rgba(0,0,0,' + clamp(fade) + ')';
    g.fillRect(0, 0, W0, H0);
  }
}

// ═ 自检 ═ 字放不放得下、出没出框、同时在场的字叠没叠、线穿没穿过字、版面规矩
const hit = (a, b) =>
  a[0] < b[0] + b[2] - 2 && b[0] < a[0] + a[2] - 2 && a[1] < b[1] + b[3] - 2 && b[1] < a[1] + a[3] - 2;
function cross(s, b) {
  // 线段 s 穿不穿过框 b(先缩 4px, 擦边不算)
  const [x1, y1, x2, y2] = s,
    r = [b[0] + 4, b[1] + 4, b[2] - 8, b[3] - 8];
  for (let i = 0; i <= 20; i++) {
    const x = x1 + ((x2 - x1) * i) / 20,
      y = y1 + ((y2 - y1) * i) / 20;
    if (x > r[0] && x < r[0] + r[2] && y > r[1] && y < r[1] + r[3]) return true;
  }
  return false;
}
function check() {
  const out = [],
    seen = new Set(),
    say = (i, lv, m) => {
      const k = i + lv + m;
      if (!seen.has(k)) {
        seen.add(k);
        out.push({ 场: i, 级: lv, 说: m });
      }
    };
  scenes.forEach((sc, i) => {
    const 名 = '第 ' + i + ' 场「' + (sc.name || sc.title || '') + '」';
    if (sc.title && [...sc.title].length > S.rules.titleMax)
      say(i, '提醒', 名 + '标题超过 ' + S.rules.titleMax + ' 个字');
    if ((sc.points || []).length > S.rules.points) say(i, '错', 名 + '要点超过 ' + S.rules.points + ' 条');
    (sc.points || []).forEach(p => {
      if ([...p].length > S.rules.pointMax)
        say(i, '提醒', 名 + '要点「' + p + '」超过 ' + S.rules.pointMax + ' 个字');
    });
    sc._parts.forEach(e => {
      if ((e.t || 0) > sc.dur)
        say(i, '错', 名 + (e.id || e.type) + ' 出场时间 ' + e.t + ' 秒超过这场的 ' + sc.dur + ' 秒');
    });
    for (let lt = 0; lt <= sc.dur; lt += 0.25) {
      const items = frame(sc, lt, false).filter(it => it.st.a > 0.5),
        txt = items.filter(it => it.L.words && !it.e.over); // over = 本来就该压着别的(顺着线走的、收拢的)
      txt.forEach(it => {
        const b = it.L.bb,
          nm = it.e.id || it.e.text || it.e.label;
        if (it.L.f && !it.L.f.ok) say(i, '错', 名 + '「' + nm + '」缩到七成还放不下');
        else if (it.L.f && it.L.f.size < it.L.f.size0)
          say(i, '提醒', 名 + '「' + nm + '」缩到 ' + it.L.f.size + 'px 才放下');
        if (b[0] < SAFE || b[1] < SAFE || b[0] + b[2] > W0 - SAFE || b[1] + b[3] > H0 - SAFE)
          say(i, '错', 名 + '「' + nm + '」出了安全框');
      });
      for (let a = 0; a < txt.length; a++)
        for (let b = a + 1; b < txt.length; b++) {
          if (hit(txt[a].L.bb, txt[b].L.bb))
            say(
              i,
              '错',
              名 +
                '「' +
                (txt[a].e.id || txt[a].e.text) +
                '」和「' +
                (txt[b].e.id || txt[b].e.text) +
                '」叠在一起'
            );
        }
      items
        .filter(it => it.L.seg)
        .forEach(ln =>
          txt.forEach(it => {
            if (it.e.id === ln.e.from || it.e.id === ln.e.to) return;
            if (cross(ln.L.seg, it.L.bb))
              say(
                i,
                '错',
                名 +
                  '线「' +
                  (ln.e.id || ln.e.from + '→' + ln.e.to) +
                  '」穿过了「' +
                  (it.e.id || it.e.text) +
                  '」'
              );
          })
        );
    }
  });
  return out;
}

// ═ 配音 ═ 导出时离线合成整片的声音: 背景音乐 + 每场的旁白(念的时候音乐压低), 再编成 Opus
function chords(ac, to) {
  // 自己合成的背景音乐: 四个和弦一轮, 每个两秒, 三角波慢起慢落
  const C = [
    [261.6, 329.6, 392],
    [220, 261.6, 329.6],
    [174.6, 220, 261.6],
    [196, 246.9, 293.7],
  ];
  for (let t = 0, i = 0; t < total; t += 2, i++)
    C[i % 4].forEach(f => {
      const o = ac.createOscillator(),
        g = ac.createGain();
      o.type = 'triangle';
      o.frequency.value = f;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.1, t + 0.6);
      g.gain.linearRampToValueAtTime(0, t + 2.2);
      o.connect(g).connect(to);
      o.start(t);
      o.stop(t + 2.3);
    });
}
async function soundtrack() {
  // 旁白和音乐都在 Colony 里向模型要(小应用能调); 不在 Colony 里或没配模型: 没有旁白, 音乐用自己合成的
  const R = 48000,
    ac = new OfflineAudioContext(2, Math.ceil(total * R), R),
    bus = ac.createGain(),
    bed = ac.createGain(),
    said = [];
  const call = (p, a) =>
    (window.colony && colony.call ? colony.call(p, a) : Promise.reject(new Error('不在 Colony 里')));
  const decode = r =>
    (r.data
      ? Promise.resolve(Uint8Array.from(atob(r.data), c => c.charCodeAt(0)).buffer)
      : fetch(r.url).then(x => x.arrayBuffer())
    ).then(b => ac.decodeAudioData(b));
  bus.connect(ac.destination);
  bed.connect(bus);
  bed.gain.value = 0.5;
  if (film.music !== false) {
    const m =
      typeof film.music === 'string' &&
      (await call('ai.music', { prompt: film.music })
        .then(decode)
        .catch(() => null));
    if (m) {
      const x = ac.createBufferSource();
      x.buffer = m;
      x.loop = true;
      x.connect(bed);
      x.start();
    } else chords(ac, bed);
    said.push(m ? '背景音乐是音乐模型做的' : '背景音乐是自己合成的');
  }
  const voices = await Promise.all(
    scenes.map(sc => (sc.say ? call('ai.speak', { text: String(sc.say) }).then(decode).catch(e => e) : null))
  );
  voices.forEach((b, i) => {
    if (!b) return;
    if (b instanceof Error) return said.push('第 ' + (i + 1) + ' 场的旁白没念成: ' + b.message);
    const t = scenes[i]._start + 0.3,
      x = ac.createBufferSource();
    x.buffer = b;
    x.connect(bus);
    x.start(t);
    bed.gain.setTargetAtTime(0.15, t, 0.1);
    bed.gain.setTargetAtTime(0.5, t + b.duration, 0.3);
    if (t + b.duration > scenes[i]._end) said.push('第 ' + (i + 1) + ' 场的旁白比这一场长, 压到了下一场');
  });
  return { buf: await ac.startRendering(), said };
}
async function opus(buf) {
  // 每 20 毫秒一块编成 Opus
  const out = [],
    R = buf.sampleRate,
    L = buf.getChannelData(0),
    Rc = buf.getChannelData(1);
  let bad;
  const enc = new AudioEncoder({
    error: e => {
      bad = e;
    },
    output: c => {
      const b = new Uint8Array(c.byteLength);
      c.copyTo(b);
      out.push([c.timestamp, true, b, 2]);
    },
  });
  enc.configure({ codec: 'opus', sampleRate: R, numberOfChannels: 2, bitrate: 128000 });
  for (let i = 0; i < buf.length && !bad; i += 960) {
    const k = Math.min(960, buf.length - i),
      d = new Float32Array(k * 2);
    d.set(L.subarray(i, i + k));
    d.set(Rc.subarray(i, i + k), k);
    const a = new AudioData({
      format: 'f32-planar',
      sampleRate: R,
      numberOfFrames: k,
      numberOfChannels: 2,
      timestamp: Math.round((i / R) * 1e6),
      data: d,
    });
    enc.encode(a);
    a.close();
  }
  await enc.flush();
  enc.close();
  if (bad) throw bad;
  return out;
}

// ═ 导出 ═ 一帧帧画到 1920×1080 的画布上, WebCodecs 编码, 自己拼成 WebM; 不录屏、不用人点、窗口藏起来也照样。
// 有声音就加第二条轨(Opus), 音频块和画面块按时间穿插放进各段
function webm(chunks, W, H, codec, dur, sound) {
  const cat = a => {
    const o = new Uint8Array(a.reduce((n, b) => n + b.length, 0));
    let k = 0;
    a.forEach(b => {
      o.set(b, k);
      k += b.length;
    });
    return o;
  };
  const uint = n => {
    const a = [];
    do {
      a.unshift(n % 256);
      n = Math.floor(n / 256);
    } while (n > 0);
    return new Uint8Array(a);
  };
  const size = n => {
    const b = new Uint8Array(8);
    b[0] = 1;
    for (let i = 7; i > 0; i--) {
      b[i] = n % 256;
      n = Math.floor(n / 256);
    }
    return b;
  };
  const el = (id, ...ps) => {
    const body = cat(
      ps.map(p => (typeof p === 'string' ? new TextEncoder().encode(p) : typeof p === 'number' ? uint(p) : p))
    );
    return cat([new Uint8Array(id.match(/../g).map(x => parseInt(x, 16))), size(body.length), body]);
  };
  const f64 = x => {
    const b = new Uint8Array(8);
    new DataView(b.buffer).setFloat64(0, x);
    return b;
  };
  const cl = [],
    all = chunks.map(c => c.concat(1)).concat(sound || []).sort((a, b) => a[0] - b[0] || a[3] - b[3]);
  let cur = null,
    base = 0;
  all.forEach(([ts, key, data, tr]) => {
    const ms = Math.round(ts / 1000);
    if ((key && tr === 1) || !cur || ms - base > 30000) {
      if (cur) cl.push(el('1F43B675', ...cur));
      base = ms;
      cur = [el('E7', ms)];
    }
    const rel = ms - base;
    cur.push(el('A3', cat([new Uint8Array([0x80 | tr, (rel >> 8) & 255, rel & 255, key ? 0x80 : 0]), data])));
  });
  // Opus 的头: "OpusHead", 版本 1, 双声道, 前补 312, 48000, 增益 0, 映射 0
  const head = new Uint8Array([
    79, 112, 117, 115, 72, 101, 97, 100, 1, 2, 0x38, 1, 0x80, 0xbb, 0, 0, 0, 0, 0
  ]);
  if (cur) cl.push(el('1F43B675', ...cur));
  return cat([
    el(
      '1A45DFA3',
      el('4286', 1),
      el('42F7', 1),
      el('42F2', 4),
      el('42F3', 8),
      el('4282', 'webm'),
      el('4287', 4),
      el('4285', 2)
    ),
    el(
      '18538067',
      el(
        '1549A966',
        el('2AD7B1', 1e6),
        el('4489', f64(dur * 1000)),
        el('4D80', 'Colony 视频引擎'),
        el('5741', 'Colony 视频引擎')
      ),
      el(
        '1654AE6B',
        el('AE', el('D7', 1), el('73C5', 1), el('83', 1), el('86', codec),
          el('E0', el('B0', W), el('BA', H))),
        ...(sound
          ? [el('AE', el('D7', 2), el('73C5', 2), el('83', 2), el('86', 'A_OPUS'), el('63A2', head),
              el('E1', el('B5', f64(48000)), el('9F', 2)))]
          : [])
      ),
      ...cl
    ),
  ]);
}
async function exportVideo(onp) {
  if (!('VideoEncoder' in window)) throw new Error('这个浏览器没有 WebCodecs, 导不了视频');
  const fps = film.fps || 30,
    [W, H] = film.size || [W0, H0],
    n = Math.round(total * fps),
    off = document.createElement('canvas');
  off.width = W;
  off.height = H;
  let codec = 'vp09.00.10.08',
    bad;
  if (!(await VideoEncoder.isConfigSupported({ codec, width: W, height: H })).supported) codec = 'vp8';
  const chunks = [],
    enc = new VideoEncoder({
      error: e => {
        bad = e;
      },
      output: c => {
        const b = new Uint8Array(c.byteLength);
        c.copyTo(b);
        chunks.push([c.timestamp, c.type === 'key', b]);
      },
    });
  enc.configure({ codec, width: W, height: H, bitrate: 4e6, framerate: fps });
  for (let i = 0; i < n && !bad; i++) {
    paint(off.getContext('2d'), W, H, i / fps);
    const f = new VideoFrame(off, {
      timestamp: Math.round((i * 1e6) / fps),
      duration: Math.round(1e6 / fps),
    });
    enc.encode(f, { keyFrame: i % (fps * 2) === 0 });
    f.close();
    if (enc.encodeQueueSize > 6) await new Promise(r => enc.addEventListener('dequeue', r, { once: true }));
    if (i % 10 === 0 && onp) {
      onp(i / n);
      await new Promise(r => setTimeout(r));
    }
  }
  await enc.flush();
  enc.close();
  if (bad) throw bad;
  let sound = null;
  exportVideo.said = [];
  if ('AudioEncoder' in window) {
    const t = await soundtrack();
    exportVideo.said = t.said;
    sound = await opus(t.buf);
  } else exportVideo.said.push('这个浏览器编不了声音, 导出的视频没有声音');
  return new Blob([webm(chunks, W, H, codec === 'vp8' ? 'V_VP8' : 'V_VP9', total, sound)], {
    type: 'video/webm'
  });
}

// ═ 播放器 ═
function load(data) {
  // 换一部片子: 数据进来先自检, 结果挂在「自检」键上
  film = data;
  S = Object.assign({}, BASE, data.style, {
    roles: Object.assign({}, BASE.roles, (data.style || {}).roles),
    rules: Object.assign({}, BASE.rules, (data.style || {}).rules),
  });
  let t = 0;
  scenes = data.scenes.map(sc =>
    Object.assign({}, sc, { _start: t, _end: (t += sc.dur), _parts: parts(sc) })
  );
  total = t;
  document.title = data.title || '视频';
  $('track')
    .querySelectorAll('i')
    .forEach(i => i.remove());
  scenes.forEach(sc => {
    const i = $('track').appendChild(document.createElement('i'));
    i.style.left = (sc._start / total) * 100 + '%';
    i.title = sc.name || sc.title || '';
  });
  const r = check(),
    错 = r.filter(x => x.级 === '错').length;
  $('lint').textContent = 错 ? '⚠ 自检 ' + 错 + ' 处' : '✓ 自检';
  $('lint').style.color = 错 ? S.danger : '';
  $('panel').textContent = r.length
    ? r.map(x => (x.级 === '错' ? '✗ ' : '· ') + x.说).join('\n')
    : '自检全过: 字都放得下, 没有叠在一起, 线没穿过字。';
  seek(0);
  playing = true;
  return r;
}
function size() {
  const W = innerWidth,
    H = innerHeight - 44,
    d = devicePixelRatio || 1;
  cv.width = Math.round(W * d);
  cv.height = Math.round(H * d);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  show();
}
function show() {
  paint(cv.getContext('2d'), cv.width, cv.height, T);
  $('fill').style.width = (T / total) * 100 + '%';
  const m = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  $('time').textContent = m(T) + ' / ' + m(total);
  $('pp').textContent = playing ? '❚❚' : '▶';
}
function seek(t) {
  T = clamp(t, 0, total);
  playing = false;
  show();
  return T;
}
function tick(now) {
  if (playing) {
    T += Math.min(0.1, (now - lastNow) / 1000);
    if (T >= total) {
      T = total;
      playing = false;
    }
    show();
  }
  lastNow = now;
  requestAnimationFrame(tick);
}
const toggle = () => {
  if (T >= total) T = 0;
  playing = !playing;
  show();
};
$('pp').onclick = toggle;
cv.onclick = toggle;
addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    toggle();
  }
});
$('track').onpointerdown = e => {
  const go = ev => {
    const r = $('track').getBoundingClientRect();
    seek(((ev.clientX - r.left) / r.width) * total);
  };
  go(e);
  $('track').onpointermove = ev => {
    if (ev.buttons) go(ev);
  };
};
$('lint').onclick = () => {
  $('panel').style.display = $('panel').style.display === 'block' ? 'none' : 'block';
};
$('exp').onclick = async () => {
  const b = $('exp'),
    was = playing;
  playing = false;
  b.disabled = true;
  try {
    const v = await exportVideo(p => {
      b.textContent = '导出 ' + Math.round(p * 100) + '%';
    });
    const url = URL.createObjectURL(v);
    $('panel').innerHTML =
      '<b>导出好了</b>(' +
      (v.size / 1048576).toFixed(1) +
      ' MB, ' +
      (film.size || [W0, H0]).join('×') +
      ')<br>' +
      exportVideo.said.join('<br>') +
      '<br><video src="' +
      url +
      '" controls style="width:100%;margin-top:8px"></video><br><a download="' +
      (film.title || '视频') +
      '.webm" href="' +
      url +
      '" style="color:' +
      S.accent +
      '">下载 .webm</a>';
    $('panel').style.display = 'block';
    window.lastExport = v;
  } catch (e) {
    $('panel').textContent = '导出失败: ' + e.message;
    $('panel').style.display = 'block';
  }
  b.textContent = '导出视频';
  b.disabled = false;
  playing = was;
};
Object.assign(window, { seek, check, load, exportVideo, getFilm: () => film, help: () => HELP });
addEventListener('resize', size);
(async () => {
  // 在 Colony 里: 应用自己存的片子(store 键 film)优先, 没有就放文件里带的这部
  let data = JSON.parse($('film').textContent);
  try {
    if (window.colony && colony.store) {
      const v = await colony.store.get({ key: 'film' });
      if (v && v.scenes) data = v;
    }
  } catch (e) {}
  load(data);
  size();
  playing = true;
  requestAnimationFrame(n => {
    lastNow = n;
    requestAnimationFrame(tick);
  });
})();
</script>
</body></html>
