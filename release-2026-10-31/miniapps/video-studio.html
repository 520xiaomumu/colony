<script id="boot" type="text/plain">// 导出的 HTML: 读内嵌的工程和素材, 点一下开始播; Colony 点选会问 window.pick
(async () => {
  const $ = id => document.getElementById(id), film = JSON.parse($('film').textContent), A = JSON.parse($('assets').textContent);
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  await Core.load(film, async k => A[k] || null);
  Stage.mount($('cv'), { onTime: t => { $('tf').style.width = (t / Core.total) * 100 + '%'; $('tm').textContent = fmt(t) + ' / ' + fmt(Core.total); $('pp').innerHTML = Stage.playing ? '&#10074;&#10074;' : '&#9654;'; } });
  $('go').querySelector('b').textContent = (film.title || '') + ' · ' + fmt(Core.total);
  if (A.__mix) Stage.setAudio(await Core.decode('__mix'));
  const start = () => { $('go').style.display = 'none'; Stage.play(); };
  $('go').onclick = start; $('pp').onclick = () => Stage.toggle(); $('cv').onclick = () => Stage.toggle();
  $('tl').onclick = e => { const r = $('tl').getBoundingClientRect(); Stage.seek(((e.clientX - r.left) / r.width) * Core.total); };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); $('go').style.display === 'none' ? Stage.toggle() : start(); } if (e.code === 'ArrowLeft') Stage.seek(Stage.t - 5); if (e.code === 'ArrowRight') Stage.seek(Stage.t + 5); });
})();</script>
<script>
'use strict';
const HELP = "视频工坊 · 格式与接口(改片子先读这个; 从零做新片读 video.help('做片'); 做片前先读 video.help('经验'): 流程和踩过的坑)\n工程 = { title, size:[1920,1080] 横屏 | [1080,1920] 竖屏(版式自己重排; 手摆的元素坐标按画幅写), fps:30, bg?: \"glow\"|\"plain\"|颜色名,\n  style?: { 颜色名:\"#hex\", roles:{ 名:[字号,粗细,颜色名,\"mono\"?] } },\n  subStyle?: 'film'(电影字幕: 无底无名牌, 广告和短片用; 默认是深色胶囊带名牌),\n  cast?: { 名字: { voice:\"性别, 年龄, 嗓音, 语速, 说话习惯(一句写死, 定了别改)\" } }, scenes:[场], audio?(工坊写, 别手改) }\n场 = { id:\"s01\"(稳定), name, dur(秒), bg?, tr?: cross 叠化(默认) | cut 硬切 | fade 过黑 | push 推进 | zoom 放大穿过,\n  layout?: split 左图右字(title sub points≤3 at[]) | center 字在下半 | talk 右边聊天气泡 | duo 左右两块(left/right:{label?, points, t?, step?}) | free,\n  title?, sub?, lines?:[台词], lineStart?, subs?:false, els:[元素] }\n台词 = { id:\"l1\", who?, text, tone?:\"语气\", hl?:\"强调词\", t?, d?, gap? }  不写 t/d 按配音真长度排, 没配按每字 0.24 秒\n元素 = { id(场内唯一), type, t(出场秒), out?(退场秒), outFx?: fade|blur|drop, dur?(入场用几秒), flash?:[秒], path?:[[秒,x,y]…] …\n  入场 in: pop 弹 | rise 升起(默认手感) | fade | grow 画出(线/环) | type 打字 | words 逐词升起 | blur 模糊→清楚 | ink 灰→实 | slide 左滑入 | zoom 大→回\n  text {text, x, y, w, n?, role?: title|sub|point|tag|code|small|big|say|hero, size?, color?, align?:center, hl?, bal?}\n  chip {text, x, y, fill?, color?, role?, maxw?, align?}   box/file {x,y,w,h, fill?, stroke?, dash?, r?, label?}\n  icon {text:emoji, x, y, size?, label?}   ring {x,y,r, color?, dot?}   cursor {x,y, label?}   line {from,to(id 或 [x,y]), color?, dash?}\n  window {x?,y?,w?,h?, title?, src?, zoom?:[a,b], focus?:[fx,fy], cam?, fit?}   image/clip {src, x,y,w,h, zoom?, focus?, cam?, box?, mark?, fit?, r?, from?, rate?, cut?, who?, say?}\n    cut:true 抠好的透明图不垫黑底 · who:\"小白\" 出镜角色(他说话时轻轻动、亮, 别人说话时暗) · say:true 他说话时头顶冒气泡写这句(sayY 气泡离图顶多远)\n  推近截图(window/image/clip 都行), 用原图像素写, 不用估比例:\n    box:[x,y,w,h]  一直对准这块            cam:[[0,1,.5,.5],[3,{box:[1300,80,600,400]}]]  0 秒全图 → 3 秒推到这块(两种关键帧可混写)\n    mark:[{box:[x,y,w,h], t:1.2, out?, color?}]  在截图上画高亮框, 跟着推近一起动      video.size(素材键) → [宽, 高]\n  层级: 任何元素 z(默认 0, 大的在上) —— 后加的元素不用再手排\n    镜头: zoom 从出场推到退场, focus 那一点不动; cam [[秒,倍,fx,fy],…] 关键帧推拉摇(场内秒), 停在一帧上时叠高亮框才对得准\n  card {src?, text?, x?,y?,w?,h?}   prompt {text, ph?, x?,y?,w?,h?, delay?, typeDur?}   hero {text, sub?, y?, size?}   panel {x,y,w,h, label?, tone?}   talk {x?,y?,w?,h?}\n画面 横屏 1920×1080 / 竖屏 1080×1920, 四边留 40; 字幕在下方(横屏 y>860 / 竖屏 y>1500 别放字)。地址 \"场id.元素id\" / \"场id.台词id\" / JSON 路径。\n接口(都在 window.video):\n  outline()  一场一行            get(地址)  读一小块\n  patch([{at, set:{…}} | {at, del:[字段]} | {at, value} | {at:\"s1\", add:元素}], {shot?})  改, 回 {ok, changed, check, shot?}; 写错字段直接报错\n  add(场, 元素) / add(场, 台词, \"lines\") / addScene(场, 在谁后?) / remove(地址) / move(场, 位置) / undo() / redo()\n剪辑(场就是片段, 配音和素材跟着走):\n  split(场, 秒)  在场内某秒切成两场        trim(场, 从, 到)  只留这一段        dup(场)  复制一场\n  insert(别的工程id, {scenes?, after?, tr?})  把别的片子的场拼进来     join([工程id…], {title?, tr?})  几部合成一部新片\n  reframe({to:'tall'|'wide'})  另存一个横/竖屏版(原片不动, 已有就打开; 手摆的元素整体等比缩到中间, 再按新画幅调)\n  check(场?)  自检(级: 错 要修 / 提醒 看着办 / 提示 写法可能不对, 只是建议): 放不下 出框 叠字 线穿字 被字幕挡 台词超时长 配音过期 读不完 3秒没变化 首帧空 手机字太小\n  review()  审片: 三张拼图(每场头和中 / 每个切点前后 / 手机宽) 回 dataUrl, 自己看\n  seek(秒|地址)  shot({t?|at?, w?:480})  一帧小图\n  image({prompt, key?, size?, model?, provider?})  生图存素材 → src 用回的 key\n  clip({prompt, image?(素材键), duration?, key?})  生视频存素材(要一两分钟; 取不回网址时 agent 用 browser.fetch 取回再 importVideo)\n  importVideo(dataUrl|网址, {key?, from?, dur?})  视频转成素材(非 webm 会转)    asset.put(键, dataUrl) / asset.get(键)\n  voice({force?})  阶跃 gen3 配音: 按场拼成约 40 秒一段, 每段一次念完再切成一句一段(音色稳); 改了哪段的台词只重念那段\n  music({prompt, vol?, duck?})  阶跃 music 配乐(一两分钟), 有人说话时自动压低\n  export({fmt:html|mp4|webm, res?:720p|1080p|1440p|4K, q?:标准|高|极高, download?})  回 {KB, estKB}\n  toDesk({fmt?:html|mp4|webm, res?, q?})  导出至 Colony 桌面: html 成桌面应用(同一部片子再导只更新那一个), mp4/webm 存进次元口袋; 回 {app | media}\n    界面上: 「🖥 导出至 Colony 桌面」= toDesk, 「⬇ 下载」= export(存到电脑)。工坊要完全访问, 隔离运行时会说怎么开\n后台(一次调用超过一分钟会被掐, 长的都这样起):\n  job('export', {res?, fmt?, at?:[秒…]}) → {id}; job(id) → {state: run|done|err, msg, sec, result}\n    导出完自查: 每 0.5 秒扫黑帧(dark 有值必修)、每场抽一帧拼成一张图; result.copy 给出片子和拼图的键\n    → 宿主 data.copy {from: copy.video, to:'media:'} 进口袋(带文件名), 拼图同样搬了自己看, 片子 [[show:]] 给用户\n  job('voice') / job('music', {prompt, wait?:150}) / job('narrate', 旁白dataUrl, [台词地址…])  同上\n    music 一次最多等 wait 秒(厂商常卡), 超时就留着原来的配乐(fromProject 带过来的), 回 {timeout:true}\n    voice 只认 force / fit, music 只认 prompt / vol / duck / wait, 写别的直接报错\n素材进来:\n  take({素材名: 原件…})  一次收几张, 回各自 [宽, 高]。工坊读不了口袋: agent 用 frame.eval 不行, 要 call {path:'stem.invoke'…} 也不行 →\n    最省事: 宿主 data.copy {from:'media:…', to:'appstore:<工坊id>:a:素材名'}(外壳会自动拆)\n  asset.put 收任何形状: dataUrl / {name,dataUrl} 外壳 / 标错类型的 jpeg 都自动洗; 同名换图立即生效\n  keyOut(素材, 新名?)  绿幕抠像 → 透明 PNG(人物先用改图模型换成纯绿底)\n  narrate(旁白dataUrl, [\"s1.l1\",\"s2.l1\"…])  外面念好的一整段, 逐字对齐切成一句一段挂上台词; low 里是可能念错的句\n起新片:\n  fromProject(上一集id, {title, scenes}, 新id?)  角色音色、配色、字幕样式、背景、配乐跟上一集, 只换场\n找镜头:\n  sheet({src:'rec.s4', from:0, to:60, step:2})  录屏每 2 秒一格拼成一张, 格上标秒数 → 定 from / out\n  sheet({src, at:[30,40], crop:[1270,0,650,846], grid:200})  只看一块、叠网格(标原片像素) → 直接读出 box 坐标\n  sheet({from:10, to:30, step:1})  不给 src 就抽成片(工程时间)\n  拿到的是 dataUrl: 存 colony.store, 宿主 data.copy 进口袋再看\n  list() open(id) create(工程, id?) delete(id) rename(名)    pending(清?)  用户点画面「交给 agent」留的单子 [{at, ask, where}]\n点选: 用户停在画面上点 → 卡片(第几场 · 几秒 · 位置); 卡片发来的 at 直接 get → patch, 只动那一处。", HELP_MAKE = "做片 · 从零做一部片子的方法(学自 HyperFrames, 按工坊改写)\n0 先问清(只问用户能答的): 给谁看、多长、横竖、要不要配音; 其余自己定, 一行写明假设。\n1 一件事: 用一句话写「看完要记住什么」(用观众的话, 不是口号)。选一个真人做一件真事, 一个真实的东西(一句话、一个文件、一个数字)从开头走到结尾, 这是脊梁。\n  事实和创意分开: 屏幕上每句话都要能追到出处(源码、文档、用户原话); 出处没说的别说, 示意的数字标「示意」。\n2 三条故事线, 再定一条: 先写五个以上点子(一个手法 + 一种镜头), 留差得最远的三条, 其中一条要大胆。每条写: 名字、头两秒画面、节拍一行(钩子 → … → 结尾卡)、长相一行、声音一行。把推荐放第一并说一句为什么; 给用户挑, 挑完前什么都别做。\n  手法: 某人一天里的一刻 / 一个角色在干活(光标、吉祥物) / 功能本身当钩子 / 先给结果再拉远 / 一个东西穿过几个应用 / 以前和以后 / 大字带着论点走 / 一个数字落地 / 带着输入的问句 / 机器本身就是讲解\n3 SPEC: 把形容词换成数字再动手。写在工程的 spec 字段里(工坊不画它):\n  看点: 一句话 · 长度: 秒 · 字: 字体、主标字号、强调色只给一个词 · 镜头表: 每场一行(秒数, 唯一的主动作, 观众读到什么, 声音, 怎么交给下一场) · 禁用: 下面这些默认相 + 这片不许变成的样子\n  「高级」= 一种材质加数字; 「干净」= 网格和配额(强调色每场只给一个词); 「有劲」= 换场踩拍、每场只有一个主动作\n4 动手(工坊里怎么做):\n  - 画面: 能用代码画的就画(实时版 HTML 最小, 能点选); 真产品界面用录屏(window + clip, 推拉用 zoom/focus); 要实景或角色用 image / clip 生成, 先生首帧图再图生视频, 素材定下来再排。\n  - 主角至少占画面四成高或宽; 一场只有一个主动作; 字一行最多 6 个词(中文约 12 字), 一次只上一行; 停留 = 每词 0.3 秒 + 0.5 秒, 最后一行至少 2 秒。\n  - 动效: 入场 rise/blur/words(先快后慢), 移动 path(两头慢、快的那几帧自带模糊), 退场 out(先慢后快); 同一片别每场都同一种入场。\n  - 转场: 默认 cross 叠化; 同一段话接着说用 cut 或 cross; 只在真换了话题、时间、地点时用 fade 过黑; push/zoom 一部片最多一两次, 要有画面上的理由(点了按钮推进去)。别为了「多样」换转场, 转场越不被注意越好。\n  - 配音: cast 里给每个角色定音色和一贯的说话方式; 每句写 tone(具体情绪, 如「有点不信, 尾音上扬」, 别写「平静」); 台词要像人说话: 有接话、有反应、有停顿, 别一个人连念五句说明。\n  - 品牌: logo 只在结尾卡重重落一次, 不在角落挂小图标; 强调色省着用: 一个高亮词、结论、结尾卡。\n5 两道检查:\n  check(): 坏了的 → 全修掉(故意的写进说明)。\n  review(): 弱的 → 用严苛动效导演的眼光看三张拼图: 每帧用一句话描述(要解释才懂的东西是 P0); 只看画面能不能讲完故事; 每个切点有没有跳; 手机宽能不能读。问题分 P0(看不懂/坏) P1(弱) P2(可更好), 修完 P0 P1 再交。\n6 交付: 导出前看 estKB; 回给用户: 推荐的那条故事线、两条备选各一句、假设、已知 P2、导出大小。\n禁用的默认相(看到就换): 黑底上飘几个小东西 / 光晕粒子 / 米色纸+衬线+等宽标签 / 所有东西都淡入上滑 / 三张卡并排 / 角落挂 logo / 每场同一种入场 / 左右分屏和浮卡代替一场戏 / 标题落定后还在慢慢动 / 呼吸、漂浮循环代替动作 / 「隆重推出」「无缝」「赋能」「一键」「秒级」(没量过别说)。\n  注意: 工坊自带的 glow 底、duo 分屏、card 浮卡本身就是这些默认相, 用要有理由: glow 只做开头结尾的底, duo 只在真要对比两件事时用, card 只放真截图。", HELP_EXP = "经验 · 宣传片系列 1–4 集学到的, 照这个走少返工\n顺序: 问设定 → 读源码列事实表(每条带出处) → 实测要说的话 → 写稿 → Gemini 对着事实表审 → 用户批 → 配音小样(和上一集同角色比) → 全片配音 → 录屏/截图 → 画面 → job('export') → Gemini 审(720p) → 修 → 交。\n需求:\n- 「这集不讲某功能」≠「不用它的画面」: 讲到的都用真截图/真录屏。\n- 真事 > 编的情节: 做片途中真出的错、真写的功能, 录下来就是最有力的一场(第 3 集改自己源码、第 4 集现写皮肤)。\n- 先看源码再写稿: 第 4 集第一版只写了眼手, 漏了「不用 AI 拖进来就能改」「录视频」「套娃」, 用户点出才补。\n录屏(第 4 集):\n- 要拍 agent 干活: 把请求真发进对话框(页面里 setTimeout 打字回车, 这一轮先结束), 下一轮就是对话框里的请求, 工具卡一条条滚; 录前先展开对话栏(收成球时只看得到一个小卡)。在自己这一轮里录, 对话栏是静的。\n- 授权: 界面设置里「🎬 授权录屏」点一次, 改块重启也不丢; 只有刷新页面要重点。\n- 录屏 1920 宽整张塞进 1000 宽的窗 = 字缩到一半看不清: 窗放大(1120×648), 每个镜头 box 只框要看的那块(缩放 ≥ 0.9), 关键处 cam 推近 + mark 画框; 自检会报「缩到 xx%」。\n- 找镜头: sheet({src, step}) 先粗看, 再 sheet({src, at, crop, grid}) 读坐标; 别手写抽帧。\n- 录屏里我等工具的时间都在, 一段 100 多秒只用几秒: from 跳到动作那一秒, rate 1.5–5 快进等待。\n- 演示要人拖文件时: 自己造 DragEvent + 画一个跟手的文件卡片; 拖出去造 dragstart 再叠一条「已存到电脑」。\n- 录屏里的 Key 和本机地址: 先别拍到那页; 拍到了用 box 裁掉或盖一块。\n声音:\n- 角色音色 = cast.voice 一句写死, fromProject 自动带; 新集配完先拿一句和上一集比(Gemini 打分), 低于 9 就改那句 tone 重配。\n- 音色全变(男角色变女声、情绪变平)= 角色描述根本没送到厂商: 查 AI 配置里阶跃 tts 的 body 有没有 roles:'{roles}' 和 scripts:'{scripts}'(第 5 集被改回只送一句 {text}, 全片一个默认女声)。配完看自检的音高: 男 80–130 Hz、女 200–350 Hz。\n- HTTP 451 = 内容审核拦了一句: 一场一场试出是哪句, 换个说法(「关了重开验验货」被拦, 「重新打开试试」就过)。\n- 外面配好的旁白用 narrate, 别按静音切。\n- 配乐常超时: music 有 wait 兜底, 系列片沿用上一集配乐也更统一。\n画面:\n- 卡通角色换装: imageEdit 照上一集的图「脸、发型、画风、构图不变, 只换衣服」+ 纯绿底 → keyOut; 换背景另生一张。\n- 截真界面: 宿主 browser.screenshot(frame.screenshot 不认滚动); 截前请用户留在前台。\n- 后加的元素在上层: 用 z。\n检查与交付:\n- 自检 0 错再导出。job('export') 的 dark 有值必修; 自查跳过(页面在后台)时用 sheet 抽成片看。\n- Gemini 看片送 720p(1080p 60 MB 会超时), 要 mp4; 让它带秒数说问题, 它说的事实回事实表核。\n- 交付: 「🖥 导出至 Colony 桌面」(HTML 成桌面应用, 再导只更新那一个; 工坊要完全访问)。成片 mp4 不必留口袋, 工程素材在就能重导。\n坑:\n- 一次调用超过一分钟被掐: 长活一律 job(), 隔 50 秒 job(id) 看。\n- 页面在后台(用户切去别的标签页)时浏览器不解码视频: 导出能跑, 自查和 sheet 会卡/跳过。\n- 改界面块会重启, 页面上的东西(授权、窗)要能挺过去。\n- 动作回整份代码会被存成大引用(改名曾回 30 MB): 能力回简述就好。\n- 语气(tone)写发音状态, 不写动作: 「轻笑一声, 慢悠悠」「倒吸一口气, 惊喜拔高」行; 「指那一行」「撸袖子」「托腮」模型念不出, 会念平。台词口语化, 带「诶/嘛/呢/啊」和接话反应, 不然像各念各的。小白类活泼角色别写「屏住呼吸」「小声嘀咕」, 会念成气声像换了人, 写「正常音量 + 情绪」。\n- 一段内同一角色音色也会漂(gen3 每次念的音色有出入): 要稳就每段念 3 次, 截出主角的句子给 Gemini 比(跟上一集的一句比 + 段与段两两比, 交换顺序问几次), 选定后 narrate(那一条, [台词地址…]) 挂上。";

// 外面念好的一整段旁白挂到台词上: 逐字对齐切成一句一段, 每句一个素材, 场长按台词撑开。lines: [地址] 按念的顺序

    const sid = r.scene.id, lid = r.line.id; next.audio.lines[sid + '.' + lid] = { who: r.line.who, text: r.line.text, tone: r.line.tone || '', key, dur: +seg.duration.toFixed(2), gap: null }; rep.push([sid + '.' + lid, +seg.duration.toFixed(2), +x.sim.toFixed(2)]); }

// 一次收好几张素材: {素材名: 原件}; 原件可以是 dataUrl、口袋文件 {name,dataUrl}(宿主用 {"$ref":"media:…"} 递进来)。工坊在隔离窗里读不了口袋, 要宿主递

// 绿幕抠像: 人物图(纯绿底)→ 透明 PNG 素材; 绿占优的去掉, 边上半透明并去溢色
async function keyOut(src, key) {
  const im = new Image(); im.src = cleanDu(assetCache.get(src) || (await asset(src)) || src); await im.decode();
  const W = im.naturalWidth, H = im.naturalHeight, cv = new OffscreenCanvas(W, H), g2 = cv.getContext('2d'); g2.drawImage(im, 0, 0);
  const d = g2.getImageData(0, 0, W, H), p = d.data; let cut = 0;
  for (let i = 0; i < p.length; i += 4) { const r = p[i], gg = p[i + 1], b = p[i + 2], m = Math.max(r, b), s = gg - m;
    if (s > 60 && gg > 110) { p[i + 3] = 0; cut++; } else if (s > 18) { p[i + 3] = Math.round(255 * (1 - (s - 18) / 42)); p[i + 1] = m; } else if (s > 0) p[i + 1] = m + s * 0.3; }
