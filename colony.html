  }
  ctx.on('providers:changed', () => { clearTimeout(checkRecover._t); checkRecover._t = setTimeout(checkRecover, 800); });
  /* 运行可视化工厂: 画布▶(execViz)与"agent/别处发起的运行常驻订阅"共用同一套上色/日志/扩图逻辑——不再两套画布代码。
     markSidebar: editor 运行不在 Eph.list, 需 runningWf 补标侧栏"运行中"; agent 运行已在 Eph.list 露出, 传 false 免重复标。 */
  function createRunViz(runWf, markSidebar) {
    const vis = () => cur === runWf && !ephView;         // 是否正看着这个工作流(决定是否更新 UI, 不影响数据累积)
    const log = studio.querySelector('#wf-log'); log.style.display = 'block';
    const logBody = logShell(log, true); logBody.innerHTML = ''; logCount(log, 0);
    studio.querySelectorAll('.wf-node').forEach(el => { el.classList.remove('run-active', 'run-done', 'run-error'); const d = el.querySelector('.wf-node-dur'); if (d) d.remove(); });
    slimPorts(runWf);   // 运行态: 收起没用到的端口, 生成内容不再被空端口挤没
    const nodeEl = id => vis() ? studio.querySelector('.wf-node[data-node-id="' + id + '"]') : null;
    const addLog = (t, c) => {
      if (!vis()) return;
      const d = document.createElement('div'); d.className = 'log-line' + (c ? ' ' + c : '');
      d.textContent = t; logBody.appendChild(d); logBody.scrollTop = logBody.scrollHeight;
      logCount(log, logBody.children.length, c === 'error');
    };
    const active = new Set(); let lastFocus = 0;
    setRunning(true);
    const t0 = Date.now(); const tick = setInterval(() => { if (vis()) setRunning(true, Date.now() - t0, active.size); }, 500);
    const rk = runWf.id || runWf; if (markSidebar) { runningWf.set(rk, (runningWf.get(rk) || 0) + 1); refreshHome(); }   // 侧栏标该工作流"运行中"(计数防并发提前消失)
    return {
      onStart: rec => { curRec = rec; },                 // 当前现场=本次运行(切走随会话快照, 切回回放还原)
      onEvent: e => {
        if (e.type === 'node:start') {
          active.add(e.nodeId);
          const el = nodeEl(e.nodeId);
          if (el) {
            el.classList.add('run-active');
            const r = el.querySelector('.wf-node-result');
            if (r) { r.style.display = 'block'; r.innerHTML = '<span class="sm">● 运行中…</span>'; }
          }
          if (vis() && Date.now() - lastFocus > 500) { lastFocus = Date.now(); focusNode(e.nodeId); }
          if (vis()) highlightRunEdges(active);
        }
        else if (e.type === 'node:done') {
          active.delete(e.nodeId);
          applyNodeDoneUI(nodeEl(e.nodeId), e);
          if (vis()) highlightRunEdges(active);
        }
        else if (e.type === 'node:error') {
          active.delete(e.nodeId);
          applyNodeErrorUI(nodeEl(e.nodeId), (e.code ? e.code + ': ' : '') + (e.error || '出错'));
          if (vis()) highlightRunEdges(active);
        }
        else if (e.type === 'graph:patch') {
          patchIntoGraph(runWf, e);
          autoLayout(runWf);   // 扩图即自动分层, 不再堆叠(runWf 非当前视图时只改坐标不渲染)
          if (vis()) { renderCanvas(); requestAnimationFrame(() => { highlightRunEdges(active); slimPorts(runWf); }); }
        }
        else if (e.type === 'workflow:cancelled') {
          active.clear();
          if (vis()) studio.querySelectorAll('.wf-node.run-active').forEach(el => { el.classList.remove('run-active'); const rr = el.querySelector('.wf-node-result'); if (rr) { rr.style.display = 'block'; rr.innerHTML = '<span class="sm">■ 已停止</span>'; } });
        }
        const lf = logFor(e); if (lf) addLog(lf.t, lf.c);
      },
      finish: () => {
        clearInterval(tick);
        if (vis()) { setRunning(false); highlightRunEdges(new Set()); }
        if (markSidebar) { const c = (runningWf.get(rk) || 1) - 1; if (c <= 0) runningWf.delete(rk); else runningWf.set(rk, c); refreshHome(); }
        if (vis()) refreshDrawerIfOpen();
      }
    };
  }
  /* 画布▶: 发起本工作流运行, 用 createRunViz 实时可视化。运行/事件累积/落盘归 Eph.run 唯一管道, 本函数只做视觉订阅。 */
  async function execViz(initial) {
    const runWf = cur;                                   // 锚定本次运行的工作流(切走后 cur 会变, 数据仍写 runWf)
    const viz = createRunViz(runWf, true);
    try {
      await Eph.run(Object.assign({}, runWf, { initialInputs: initial }), { source: 'editor', onStart: viz.onStart, onEvent: viz.onEvent });
    } finally { viz.finish(); }
  }
  /* agent/SDK 别处发起的运行常驻订阅: 只要跑的是当前画布打开的工作流(workflowId===cur.id), 就自动用同款可视化实时画上画布——不再"agent 一跑就默默后台看不见"。
     editor(画布▶)/single(单跑节点)自带可视化, 跳过免重复画; 不匹配当前工作流的运行不画(用户没看着)。 */
  function bindLiveRunViz() {
    if (bindLiveRunViz._bound) return; bindLiveRunViz._bound = true;
    const live = new Map();   // rec.id → viz 实例
    Eph.onRunEvent((phase, rec, ev) => {
      if (rec.source === 'editor' || rec.source === 'single') return;
      if (phase === 'start') {
        if (!cur || rec.workflowId !== cur.id || live.has(rec.id)) return;
        const viz = createRunViz(cur, false); viz.onStart(rec); live.set(rec.id, viz);
      } else if (phase === 'event') {
        const viz = live.get(rec.id); if (viz) viz.onEvent(ev, rec);
      } else if (phase === 'done') {
        const viz = live.get(rec.id); if (viz) { viz.finish(); live.delete(rec.id); }
      }
    });
  }
  function mergePatchEvents(rec) {
    for (const e of rec.events) if (e.type === 'graph:patch') patchIntoGraph(cur, e);
    if (rec.events.some(e => e.type === 'graph:patch')) autoLayout(cur);   // 回放含扩图的历史运行 → 一并理清布局
  }
  function replayHighlight(rec) {   // 按每节点最后事件着色; 回传 active 集(replayRunUI 的边线高亮/运行钟直接用, 不再重算)
    const last = {}, active = new Set();
    for (const e of rec.events) { if (e.nodeId) last[e.nodeId] = e.type; }
    for (const id of Object.keys(last)) if (last[id] === 'node:start' || last[id] === 'node:queued') active.add(id);
    studio.querySelectorAll('.wf-node').forEach(el => {
      const t = last[el.dataset.nodeId];
      el.classList.toggle('run-done', t === 'node:done');
      el.classList.toggle('run-error', t === 'node:error');
      el.classList.toggle('run-active', t === 'node:start' || t === 'node:queued');
    });
    return active;
  }
  /* 历史回填: 从 rec.events 取每节点最后一次 node:done 的 outputs, 回填到画布节点(重进/打开历史运行不再空白) */
  function replayNodeOutputs(rec) {
    if (!rec || !studio) return;
    const lastDone = {};
    for (const e of (rec.events || [])) { if (e.type === 'node:done') lastDone[e.nodeId] = e; }

      const r = el.querySelector('.wf-node-result'); if (r) renderNodeResult(r, ev.outputs);
      setDur(el, ev.duration);

  function replayRunUI(rec) {     // 切回/打开时完整还原运行现场: 节点状态 + 输出/耗时 + 日志 + 活动边线 + 运行按钮(按 status)
    if (!rec || !studio) return;

    slimPorts(Object.assign({}, cur, { edges: (cur && cur.edges) || (rec.workflow && rec.workflow.edges) || [] }));   // 回放态同样收起未用端口(尺寸变化自动触发 settle 避让)
    const log = studio.querySelector('#wf-log');
    if (log) {
      let h = '', errN = false, n = 0;

  }

  /* ════ 在壳侧栏(Desktop 下方): 工作流列表 + 即焚运行中; 点击切主区页(零闪), ✕ 删除。"+新工作流"在此单点建(首页/打开/切回都经此, 故首次首页即有入口) ════ */

  return {
    api: { open: openWorkflowPage, runEphemeral: (wf, opts) => Eph.run(wf, opts) },
    dispose() {
      if (ensureStudio._keys) { document.removeEventListener('keydown', ensureStudio._keys); ensureStudio._keys = null; }
      if (studio) studio.remove(); studio = null;
      const u = ui();
      if (u && u.sidebarSlot) {
        const s = u.sidebarSlot();
        if (s) {
          s.innerHTML = '';
          const sidebar = s.closest && s.closest('.app-sidebar');
          const nb = sidebar && sidebar.querySelector('.wf-ss-new');
          if (nb) nb.remove();
        }
      }
      if (deskItem) { if (deskItem.__wfOnDesk) { deskItem.removeEventListener('click', deskItem.__wfOnDesk); deskItem.__wfOnDesk = null; } deskItem.classList.add('active'); deskItem = null; }
    },
  };
})
</script>
</body>
