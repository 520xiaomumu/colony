  /* sys:bridge — 远程 agent 桥接: Foundation.Net + Agent.BridgeClient(colony-agent-v2 协议: 持久名单/在线圆点/chatId 关联/msgId 幂等/离线留言); 服务器/接入器随接入包分发(本仓 blocks/ 下只有 7 个块源, 无它们的副本)。
     架构: ① settings 走 ctx.kv('settings:'前缀); ② IM 语义 — 成员关系归用户(批准/撤销/删除), 在线状态归连接; ③ 设置区经 ui 插槽注册; ④ 成员/消息变化经事件总线广播给 agent dock。
     工具平行通道(tool-call)已删 — agent 操作 Colony 走引擎, 不走桥。 */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const Store = { settings: {
    get: (k, d) => ctx.kv.get('settings:' + k).then(v => (v === undefined || v === null) ? (d === undefined ? null : d) : v),
    set: (k, v) => ctx.kv.set('settings:' + k, v),
  } };

/* ===========================================================================
 * @module      Foundation.Net
 * @summary     网络出口 + 超时(bridge 连 localhost/内网, 不做 CORS 代理, 无重试——瞬时错误由 BridgeClient 长轮询/接入器退避各自兜)。
 *              聊天流由 EventSource(信箱档)/ Endpoints 内部 SSE 解析(直连档)各自处理, 此处不含 SSE。
 * @publicAPI   fetch
 * =========================================================================== */
const Net = (() => {
  async function netFetch(url, options = {}) {
    const { timeout = 60000, ...fetchOpts } = options;
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeout);
    try { return await fetch(url, { ...fetchOpts, signal: ctrl.signal }); }
    finally { clearTimeout(t); }
  }
  return { fetch: netFetch };
})();
/* ===========================================================================
 * @module      Agent.BridgeClient
 * @summary     连接 bridge server 的客户端(colony-agent-v2 协议)。IM 语义:
 *              成员名单持久(在线/离线只是圆点翻牌), 消息按 chatId 关联、msgId 幂等,
 *              离线成员可留言(服务器持久日志, 对方回归按游标补投)。
 * @dependsOn   Foundation.Store, Foundation.Net
 * @publicAPI   init, listBridges, addBridge, removeBridge, connect, disconnect,
 *              isConnected, diagnose, allOnlineMembers, allPendingRequests,
 *              approveMember, rejectMember, fetchAgents, revokeMember,
 *              reapproveMember, removeMember, chatWithMember, onMembers, onMessage
 *
 * ── colony-agent-v2 协议 (Colony 一侧, 对应 colony-bridge.js 服务端) ──
 *   GET  {base}/colony-agent/v2/health   → 指纹 {service:'colony-bridge', protocolVersion:2}
 *   GET  {base}/colony-agent/v2/members  → { members:[{agentKey,name,online,..}], pending, revoked }
 *   GET  {base}/colony-agent/v2/events   → SSE: ready / member-pending·joined·updated·online·offline·removed·rejected / message / status / chat-done
 *   POST {base}/colony-agent/v2/chat     {to:agentKey, content, chatId, msgId} → {ok, seq, chatId, online, queued}
 *   POST {base}/colony-agent/v2/approve|reject|revoke|reapprove|remove
 *
 * 数据形态 (settings 'agent.bridges'): [{ id, name, baseURL, token?, autoConnect? }]
 * 成员的稳定身份是 agentKey(跨重连不变); 对上层暴露 id=agentKey。
 * =========================================================================== */
const BridgeClient = (() => {
  const KEY = 'agent.bridges';
  const connections = new Map(); // bridgeId → { bridge, members[], pending[], status, es, chatWaiters:Map }
  const memberListeners = new Set();
  const messageListeners = new Set();

  function init() {
    listBridges().then(list => {
      for (const b of list) if (b.autoConnect) connect(b.id).catch(() => {});
    });
  }

  async function listBridges() { return (await Store.settings.get(KEY, [])) || []; }
  async function save(arr) { await Store.settings.set(KEY, arr); }

  async function addBridge(b) {
    const list = await listBridges();
    if (!b.id) b.id = crypto.randomUUID();
    if (!b.name) b.name = 'Bridge';
    list.push(b);
    await save(list);
    return b;
  }
  async function removeBridge(id) {
    disconnect(id);
    await save((await listBridges()).filter(x => x.id !== id));
  }

  function onMembers(fn) { memberListeners.add(fn); return () => memberListeners.delete(fn); }
  function onMessage(fn) { messageListeners.add(fn); return () => messageListeners.delete(fn); }
  function emitMembers() { for (const fn of memberListeners) try { fn(); } catch {} }
  function emitMessage(payload) { for (const fn of messageListeners) try { fn(payload); } catch {} }

  function authHeaders(bridge) {
    return bridge.token ? { 'Authorization': 'Bearer ' + bridge.token } : {};
  }

  /**
   * 阶梯式探测 — 把"连不上"精确归类, 每种失败给确定的下一步指引
   * @returns { ok, stage, code, message, hint, info? }
   *   code: 'OK'|'TIMEOUT'|'REFUSED'|'NOT_BRIDGE'|'OLD_BRIDGE'|'BAD_TOKEN'
   */
  async function diagnose(baseURL) {
    const base = (baseURL || '').replace(/\/+$/, '');
    if (!base) return { ok: false, code: 'EMPTY', message: '请输入 bridge 地址', hint: '形如 http://localhost:7777' };
    if (!/^https?:\/\//.test(base)) return { ok: false, code: 'BAD_URL', message: '地址要以 http:// 开头', hint: '例如 http://localhost:7777' };

    // 阶 1: /health (无需 token, 纯锚点)
    let health;
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 8000); // 云端桥(CF Worker+DO)冷启动+跨网可达 2~5s, 3s 太紧会误判健康桥"没启动"(实测)
      const res = await fetch(base + '/colony-agent/v2/health', { signal: ctrl.signal }).finally(() => clearTimeout(t));
      if (!res.ok) return { ok: false, stage: 1, code: 'NOT_BRIDGE', message: '端口有响应但不是 Colony bridge (HTTP ' + res.status + ')',
        hint: '可能填错端口。确认填的是 bridge 控制台显示的端口, 不是模型端口(如 ollama 11434)。' };
      health = await res.json().catch(() => null);
    } catch (e) {
      const aborted = e.name === 'AbortError';
      return { ok: false, stage: 1, code: aborted ? 'TIMEOUT' : 'REFUSED',
        message: aborted ? '8 秒无响应' : '连接被拒绝 (Failed to fetch)',
        hint: aborted
          ? '最可能: bridge 没启动, 或地址填错。云端桥冷启动偶尔较慢, 可再点一次连接; 本机桥请确认 colony-bridge.js 在跑、端口与控制台一致。'
          : '两种可能: (a) 端口没开 — bridge 没跑; (b) CORS 被拦 — bridge 版本过旧。\n在 bridge 所在机器执行:  curl ' + base + '/colony-agent/v2/health\n  能通 = 版本过旧(重新导出新版 bridge); 不通 = bridge 没跑起来。' };
    }

    // 阶 2: 指纹 + 协议版本
    if (!health || health.service !== 'colony-bridge') {
      return { ok: false, stage: 2, code: 'NOT_BRIDGE', message: '这个端口有服务, 但不是 Colony bridge',
        hint: '请确认填的端口是 colony-bridge.js 控制台打印的那个。' };
    }
    if (health.protocolVersion !== 2) {
      return { ok: false, stage: 2, code: 'OLD_BRIDGE', message: 'bridge 是旧版协议(' + (health.version || 'v1') + '), 本页需要 v2',
        hint: '在 Colony「远程 agent 桥接」重新导出接入包, 用新的 colony-bridge.js 重启(名单会自动迁移, 已批准的 agent 不用重批)。' };
    }

    // 阶 3: 该桥若开了 token 鉴权 — 本页已简化为无 token 接入, 如实拦下(想连就在 bridge 侧关掉鉴权)
    if (health.tokenRequired) return { ok: false, stage: 3, code: 'BAD_TOKEN', message: 'bridge 开了 token 鉴权, 本页简化接入不带 token', hint: '在 bridge 侧关掉 token 要求再连。' };

    return { ok: true, code: 'OK', message: '✓ bridge 可用', info: { version: health.version, tokenRequired: !!health.tokenRequired, members: health.members } };
  }

  /** 连接 bridge: 拉名单 + 建 SSE 长连接接收推送 */
  async function connect(bridgeId) {
    const list = await listBridges();
    const bridge = list.find(b => b.id === bridgeId);
    if (!bridge) throw new Error('bridge 不存在');
    if (connections.has(bridgeId)) return connections.get(bridgeId);

    // 先阶梯探测, 失败给精确原因
    const diag = await diagnose(bridge.baseURL);
    if (!diag.ok) { const err = new Error(diag.message); err.diag = diag; throw err; }

    const base = bridge.baseURL.replace(/\/$/, '');
    const res = await Net.fetch(base + '/colony-agent/v2/members', { headers: authHeaders(bridge), timeout: 8000 });
    if (!res.ok) throw new Error('连接 bridge 失败: HTTP ' + res.status);
    const data = await res.json();

    const conn = { bridge, members: data.members || [], pending: data.pending || [], status: 'connected', es: null, chatWaiters: new Map() };
    connections.set(bridgeId, conn);

    // 成员 upsert: 撤销态从名单摘掉(管理面板的"已撤销"组走 fetchAgents 按需拉)
    const upsert = (m) => {
      const i = conn.members.findIndex(x => x.agentKey === m.agentKey);
      if (m.status === 'revoked') { if (i >= 0) conn.members.splice(i, 1); }
      else if (i >= 0) conn.members[i] = m;
      else conn.members.push(m);
    };

    // SSE 长连接接收主动推送 (EventSource 原生自动重连; token 走 query)
    try {
      const evUrl = base + '/colony-agent/v2/events' + (bridge.token ? '?token=' + encodeURIComponent(bridge.token) : '');
      const es = new EventSource(evUrl);
      conn.es = es;
      // ready: 初次连接 + 每次自动重连后都会收到, 用服务端最新名单覆盖
      es.addEventListener('ready', (e) => {
        try { const d = JSON.parse(e.data); if (d.members) conn.members = d.members; conn.pending = d.pending || []; } catch {}
        conn.status = 'connected'; emitMembers();
      });
      es.addEventListener('member-pending', (e) => { const p = JSON.parse(e.data); if (!conn.pending.find(x => x.pendingId === p.pendingId)) conn.pending.push(p); emitMembers(); });
      es.addEventListener('member-rejected', (e) => { const d = JSON.parse(e.data); conn.pending = conn.pending.filter(x => x.pendingId !== d.pendingId); emitMembers(); });
      es.addEventListener('member-joined', (e) => { upsert(JSON.parse(e.data)); emitMembers(); });
      es.addEventListener('member-updated', (e) => { upsert(JSON.parse(e.data)); emitMembers(); });
      es.addEventListener('member-online', (e) => { const d = JSON.parse(e.data); const m = conn.members.find(x => x.agentKey === d.agentKey); if (m) { m.online = true; emitMembers(); } });
      es.addEventListener('member-offline', (e) => { const d = JSON.parse(e.data); const m = conn.members.find(x => x.agentKey === d.agentKey); if (m) { m.online = false; emitMembers(); } });
      es.addEventListener('member-removed', (e) => { const d = JSON.parse(e.data); conn.members = conn.members.filter(x => x.agentKey !== d.agentKey); emitMembers(); });
      // 消息路由: 正在等这轮 chatId 的对话有人认领就喂它, 否则当群聊冒泡
      es.addEventListener('message', (e) => {
        const p = JSON.parse(e.data);
        const w = p.chatId && conn.chatWaiters.get(p.chatId);
        if (w) w.push(p); else emitMessage({ bridgeId, ...p });
      });
      es.addEventListener('chat-done', (e) => { const p = JSON.parse(e.data); const w = p.chatId && conn.chatWaiters.get(p.chatId); if (w) w.end(); });
      es.addEventListener('status', (e) => { const p = JSON.parse(e.data); emitMessage({ bridgeId, role: 'status', from: p.from, content: '⋯ ' + p.status }); });
      es.onerror = () => { conn.status = 'reconnecting'; emitMembers(); /* EventSource 自动重连, ready 恢复名单 */ };
    } catch (e) {
      conn.status = 'connected-no-push';
    }
    emitMembers();
    return conn;
  }

  function disconnect(bridgeId) {
    const conn = connections.get(bridgeId);
    if (conn) { try { conn.es && conn.es.close(); } catch {} connections.delete(bridgeId); emitMembers(); }
  }

  // reconnecting 期 EventSource 正在自动恢复, 仍算在线(避免 UI 闪断)
  function isConnected(bridgeId) { const c = connections.get(bridgeId); return !!c && (c.status.startsWith('connected') || c.status === 'reconnecting'); }

  /** 全部已批准成员(含离线 — IM 名单语义; m.online 区分圆点)。id=agentKey 稳定身份 */
  function allOnlineMembers() {
    const out = [];
    for (const [bridgeId, conn] of connections) {
      for (const m of conn.members) out.push({ ...m, id: m.agentKey, bridgeId });
    }
    return out;
  }

  /** 待接入请求(等用户点确认)。id=pendingId */
  function allPendingRequests() {
    const out = [];
    for (const [bridgeId, conn] of connections) {
      for (const p of (conn.pending || [])) out.push({ ...p, id: p.pendingId, bridgeId });
    }
    return out;
  }
  async function decideMember(bridgeId, pendingId, action) {   // 审批走名单管理同一通道(曾各抄一份 POST 骨架), 只多本地 pending 剔除+广播
    const j = await manageCall(bridgeId, action, { pendingId });
    const conn = connections.get(bridgeId);
    if (conn) { conn.pending = (conn.pending || []).filter(x => x.pendingId !== pendingId); emitMembers(); }
    return j;
  }
  const approveMember = (bridgeId, pendingId) => decideMember(bridgeId, pendingId, 'approve');
  const rejectMember = (bridgeId, pendingId) => decideMember(bridgeId, pendingId, 'reject');

  /* 名单管理: 总览 / 改档 / 撤销 / 重批 / 删除 (ref 可 {agentKey} 或 {agentId}, 服务器都认) */
  async function manageCall(bridgeId, action, body) {
    const conn = connections.get(bridgeId);
    if (!conn) throw new Error('bridge 未连接');
    const base = conn.bridge.baseURL.replace(/\/$/, '');
    const res = await Net.fetch(base + '/colony-agent/v2/' + action, {
      method: body ? 'POST' : 'GET',
      headers: { ...(body ? { 'Content-Type': 'application/json' } : {}), ...authHeaders(conn.bridge) },
      body: body ? JSON.stringify(body) : undefined,
      timeout: 8000,
    });
    const j = await res.json().catch(() => null);
    if (!res.ok) throw new Error((j && j.error) ? (j.error + (j.fix ? ' — ' + j.fix : '')) : (action + ' 失败: HTTP ' + res.status));
    return j;
  }
  const fetchAgents = (bridgeId) => manageCall(bridgeId, 'members'); // → {members, pending, revoked}
  const revokeMember = (bridgeId, ref) => manageCall(bridgeId, 'revoke', { ...ref });
  const reapproveMember = (bridgeId, agentKey) => manageCall(bridgeId, 'reapprove', { agentKey });
  const removeMember = (bridgeId, ref) => manageCall(bridgeId, 'remove', { ...ref });

  /** 发消息给某个成员, 以生成器逐段吐回复(签名与消费方约定: yield {delta})。
   *  v2 下回复经 SSE message/chat-done 按 chatId 关联; 对方离线则留言即返。 */
  async function* chatWithMember(bridgeId, memberId, content) {
    const conn = connections.get(bridgeId);
    if (!conn) throw new Error('bridge 未连接');
    const base = conn.bridge.baseURL.replace(/\/$/, '');
    const chatId = crypto.randomUUID(), msgId = crypto.randomUUID();
    const res = await Net.fetch(base + '/colony-agent/v2/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders(conn.bridge) },
      body: JSON.stringify({ to: memberId, content, chatId, msgId }),
      timeout: 15000,
    });
    const j = await res.json().catch(() => null);
    if (!res.ok) throw new Error((j && j.error) ? (j.error + (j.fix ? ' — ' + j.fix : '')) : ('chat 失败: HTTP ' + res.status));
    if (j.queued) { yield { delta: '📩 对方当前离线, 已留言 — 它上线后会自动收到(回复会出现在群聊里)' }; return; }
    // 等回复: 注册 chatId 认领者, message 喂段、chat-done 收尾
    const queue = []; let ended = false; let notify = null;
    conn.chatWaiters.set(chatId, { push: m => { queue.push(m); if (notify) notify(); }, end: () => { ended = true; if (notify) notify(); } });
    try {
      const IDLE = 600000; // 慢 agent 一轮生成可达数分钟; 期间有 status 心跳走另一通道
      let last = Date.now(), first = true;
      while (true) {
        while (queue.length) { const m = queue.shift(); last = Date.now(); yield { delta: (first ? '' : '\n') + (m.content || '') }; first = false; }
        if (ended) break;
        if (Date.now() - last > IDLE) { yield { delta: (first ? '' : '\n') + '[bridge] 等太久了(10 分钟无动静) — 对方可能仍在处理, 它的回复到达后会作为新消息出现在群聊里' }; break; }
        await new Promise(r => { notify = r; setTimeout(r, 1000); });
        notify = null;
      }
      while (queue.length) { const m = queue.shift(); yield { delta: '\n' + (m.content || '') }; }
    } finally { conn.chatWaiters.delete(chatId); }
  }

  return {
    init, listBridges, addBridge, removeBridge,
    connect, disconnect, isConnected, diagnose,
    allOnlineMembers, allPendingRequests, approveMember, rejectMember,
    fetchAgents, revokeMember, reapproveMember, removeMember,
    chatWithMember, onMembers, onMessage,
  };
})();

/* ===========================================================================
 * @module      Foundation.Relay
 * @summary     浏览器插件中继客户端(与插件包 cs.js 协议对应; 插件源码在 colony.workflow/plugin/, 本仓无副本)。
 *              页面 fetch 不到的本机端点(无 CORS)经插件 background 代拉;
 *              插件缺席时诚实报错并给安装指引 — 不静默、不假成功。
 * @publicAPI   present, call, stream
 * =========================================================================== */
const Relay = (() => {
  let seq = 0; // present 探测靠 ping 回包; 插件侧 announce 协议保留兼容
  const oneshot = new Map();  // id → resolve
  const streams = new Map();  // id → onChunk
  const onRelayMsg = (e) => {   // 具名: dispose 时可摘(热替换后旧实例不再常驻听 message)
    if (e.source !== window || !e.data) return;
    const r = e.data.__colonyRelayResult;
    if (r && oneshot.has(r.id)) { const fn = oneshot.get(r.id); oneshot.delete(r.id); fn(r); return; }
    const c = e.data.__colonyRelayChunk;
    if (c && streams.has(c.id)) streams.get(c.id)(c);
  };
  window.addEventListener('message', onRelayMsg);
  const NOPLUGIN_FIX = '安装插件: chrome://extensions 开发者模式 → 加载已解压的扩展(plugin/ 目录); file:// 页面还要在扩展详情打开「允许访问文件网址」; 装好后刷新本页。';
  function call(op, payload, timeout) {
    return new Promise((resolve) => {
      const id = 'r' + (++seq);
      oneshot.set(id, resolve);
      window.postMessage({ __colonyRelay: { id, op, ...(payload || {}) } }, '*');
      setTimeout(() => { if (oneshot.has(id)) { oneshot.delete(id); resolve({ error: '插件无应答', fix: NOPLUGIN_FIX }); } }, timeout || 6000);
    });
  }
  async function present() {
    const r = await call('ping', null, 900);
    return !r.error;
  }
  /* 流式: 逐段 yield 文本块; keepalive 只当活性信号; 提前 return 会发 cancel 真取消扩展侧请求 */
  async function* stream(req) {
    const id = 's' + (++seq);
    const queue = []; let done = false, errObj = null, notify = null;
    const beat = { t: Date.now() };
    streams.set(id, (c) => {
      beat.t = Date.now();
      if (c.delta) queue.push(c.delta);
      if (c.error) errObj = c;
      if (c.done) done = true;
      if (notify) notify();
    });
    window.postMessage({ __colonyRelay: { id, op: 'stream', req } }, '*');
    try {
      while (true) {
        while (queue.length) yield queue.shift();
        if (errObj) throw new Error(errObj.error + (errObj.fix ? ' — ' + errObj.fix : ''));
        if (done) return;
        if (Date.now() - beat.t > 90000) throw new Error('插件流 90s 无活动(连 keepalive 都没有) — 插件可能被禁用或浏览器休眠了它, 刷新页面重试');
        await new Promise(r2 => { notify = r2; setTimeout(r2, 1000); });
        notify = null;
      }
    } finally { streams.delete(id); window.postMessage({ __colonyRelay: { id, op: 'cancel' } }, '*'); }
  }
  return { present, call, stream, detach: () => window.removeEventListener('message', onRelayMsg) };
})();
/* ===========================================================================
 * @module      Agent.Endpoints
 * @summary     端点成员(直连档): 任何 OpenAI 兼容端点(openclaw 系网关/ollama/LM Studio/
 *              pi-gateway/colony-gateway/云端 API)一条 URL 即成群聊成员。零随从进程。
 *              传输选择: 探活(probe)直连优先、CORS 拦下退插件中继; 聊天流(RB-5.1 起)有插件即优先走中继(透传自定义会话头), 无插件才直连。
 *              指纹纪律: /v1/models 必须返回合法模型数组才算端点在(不认 200 空壳)。
 * @publicAPI   list, add, remove, update, refresh, roster, probe, chatWithMember, chatDeltas, resetSessions, snapshot, onChanged
 * =========================================================================== */
const Endpoints = (() => {
  const listeners = new Set();
  let cache = [];              // 本机成员名单从插件 chrome.storage 拉(方案乙): [{id,name,base,model,memory,online,needsKey,renamedTo}]
  const emit = () => { for (const fn of listeners) try { fn(); } catch { } };
  const onChanged = (fn) => { listeners.add(fn); return () => listeners.delete(fn); };
  const list = async () => cache.slice(); // 数据在插件, cache 是拉来的镜像
  let _migrated = false;
  async function migrateFromKv() { // 一次性: 旧版页面 kv 里的端点搬进插件, 清旧避双源
    if (_migrated) return; _migrated = true;
    try {
      const old = (await Store.settings.get('agent.endpoints', [])) || [];
      if (old.length && await Relay.present()) { for (const e of old) await Relay.call('epAdd', { base: e.base, name: e.name, key: e.key, model: e.model }, 12000); await Store.settings.set('agent.endpoints', []); }
    } catch { }
  }

  // 探活/指纹已迁插件(epRoster 在插件侧 probe 并带记忆态); 页面不再直接探端点。

  async function refresh() { // 从插件拉 roster(它带活探+记忆态); 无插件 = 本机成员为空(孤儿降级, 不崩)
    if (!(await Relay.present())) { cache = []; emit(); return cache; }
    await migrateFromKv();
    const r = await Relay.call('epRoster', {}, 12000);
    cache = (r && r.roster) || []; emit();
    return cache;
  }

  function roster() {
    return cache.map(e => ({ id: 'ep:' + e.id, epId: e.id, name: e.name, bridgeId: '__endpoints', kind: 'endpoint', online: !!e.online, model: e.model || '', memory: e.memory || 'stateless', needsKey: !!e.needsKey, allowSDK: !!e.allowSDK }));
  }

  async function add(e) { const r = await Relay.call('epAdd', { base: (e.base || '').replace(/\/+$/, ''), name: e.name, key: e.key, model: e.model }, 12000); await refresh(); return r; }
  async function remove(id) { await Relay.call('epRemove', { id }, 8000); cache = cache.filter(x => x.id !== id); emit(); }
  async function update(id, patch) { await Relay.call('epUpdate', { id, patch }, 8000); await refresh(); }
  async function rename(id, name) { await Relay.call('epRename', { id, name }, 8000); await refresh(); } // renamedTo 一次性标志: chatWithMember 下轮注入"你现在叫X"给 agent

  /* OpenAI SSE 取流: 直连(Response 流)与插件中继(文本块)喂同一个行解析器 — 单一解析器纪律 */
  async function* sseData(url, headers, body, viaHint) {
    let source = null;
    // 有插件优先走 relay: 通用枢纽(剥 Origin/注入 key/透传自定义头如 X-Hermes-Session-Id, 不受 CORS 管)。
    // 无插件才直连(仅开了 CORS 的端点; 且直连不能带 CORS 未放行的自定义头)。
    const usePlugin = viaHint === 'relay' || await Relay.present();
    const tryDirect = async (hdrs) => {
      const res = await fetch(url, { method: 'POST', headers: hdrs, body });
      if (!res.ok) throw new Error('端点 HTTP ' + res.status + ': ' + (await res.text()).slice(0, 200));
      return (async function* () { const rd = res.body.getReader(); const dec = new TextDecoder(); while (true) { const { value, done } = await rd.read(); if (done) return; yield dec.decode(value, { stream: true }); } })();
    };
    if (!usePlugin) {
      // 直连: 先带 X-Hermes-Session-Id(认头端点如 colony-gateway=记忆连续); 自定义头触发 CORS 预检失败则降级不带头再试(裸端点=每轮独立但可用); 都失败再中继兜底
      const pick = re => { const o = {}; for (const k of Object.keys(headers || {})) if (re.test(k)) o[k] = headers[k]; return o; };
      try { source = await tryDirect(pick(/^(content-type|authorization|x-hermes-session-id)$/i)); }
      catch (err) { if (!(err instanceof TypeError)) throw err; try { source = await tryDirect(pick(/^(content-type|authorization)$/i)); } catch (e2) { if (!(e2 instanceof TypeError)) throw e2; } }
    }
    if (!source) source = Relay.stream({ url, method: 'POST', headers, body });
    let buf = '';
    for await (const chunk of source) {
      buf += chunk;
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).replace(/\r$/, ''); buf = buf.slice(nl + 1);
        if (!line.startsWith('data:')) continue;
        const d = line.slice(5).trim();
        if (d) yield d;
      }
    }
  }

  /* 群聊对话(H-1 游标制): 成员是带记忆的 agent, 不喂历史窗口 — 调用方经 Group.takeDelta 只发"他没见过的"增量,
     这里不再存本地线程。记忆连续靠稳定 session 头: 页面发 X-Hermes-Session-Id, 插件 relay 再镜像一份 x-openclaw-session-key(同值)。hermes/colony-gateway(--resume) 认前者、openclaw 认后者 → 各自续一条会话(🧠); 真无状态的裸端点两头都不认 → delta-only 下每轮独立 = 不保记忆(标 💤, 乙)。诚实: 认头的连续, 不认的如实标 💤, 不谎称"无害"。
     session 随机尾持久化(每 会话域×成员 一个): 重开页面记忆不断; 清空/删会话时轮换 = 真失忆(对按会话隔离的 agent)。 */
  const SESSKEY = 'agent.endpointSessions'; // 持久 { 'scope|epId': 随机尾 }
  let _sess = null;
  async function sessMap() { if (!_sess) _sess = (await Store.settings.get(SESSKEY, {})) || {}; return _sess; }
  async function sessionOf(scope, epId) {
    const map = await sessMap(); const k = scope + '|' + epId;
    if (!map[k]) { map[k] = Math.random().toString(36).slice(2, 8); await Store.settings.set(SESSKEY, map); }
    return 'colony-' + epId + '-' + scope + '-' + map[k];
  }
  async function resetSessions(scope, epId) { // 真清空: 轮换 session 尾 → 服务端另起新会话。epId 缺省=该域全部成员
    const map = await sessMap();
    for (const k of Object.keys(map)) { const i = k.indexOf('|'); if (k.slice(0, i) === scope && (!epId || k.slice(i + 1) === epId)) delete map[k]; }
    await Store.settings.set(SESSKEY, map);
  }
  /* OpenAI SSE → 文本增量。单一解析器: 群聊 chatWithMember 与大脑 Brain.chatStream 共用 */
  async function* chatDeltas(url, headers, body, via) {
    for await (const d of sseData(url, headers, body, via)) {
      if (d === '[DONE]') break;
      try {
        const j = JSON.parse(d);
        const delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
        if (delta) yield delta;
      } catch { }
    }
  }
  async function* chatWithMember(memberId, content, opts) {
    const scope = (opts && opts.scope) || 'standalone';
    const epId = String(memberId).replace(/^ep:/, '');
    const e = cache.find(x => x.id === epId);
    if (!e) throw new Error('端点成员不存在: ' + memberId);
    const model = e.model || 'default';
    const rn = e.renamedTo ? '(用户刚把你改名为「' + e.renamedTo + '」, 从现在起你就叫这个名字。) ' : ''; // 改名 agent-aware: 注入一轮让它知道新名
    const messages = [{ role: 'system', content: rn + '你是 Colony 群聊里的成员「' + e.name + '」。群里有多位成员和一位用户, 消息可能带"名字:"署名前缀, 简洁自然地回应, 不要复述署名。' },
      { role: 'user', content: String(content) }];
    const sid = await sessionOf(scope, epId);
    const headers = { 'Content-Type': 'application/json', 'X-Hermes-Session-Id': sid }; // key 由插件按端口注入, 页面不再持有
    for await (const delta of chatDeltas(e.base + '/v1/chat/completions', headers, JSON.stringify({ model, messages, stream: true }), 'relay')) yield { delta };
    if (e.renamedTo) { try { await Relay.call('epClearRename', { id: epId }, 5000); e.renamedTo = null; } catch { } } // 改名只注入一轮
  }

  return { list, add, remove, update, rename, refresh, roster, chatWithMember, chatDeltas, resetSessions, onChanged, snapshot: () => cache.slice() };
})();

/* ===========================================================================
 * @module      Agent.Brain
 * @summary     端点成员登上全能 agent 的「大脑选择器」(RB-7)。AI 配置在岗 → 经它的
 *              registerExternalSource 注册记录来源 + registerProvider 注册 colony-endpoint
 *              协议适配器(自带传输: 经 Endpoints.chatDeltas, 大脑专用会话头与群聊线程隔离);
 *              AI 配置不在岗 → 垫底提供 llm 门面(stem+桥+agent 三件套也能跑全能 agent,
 *              agent 每次现取 service('llm'), 桥卸载自动回落、ai 回岗自动当权)。
 *              miniapp/工作流 SDK 权限: 记录 allowMiniAppSDK 跟随端点卡「SDK」开关(默认关)。
 * @dependsOn   Agent.Endpoints
 * @publicAPI   attach
 * =========================================================================== */
const Brain = (() => {
  const model0 = e => e.model || (e.models && e.models[0]) || 'default';
  /* 在线端点 → provider 记录。apiKey 用占位真值 'local'(免 key 端点也可当大脑; 该字段在消费方语义=凭证可用, 真实鉴权走记录自己的 key) */
  function records() {
    return Endpoints.snapshot().filter(e => e.online).map(e => ({
      id: 'ep:' + e.id, epId: e.id, name: '🔌 ' + e.name, protocol: 'colony-endpoint',
      endpoint: e.base, key: e.key || '', apiKey: e.key || 'local', model: model0(e),
      models: (e.models && e.models.length) ? e.models : [model0(e)], allowMiniAppSDK: !!e.allowSDK, memory: e.memory, via: e.via, concurrency: 2,
    }));
  }
  /* 认头(🧠)端点只发「最后一条 assistant 之后」的新话(首轮=全量), 旧话它端侧记得; 剥重必须页面做——堆积型 agent(实测 openclaw)会把传入历史再入库。💤 端点不记事, 仍发全量 */
  function brainMsgs(p, msgs) {
    if (p.memory !== 'stateful' || !Array.isArray(msgs)) return msgs;
    let li = -1;
    for (let i = 0; i < msgs.length; i++) if (msgs[i].role === 'assistant') li = i;
    const inc = msgs.slice(li + 1);
    return inc.length ? inc : msgs.slice(-1);
  }
  async function* chatStream(p, a) {
    const headers = { 'Content-Type': 'application/json', 'X-Hermes-Session-Id': 'colony-brain-' + p.epId, ...(p.key ? { 'Authorization': 'Bearer ' + p.key } : {}) };
    const body = JSON.stringify({ model: a.model || p.model, messages: brainMsgs(p, a.messages), stream: true, ...(a.temperature != null ? { temperature: a.temperature } : {}) });
    for await (const delta of Endpoints.chatDeltas(p.endpoint.replace(/\/+$/, '') + '/v1/chat/completions', headers, body, p.via)) yield { delta };
  }
  async function chat(p, a) { let acc = ''; for await (const ch of chatStream(p, a)) acc += ch.delta || ''; return { content: acc }; }
  const adapter = { protocol: 'colony-endpoint', chat, chatStream };
  const pick = (a) => { const rs = records(); const p = (a && a.providerId) ? rs.find(x => x.id === a.providerId) : rs[0]; if (!p) throw new Error('没有在线端点成员可当大脑 — 桥接设置里先加/唤醒一个端点, 或在 agent 大脑区 ⚙ 配 LLMLite 兜底'); return p; };
  const nope = what => () => Promise.reject(new Error('端点大脑只会文本对话; ' + what + '需要 AI 配置块在岗'));
  function attach() {
    const L = ctx.service('llm');
    if (L && L.registerExternalSource) { L.registerProvider(adapter); return L.registerExternalSource(records); }
    if (L) return () => { }; // 有 llm 但不认识外部来源(旧版 ai): 不硬塞, 体面退出
    ctx.provide('llm', { // 垫底门面: 与 ai/LLMLite 同一契约面(getProviders/chat/chatStream), 多模态如实说不会
      lite: false,
      getProviders: async () => records(),
      chat: async a => chat(pick(a), a),
      chatStream: async function* (a) { yield* chatStream(pick(a), a); },
      generateAudio: nope('语音合成'), transcribeAudio: nope('语音转写'), generateImage: nope('生图'), generateVideo: nope('生视频'),
    });
    return () => { };
  }
  return { attach };
})();


  /* 本机端点的 扫描 / 连接 / 改名 / 删 / 教学卡 已迁插件 popup(方案乙: 逻辑归插件, petri 只留群聊消费面 + 云端 webhook 接入)。 */

  /* ════ 信箱档管理(纯 CLI agent, 折叠为"高级"): 审批 / 名单 / 撤销删除 ════ */
  function renderPendingList(root, h) {
    const host = root.querySelector('#ac-pending'); if (!host) return;
    const reqs = BridgeClient.allPendingRequests();
    if (!reqs.length) { host.innerHTML = ''; return; }
    host.innerHTML = '<div class="settings-label" style="margin-top:12px">🔔 待接入请求</div>';
    for (const p of reqs) {
      const row = document.createElement('div'); row.className = 'ac-pend-row';
      row.innerHTML = '<span class="nm">⏳ ' + esc(p.name) + '</span>'
        + '<button class="mini ok" data-t="approve">✓ 接入</button><button class="mini" data-t="reject">✗</button>';
      for (const btn of row.querySelectorAll('button')) btn.onclick = async () => {
        try {

          else { await BridgeClient.approveMember(p.bridgeId, p.id); h.toast('已接入'); }

  async function renderAgentPanel(root, h) {

    const conns = (await BridgeClient.listBridges()).filter(b => {
      if (!BridgeClient.isConnected(b.id)) return false;
      const u = (b.baseURL || '').replace(/\/+$/, ''); if (seen.has(u)) return false; seen.add(u); return true;
    });
    const frag = document.createElement('div');
    for (const b of conns) {
      let d; try { d = await BridgeClient.fetchAgents(b.id); }
      catch (e) { const p = document.createElement('p'); p.className = 'settings-hint'; p.textContent = b.name + ': 拉取失败(' + e.message + ')'; frag.appendChild(p); continue; }
      const sec = document.createElement('div');
      sec.innerHTML = '<div class="settings-label" style="margin-top:12px">👥 ' + esc(b.name) + '</div>';
      const mkRow = (icon, name, meta, btns) => {
        const row = document.createElement('div'); row.className = 'ac-pend-row';
        row.innerHTML = '<span class="nm">' + icon + ' ' + esc(name) + '<small>' + esc(meta) + '</small></span>';
        for (const [label, fn, cls] of btns) { const btn = document.createElement('button'); btn.className = 'mini' + (cls ? ' ' + cls : ''); btn.textContent = label; btn.onclick = async () => { try { await fn(); } catch (e) { h.toast('失败: ' + e.message); } renderAgentPanel(root, h); }; row.appendChild(btn); }
        return row;
      };
      const del = a => () => { if (!confirm('彻底删除「' + a.name + '」?')) return Promise.resolve(); return BridgeClient.removeMember(b.id, { agentKey: a.agentKey }).then(() => h.toast('已删除')); };
      for (const a of (d.members || [])) {
        sec.appendChild(mkRow(a.online ? '🟢' : '⚪', a.name, (a.online ? '在线' : (a.webhook ? '离线 · 留言即唤醒' : '离线')),  // 只有 webhook 成员离线仍收得到推送
          [['撤销', () => BridgeClient.revokeMember(b.id, { agentKey: a.agentKey }).then(() => h.toast('已撤销'))], ['🗑', del(a)]]));
      }
      for (const a of (d.revoked || [])) sec.appendChild(mkRow('🚫', a.name, '已撤销', [['重批', () => BridgeClient.reapproveMember(b.id, a.agentKey), 'ok'], ['🗑', del(a)]]));
      if (!(d.members || []).length && !(d.revoked || []).length) sec.innerHTML += '<p class="settings-hint">尚无已批准的 agent</p>';
      frag.appendChild(sec);
    }
    if (host._seq !== seq) return;
    host.innerHTML = ''; host.appendChild(frag);
  }

  /* ════ 独立态(孤儿): 完整群聊 IM — 干净输入行/时间戳/状态行合并 ════ */
  function mkToast() {

  }
  const CHATKEY = 'bridge:chatlog', CHATCAP = 200;

  async function pushChat(e) { const log = await loadChat(); log.push(e); if (log.length > CHATCAP) log.splice(0, log.length - CHATCAP); try { await ctx.kv.set(CHATKEY, log); } catch (e2) { } }
  const hhmm = ts => { const d = new Date(ts); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); };
  function renderStandalone(ctx) {

      + '<div class="br-chat"><div class="br-members" id="br-members"></div><div class="br-msgs" id="br-msgs"></div>'

    async function renderHistory() { // 在场即共享(H-1): 房间记录全量展示, 无过滤视图无放行(旧档 relayTo 字段自然忽略)

    function renderMembers() {
      const roster = Bridge.allOnlineMembers(), reqs = BridgeClient.allPendingRequests();
      membersEl.innerHTML = '';
      if (!roster.length && !reqs.length) { const s = document.createElement('span'); s.className = 'br-empty'; s.textContent = '名单空 — 下方「接入设置」扫描端点直连, 或连 bridge'; membersEl.appendChild(s); return; }
      for (const m of roster) {

        const loc = m.kind === 'endpoint';  // 两维标识: 🟢/⚪=在线态, 🖥/☁=本机/云端(其余标注一律不加)
        const b = document.createElement('span'); b.className = 'br-badge'; b.textContent = loc ? '🖥' : '☁';
        b.title = loc ? '本机 agent(插件直连端点) ' + (m.model || '') : '云端 agent(经桥接入)' + (m.webhook && !m.online ? ' · 离线, 留言即唤醒' : '');
        chip.appendChild(b);
        chip.title = inG ? '在群聊中 · 点击退出(不参与@所有人/互动) · 可左右拖动调发言序' : '已退出群聊 · 点击拉回';
        chip.onclick = async () => { // 点击=参与/退出群聊(H-1, 与 colony dock 同一交互)
          await Group.toggleMember('standalone', m.id);
          if (lockTarget && lockTarget.id === m.id && !Group.inGroup('standalone', m.id)) { lockTarget = null; syncPlaceholder(); }
          renderMembers(); renderAtRow();
        };
        if (inG && Group.setOrder) { // 拖动排序(H-2): 拖完把在群成员 DOM 序落盘
          chip.draggable = true; chip.setAttribute('data-mid', m.id); chip.style.cursor = 'grab';
          chip.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', m.id); chip.style.opacity = '.4'; });
          chip.addEventListener('dragend', () => { chip.style.opacity = ''; });
          chip.addEventListener('dragover', e => e.preventDefault());
          chip.addEventListener('drop', async e => {
            e.preventDefault(); const dragId = e.dataTransfer.getData('text/plain'); if (!dragId || dragId === m.id) return;
            const dragged = membersEl.querySelector('[data-mid="' + dragId + '"]'); if (!dragged) return;
            membersEl.insertBefore(dragged, chip);

    async function askMember(target) { // 游标制(H-1): 只发他没见过的增量; 送达才 markSeen, 失败重问不丢话; 回复入房间记录。返回是否真发言(供互动跳过沉默)
      const gen = saClearGen; // 本次发言世代: 期间全清则作废
      setStatus(target.name + ' 正在思考…');
      const entries = (await loadChat()).map(e => ({ ts: e.ts, who: e.kind === 'me' ? '用户' : e.who, content: e.content, self: e.kind === 'peer' && e.who === target.name }));
      const d = Group.takeDelta('standalone', target.id, entries);
      if (!d.count) { setStatus(''); return false; }
      let acc = '', ok = false, body = null, cut = false;
      try {
        for await (const chunk of Bridge.chatWithMember(target.bridgeId, target.id, d.text, { scope: 'standalone' })) {
          if (saStop) { cut = true; break; } // 全清: 掐断当前成员流
          if (chunk.delta) { if (!body) { setStatus(''); body = addMsg('peer', target.name, '', Date.now()); } acc += chunk.delta; body.textContent = acc; msgsEl.scrollTop = msgsEl.scrollHeight; }
        }
        ok = true;
      } catch (e) { if (!body) body = addMsg('peer', target.name, '', Date.now()); body.textContent = (acc ? acc + '\n' : '') + '✗ ' + e.message; } // 报错只留显示不入档
      setStatus('');
      if (cut || gen !== saClearGen) return false; // 被打断/期间全清: 半句丢弃, 不 markSeen、不入档(全清后不留残条)
      if (ok || acc) await Group.markSeen('standalone', target.id, d.upTo);
      if (acc) await pushChat({ ts: Date.now(), kind: 'peer', who: target.name, content: acc });
      return !!acc;
    }
    async function doSend() {
      const content = textEl.value.trim(); if (!content) return;
      if (saRelayRunning) { // 互动运行中插嘴: 计数清零(归桥), 消息进群记录(下一位看得到), 不打断当前发言者
        await Group.relayResetCount('standalone'); syncRelayBtn();
        textEl.value = ''; const ts = Date.now(); addMsg('me', '我', content, ts); await pushChat({ ts, kind: 'me', who: '我', content });
        return;
      }
      const mm = /^@(\S+)/.exec(content);
      const nm = mm && mm[1].replace(/[，。,.!！?？:：]+$/, '');
      if (nm && (nm === '所有人' || /^all$/i.test(nm))) { // @所有人: 参与成员按顺序各答一轮, 后答的经 delta 看得到先答的
        const ps = Group.participants('standalone');

        sendBtn.disabled = false; textEl.focus(); maybeRelay(); return;
      }
      let target = lockTarget; // 锁定连聊兜底; 明确 @名字 优先
      if (nm) {
        const r = await Group.resolveMember('standalone', nm);
        if (r.candidates) { toast('@' + nm + ' 匹配到多个: ' + r.candidates.map(c => c.name).join(' / ') + ' — 用全名再发'); return; }
        if (r.excluded) { toast('「' + r.excluded.name + '」已退出群聊 — 点上方成员胶囊拉回'); return; }
        if (!r.member) { toast('@' + nm + ' 没有匹配的在线成员'); return; }
        target = { bridgeId: r.member.bridgeId, id: r.member.id, name: r.member.name };
      }
      textEl.value = ''; sendBtn.disabled = true;
      const ts = Date.now();
      addMsg('me', target ? '我 → ' + target.name : '我', content, ts);
      await pushChat({ ts, kind: 'me', who: target ? '我 → ' + target.name : '我', content, to: (target && target.id) || undefined });
      if (target) await askMember(target);
      else toast('没点名 — 已进群聊记录, 谁下次发言都看得到; 要人回请点下方@键');
      sendBtn.disabled = false; textEl.focus();
      maybeRelay(); // 互动开着则从这位之后按序轮流接话
    }
    async function saLastSpeaker(ps) { // 最近发言成员 id(独立页 peer 只存 who, 按名映射回 id)
      const log = await loadChat();
      for (let i = log.length - 1; i >= 0; i--) if (log[i].kind === 'peer') { const m = ps.find(p => p.name === log[i].who); return m ? m.id : null; }
      return null;
    }
    function maybeRelay() { if (saRelayInfo().on && !saRelayRunning) saRelayLoop(); }
    async function saRelayLoop() { // 互动轮转(状态/次数/下一位归 Group): 纯成员, 每跳 askMember, 到 limit 自停
      saRelayRunning = true; sendBtn.disabled = true; syncRelayBtn();
      try {
        let lastId = await saLastSpeaker(Group.participants('standalone')), dry = 0; // 本地维护发言者游标(每跳前移, 沉默成员不卡住轮转)
        while (saRelayInfo().on && !saStop && saRelayInfo().count < saRelayInfo().limit) {
          const ps = Group.participants('standalone'); if (!ps.length) break; // 无成员=静默停(按钮复位即表达)
          const next = Group.relayNext('standalone', lastId, false); // 桥算下一位(独立页无全能)

          lastId = next.id; // 前移: 沉默也跳过它
          const spoke = await askMember({ bridgeId: next.bridgeId, id: next.id, name: next.name });
          if (spoke) { await Group.relayBump('standalone'); dry = 0; } // 真发言才计数
          else if (++dry >= ps.length) break; // 转满一圈无人发言=兜底停
          syncRelayBtn();
        }
      } catch (e) { toast('互动出错: ' + e.message); }
      saRelayRunning = false; sendBtn.disabled = false; syncRelayBtn();
      if (saRelayInfo().count >= saRelayInfo().limit) { await Group.relayEnd('standalone'); syncRelayBtn(); } // 到数静默收束
    }
    function syncRelayBtn() {
      const b = wrap.querySelector('#br-relay'); if (!b) return;

      const all = document.createElement('button'); all.className = 'br-atkey'; all.textContent = '@所有人'; all.title = '参与成员按顺序各答一轮, 后答的看得到先答的';
      all.onclick = () => { textEl.value += '@所有人 '; textEl.focus(); };
      row.appendChild(all);
      const rb = document.createElement('button'); rb.id = 'br-relay'; rb.className = 'br-atkey';
      rb.title = '互动模式: 开启后你@谁, 成员按上方顺序轮流接话到设定次数; 再点关闭';
      rb.onclick = async () => { await Group.relayToggle('standalone'); syncRelayBtn(); }; // 开/关归桥, 状态交给按钮倒计数
      row.appendChild(rb);
      const rn = document.createElement('input'); rn.id = 'br-relay-n'; rn.type = 'number'; rn.min = '1'; rn.value = saRelayInfo().limit; rn.title = '互动接话总次数';
      rn.style.cssText = 'width:34px;font:inherit;font-size:11px;text-align:center;border:1px solid var(--border);border-radius:8px;background:var(--bg-2);color:var(--text)';
      rn.onchange = async () => { const v = await Group.relaySetLimit(rn.value); rn.value = v; syncRelayBtn(); }; // 次数归桥(与 dock 共享全局 limit)

    wrap.querySelector('#br-clear').onclick = async () => { // 一键全清(H-1): 记录+已读游标+全部成员会话
      if (!confirm('清空全部聊天记录与全部成员记忆?')) return;
      saClearGen++; // 作废在途成员发言的写入(慢成员流收尾时发现世代变了会自行丢弃)
      if (saRelayRunning) { saStop = true; await Group.relayEnd('standalone'); saStop = false; } // 停互动循环(在途那跳的写已被世代作废)
      if (_chatlog) _chatlog.length = 0; else _chatlog = []; await ctx.kv.set(CHATKEY, []); // 清内存镜像+存储
      await Bridge.resetMemberContext({ scope: 'standalone' });
      toast('已全部清空');
      renderHistory(); syncRelayBtn(); // 主动刷互动按钮(全清停了互动)
    };
    textEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); } });
    BridgeClient.onMessage(async m => {
      if (m.role === 'status') { setStatus(((m.from || '') + ' ' + (m.content || '')).trim()); return; }
      if (m.content) { addMsg('peer', m.from || 'agent', m.content, Date.now()); await pushChat({ ts: Date.now(), kind: 'peer', who: m.from || 'agent', content: m.content }); }
    });
    Bridge.onMembers(() => { renderMembers(); renderAtRow(); });
    try { renderSection(wrap.querySelector('#br-cfg-host'), { toast, modal: () => null }); } catch (e) { }
    renderHistory(); renderMembers(); renderAtRow(); syncPlaceholder();
  }

  /* ═══════ Agent.Group — 群聊语义核(H-1 游标制: 在场即共享, 无开关无放行) ═══════
     房间记录是唯一共享事实(dock 会话记录 / 独立页 chatlog, 归各自 UI 持有), 本模块管三件事:
     ① 参与名单(点胶囊进出, 默认人人在场, 只记退出的); ② 已读游标 — 成员是带记忆的 agent,

     ③ @名字→参与成员解析。一份语义, dock 与独立页都只做薄 UI; 全能 agent 的参与(引擎装载群记录)在 agent 块。 */
  const Group = (() => {
    const KEY = 'agent.groupChat'; // { scope: { out:{成员id:true}, cursor:{成员id:已读ts}, order:[成员id...] } }, scope=会话域(dock 会话 tab id / 独立页 'standalone')
    const DELTA_CAP = 24; // 单次增量上限: 新拉进的成员游标为空, 全量可能几百条 — 只给最近的并如实说明截断
    let cache = {};
    (async () => { try {
      const v = (await Store.settings.get(KEY, {})) || {};
      for (const k of Object.keys(v)) v[k] = { out: (v[k] && v[k].out) || {}, cursor: (v[k] && v[k].cursor) || {}, order: (v[k] && v[k].order) || [] }; // 旧形状({on,startedAt}, G-3)/无 order(H-1)就地补齐
      cache = v;
    } catch (e) { } })();
    const st = scope => cache[scope] || (cache[scope] = { out: {}, cursor: {}, order: [] });
    const save = () => Store.settings.set(KEY, cache).catch(() => { });
    const rosterAll = () => BridgeClient.allOnlineMembers().concat(Endpoints.roster());
    const inGroup = (scope, id) => !st(scope).out[id];
    const participants = scope => { // @所有人/互动轮的名单+发言序: 先按用户拖动的 order, order 外的按接入序追加在后(稳定排序)
      // webhook 成员离线只是没心跳, 推送照达=留言即唤醒, 不踢出群轮; 本地端点离线=进程没跑, 仍过滤
      const live = rosterAll().filter(m => (m.online !== false || m.webhook) && inGroup(scope, m.id));
      const ord = st(scope).order || [];
      const rank = id => { const i = ord.indexOf(id); return i < 0 ? 1e9 : i; };
      return live.map((m, i) => [m, i]).sort((a, b) => (rank(a[0].id) - rank(b[0].id)) || (a[1] - b[1])).map(x => x[0]);
    };
    async function setOrder(scope, ids) { st(scope).order = ids.slice(); await save(); } // 胶囊拖动重排后落盘(存全量在群 id 序)
    async function toggleMember(scope, id) { // 参与开关: 点胶囊切换; 返回切换后是否在场
      const s = st(scope);
      if (s.out[id]) delete s.out[id]; else s.out[id] = true;
      await save(); return !s.out[id];
    }
    async function resolveMember(scope, query) { // @名字 → 参与成员: 先全名后前缀; 歧义返 candidates; 命中已退群的如实报 excluded
      const pick = list => { const ex = list.filter(m => m.name === query); return ex.length ? ex : list.filter(m => m.name.startsWith(query)); };
      const all = rosterAll();
      const cand = pick(all.filter(m => inGroup(scope, m.id)));
      if (cand.length > 1) return { candidates: cand };
      if (cand.length === 1) return { member: cand[0] };
      const outHit = pick(all);
      return outHit.length ? { excluded: outHit[0] } : { member: null };
    }
    function takeDelta(scope, memberId, entries) { // 房间记录(调用方给已归一的 [{ts,who,content,self}], 按时序) → 该成员未读增量。纯读不动游标
      const cur = st(scope).cursor[memberId] || 0;
      let upTo = cur;
      for (const e of entries) if (e.ts > upTo) upTo = e.ts;
      let unseen = entries.filter(e => e.ts > cur && !e.self);
      const dropped = Math.max(0, unseen.length - DELTA_CAP);
      if (dropped) unseen = unseen.slice(-DELTA_CAP);
      if (!unseen.length) return { text: '', count: 0, upTo };
      if (unseen.length === 1 && unseen[0].who === '用户') return { text: String(unseen[0].content).replace(/^@\S+\s*/, ''), count: 1, upTo }; // 连续单聊退化为普通对话, 零包装
      return { text: '[群聊新消息]\n' + (dropped ? '(更早 ' + dropped + ' 条略过)\n' : '') + unseen.map(e => e.who + ': ' + e.content).join('\n') + '\n\n最后一条是对你说的, 请直接回应。', count: unseen.length, upTo };
    }
    async function markSeen(scope, memberId, upTo) { // 送达(有回复或流正常走完)才算读过; 失败不动游标 → 重问不丢上文
      const s = st(scope);
      if ((s.cursor[memberId] || 0) < upTo) { s.cursor[memberId] = upTo; await save(); }
    }
    async function resetCursor(scope, memberId) { // 清空聊天时同步归零(不动参与名单); memberId 缺省=该域全部
      const s = st(scope);
      if (memberId) delete s.cursor[memberId]; else s.cursor = {};
      await save();
    }
    async function dropScope(scope) { delete cache[scope]; await save(); } // 会话删除时回收(参与+游标+序+互动一并)
    /* 互动模式状态与调度(H-2b: 从 agent/独立页迁回——群聊配置该随桥)。on/count 按 scope, 次数上限全局(用户设一次到处用)。
       执行发言仍在各 UI(全能跑 agent 引擎/成员流式展示是 UI 的事), 桥只管"开没开、第几跳、下一个轮到谁"。 */
    let relayLimit = 5;
    (async () => { try { relayLimit = (await Store.settings.get('agent.relayLimit', 5)) || 5; } catch (e) { } })();
    const relayInfo = scope => { const s = st(scope); return { on: !!(s.relay && s.relay.on), count: (s.relay && s.relay.count) || 0, limit: relayLimit }; };
    async function relayToggle(scope) { const s = st(scope); s.relay = { on: !(s.relay && s.relay.on), count: 0 }; await save(); return relayInfo(scope); } // 开/关, 开则计数清零
    async function relaySetLimit(n) { relayLimit = Math.max(1, parseInt(n) || 5); await Store.settings.set('agent.relayLimit', relayLimit); return relayLimit; }
    async function relayBump(scope) { const s = st(scope); s.relay = s.relay || { on: true, count: 0 }; s.relay.count++; await save(); return relayInfo(scope); } // 发言一跳后计数+1
    async function relayResetCount(scope) { const s = st(scope); if (s.relay) { s.relay.count = 0; await save(); } } // 用户插嘴=计数清零(不关互动)

      const ps = participants(scope).map(m => ({ id: m.id, bridgeId: m.bridgeId, name: m.name, builtin: false }));

    }
    function relayNext(scope, lastId, withBuiltin) { // 轮转: 给定最近发言者算下一位; dock 只有全能没成员=不轮(null)
      const seq = relayOrder(scope, withBuiltin);
      const minLen = withBuiltin ? 2 : 1;
      if (seq.length < minLen) return null;

    return { inGroup, participants, setOrder, toggleMember, resolveMember, takeDelta, markSeen, resetCursor, dropScope,
      relayInfo, relayToggle, relaySetLimit, relayBump, relayResetCount, relayEnd, relayNext }; // relayOrder 是 relayNext 的内部闭包, 无外部消费者不导出
  })();

  /* ════ Bridge 门面: 统一「信箱档成员(BridgeClient)」+「直连端点成员(Endpoints)」两族 + 群聊语义(Group) ════
     对消费方(petri:agent 群聊)只暴露一个 bridge, 签名不变 → agent 块零改动。
     成员按 bridgeId 分派: '__endpoints' 走端点直连, 其余走信箱协议。endpoints 键=测试手册/真机驱动脚本的公开驾驶面。 */
  const Bridge = {
    ...BridgeClient,
    endpoints: Endpoints,
    inGroup: Group.inGroup, participants: Group.participants, setOrder: Group.setOrder, toggleMember: Group.toggleMember,
    resolveMember: Group.resolveMember, takeDelta: Group.takeDelta, markSeen: Group.markSeen, dropGroupScope: Group.dropScope,
    relayInfo: Group.relayInfo, relayToggle: Group.relayToggle, relaySetLimit: Group.relaySetLimit,
    relayBump: Group.relayBump, relayResetCount: Group.relayResetCount, relayEnd: Group.relayEnd, relayNext: Group.relayNext,
    allOnlineMembers() { return BridgeClient.allOnlineMembers().concat(Endpoints.roster()); },
    chatWithMember(bridgeId, memberId, content, opts) { // opts.scope=会话域(dock 会话 tab id / 独立页 'standalone'), 端点成员记忆随域走
      return bridgeId === '__endpoints' ? Endpoints.chatWithMember(memberId, content, opts) : BridgeClient.chatWithMember(bridgeId, memberId, content);
    },
    /* 清空: 归零该域已读游标 + 端点档轮换(会话域×成员)会话线程 → 无状态模型/按会话隔离的 agent 真失忆; 但"有长期记忆的常驻 agent"(如 hermes)记忆属 agent 本身、跨会话共享, colony 换 id 清不掉 → 统一带诚实 caveat, 不谎称必失忆(铁律8)。信箱档上下文在对方机器, 仅清显示。 */

      return Promise.resolve({ ok: true, local: true, caveat: '信箱档成员的上下文在它自己机器上, 仅清了本地显示' });
    },
    onMembers(fn) { const a = BridgeClient.onMembers(fn), b = Endpoints.onChanged(fn); return () => { a(); b(); }; },
  };

  /* ════ 装载与广播 ════ */
  const fireMembers = () => ctx.emit('bridge:members-changed');
  BridgeClient.onMembers(fireMembers);
  Endpoints.onChanged(fireMembers);
  Endpoints.onChanged(() => ctx.emit('providers:changed')); // 端点上/下线 → 大脑选择器同步刷新(agent 已监听此事件)
  BridgeClient.onMessage(m => ctx.emit('bridge:message', m));

  window.addEventListener('message', onRelayEvt);

  ctx.provide('bridge', Bridge);
  /* ── miniapp SDK 面(桥自己注册, 谁提供能力谁注册; 无 ai 块也完整可用): 权限闸=插件成员行「SDK」勾选 ── */
  if (ctx.sdk && ctx.sdk.handle) {
    ctx.sdk.handle('bridge.members', async () => Bridge.allOnlineMembers().map(m => (
      { id: m.id, name: m.name, online: m.online !== false, kind: m.kind === 'endpoint' ? '本机' : '云端', canChat: m.kind === 'endpoint' && !!m.allowSDK })));

      a = a || {};

      if (!m) throw new Error('没有这个成员: ' + (a.memberId || a.member || '(空)') + ' — 先 colony.call("bridge.members") 看名单');

      for await (const ev of Bridge.chatWithMember(m.bridgeId, m.id, String(a.text), { scope })) if (ev.delta) acc += ev.delta;

  }
  /* 技能随块(块在技能在, 用户可改删)。skill 是指导不是标准: 只给关键原则, 不 step-by-step——细节都在插件导出的指令里 */
  if (ctx.kv) ctx.kv.get('skill:petri:bridge:接入-agent').then(v => {
    const val = {
      desc: '把 agent 接进 Colony, 或在代码里调用桥内 agent 时读',
      guide: '接入: 让用户点浏览器插件「接入包导出」, 把对应指令(端口型/CLI型/云端型)原样发给要接入的 agent 照做即可, 细节都在指令里。'
        + ' 记忆契约: Colony 每轮同发 X-Hermes-Session-Id 与 x-openclaw-session-key(同值)两个会话头; agent 认任一头=同头值续同一条会话(🧠), 都不认=每轮独立(💤)。'
        + ' 调用桥内 agent 只有一套逻辑: 认头成员带记忆, 每轮只发「当前这句」, 旧话他自己记得(别拼历史)。'
        + ' miniapp 里(桥自带 SDK, 不依赖任何其它块): colony.call("bridge.members") → 成员名单(canChat=true 才可调); colony.call("bridge.chat", {memberId, text, scope}) → {member, content}。scope=你的应用名: 同 scope 续同一条对话, 换 scope 即全新对话。前提: 用户在插件该成员行勾了「SDK」, 未勾会如实被拒。'
        + ' petri 块里: ctx.service("bridge") 的 allOnlineMembers() / chatWithMember(bridgeId, memberId, text, {scope})。'
        + ' 当大脑: 端点成员自动登上全能大脑下拉(🔌 项), 照常用。'
    };
    if (!v || (val.v !== undefined && v.v !== val.v)) ctx.kv.set('skill:petri:bridge:接入-agent', val); // 版本式: 带 v 才重播
  }).catch(() => { });

  ctx.on('llm:ready', () => { try { brainDetach(); } catch (e) { } brainDetach = Brain.attach(); }); // ai 热替换重挂: 新实例的来源表是空的
  return { api: {}, async dispose() { try { brainDetach(); } catch (e) { } try { Relay.detach(); } catch (e) { } try { window.removeEventListener('message', onRelayEvt); } catch (e) { } for (const b of await BridgeClient.listBridges()) { try { BridgeClient.disconnect(b.id); } catch (e) { } } } };   // 热替换卫生: 旧实例不再常驻听 message
})

  function openLiteCfg() { // 模型配置(LLMLite): 让"没有 petri:ai 的组合/导出件"也配得上模型; ai 在岗时自动让位

  /* 段级失效同步: 前后缀行对齐 → 窗口外段平移, 窗口内标过时; 兼容新旧形状; 不动 hash(核验归解读页) */
  function alignAna(oldCode, newCode, ana) {
    if (!ana || oldCode === newCode || oldCode == null) return ana;
    const ol = String(oldCode).split('\n'), nl = String(newCode).split('\n');
    let p = 0; while (p < ol.length && p < nl.length && ol[p] === nl[p]) p++;
    let sfx = 0; while (sfx < ol.length - p && sfx < nl.length - p && ol[ol.length - 1 - sfx] === nl[nl.length - 1 - sfx]) sfx++;
    const delta = nl.length - ol.length, lo = p + 1, hi = ol.length - sfx;   // 受影响窗口(1-based 闭区间)
    const mv = (a, b) => b < lo ? [a, b, false] : a > hi ? [a + delta, b + delta, false] : [a, b, true];
    const seg = s => {
      if (!s || !s.startLine) return;
      const [a, b, st] = mv(s.startLine, s.endLine);
      if (st) s.stale = true;
      else if (a !== s.startLine) {
        const d = a - s.startLine;
        s.startLine = a; s.endLine = b;
        (s.lineExplanations || []).forEach(le => { le.lineNum += d; });
        (s.archFlowPoints || []).forEach(fp => { fp.lineStart += d; fp.lineEnd += d; });
      }
    };
    (ana.segments || []).forEach(seg);
    (ana.regions || []).forEach(r => {
      if (r.range) {
        const [a, b, st] = mv(r.range[0], r.range[1]);
        if (st) r.stale = true;
        else r.range = [a, b];
      }
      (r.detail || []).forEach(pg => {
        if (pg.range) {
          const [c, d2, st2] = mv(pg.range[0], pg.range[1]);
          if (!st2) pg.range = [c, d2];
        }
        (pg.segments || []).forEach(seg);
      });
    });
    (function walk(n) {
      if (!n) return;
      if (n.startLine && n.endLine) {
        const [a, b, st] = mv(n.startLine, n.endLine);
        if (!st) { n.startLine = a; n.endLine = b; }
      }
      (n.children || []).forEach(walk);
    })(ana.archTree);
    return ana;
  }

  "let LLM_CALLS = 0;         // 本次解析 LLM 调用计数(stats)\n" +

  "let REGIONS = null;        // 合同 regions(模块级, 含 segIds 内存索引; null=旧形状)\n" +
  "let LAZY = false;          // L3 按需模式(源码超阈值: 按模块分页, 翻到才生成)\n" +
  "let activeRegion = 0;      // 当前模块页\nconst EAGER_L3 = (window.appdrop && appdrop.context && appdrop.context.eagerL3) || 40960;  // ≤此字节急切全量\n" +
  "const PAGE_CHARS = 12288;  // detail 分页: 12K/页\n" +
  "const segSlice = seg => LINES.slice(seg.startLine-1, seg.endLine).join('\\n');\n" +
  "// (思维导图用自写 SVG, 见 drawMindmap)\n\n// ─── 工具: 标记空行/纯括号行(详解时跳过) ───\n" +
  "function isTrivial(line){ const t=(line||'').trim(); return t==='' || /^[{}()\\[\\];,]+$/.test(t) || /^(<\\/?\\w+>?|-->" +

  "  return lines.map((l,i)=>{ const n=(startLine||1)+i; const mark=isTrivial(l)?'·':'|'; return n+mark+' '+l; }).join('\\n');\n" +
  "}\nfunction esc(s){ return String(s==null?'':s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])); }\n" +
  "\n// ─── 代码指纹(djb2, 8位hex): 只判\"变没变\", 非安全用途(决议2) ───\n" +

  ">>0; } return ('00000000'+h.toString(16)).slice(-8); }\n" +
  "\n// ─── 面包屑路径表: 顺 archTree 现场算 segId→[祖先名…叶名](决议4: 不存盘) ───\n" +
  "function buildPathMap(archTree){\n  const map={};\n" +
  "  if(!archTree || !archTree.children) return map;\n" +
  "  const walk=(node,trail)=>{\n    if(node.type==='leafSeg'){ if(node.segmentId!=null) map[node.segmentId]=trail.concat(node.name); return; }\n" +
  "    const t=trail.concat(node.name);   // category/chiefSeg/subSeg 贡献自己的名字\n" +

  "function archDepth(archTree){\n  if(!archTree||!archTree.children||!archTree.children.length) return 0;\n" +
  "  const d=(node)=>1+((node.children||[]).reduce((m,c)=>Math.max(m,d(c)),0));\n" +
  "  return archTree.children.reduce((m,c)=>Math.max(m,d(c)),0);\n" +
  "}\nfunction countType(archTree,type){\n" +
  "  if(!archTree||!archTree.children) return 0;\n" +

  "  archTree.children.forEach(walk); return c;\n" +
  "}\n\n// ─── 解析角色模型配置(存在本 miniapp 自己的 store) ───\n" +
  "const ROLE_KEY = 'analyzer.roles';\nlet ROLES = { architect:{providerId:null,model:null}, worker:{providerId:null,model:null} };\n" +
  "async function loadRoles(){ try{ const r=await appdrop.store.get({key:ROLE_KEY}); if(r && typeof r==='object') ROLES={ architect:r.architect||ROLES.architect, worker:r.worker||ROLES.worker }; }catch{} }\n" +
  "async function saveRoles(){ try{ await appdrop.store.set({key:ROLE_KEY,value:ROLES}); }catch{} }\n" +
  "\n// ─── LLM 调用: 要求返回 JSON ───\nasync function aiJSON(sys, user, role){\n" +
  "  const cfg = ROLES[role] || {};\n  const resp = await appdrop.ai.chat({\n" +
  "    providerId: cfg.providerId || undefined,\n" +
  "    model: cfg.model || undefined,\n    messages: [\n" +
  "      { role:'system', content: sys + '\\n\\n【重要】只输出合法 JSON，不要任何解释、不要 markdown 代码块包裹。' },\n" +
  "      { role:'user', content: user }\n" +
  "    ]\n  });\n  let txt = (resp.content || '').trim();\n" +
  "  // 剥离可能的 ```json ``` 包裹\n  txt = txt.replace(/^```(?:json)?\\s*/i,'').replace(/\\s*```$/,'').trim();\n" +
  "  // 容错: 抓第一个 { 到最后一个 }\n  const a = txt.indexOf('{'), b = txt.lastIndexOf('}');\n" +
  "  if(a>=0 && b>a) txt = txt.slice(a,b+1);\n" +
  "  return JSON.parse(txt);\n}\n\n// ═══ 分段(架构师) — 可变层级递归 ═══\n" +
  "const ARCHITECT_SYS = `你是首席代码架构师。把代码切分为合理的逻辑模块。\n" +
  "【输出规则】\n1. 顶层 categories 按语义分 2-5 个大类(如 结构骨架/样式/交互逻辑/数据模型/工具函数, 按实际划分不要套模板)。\n" +
  "2. 每个大类下分若干子模块 nodes, 每个是有意义的逻辑块。\n3. 每模块给: name(中文4-10字), tag(英文小写关键词如 head/nav/auth/api/util), startLine, endLine, summary(1句话≤30字)。\n" +
  "4. 行号连续覆盖给定范围, 不重叠不遗漏。\n5. 粒度: 避免单行成模块, 也避免一个模块超过 80 行。理想 8-50 行/模块。\n" +
  "【输出 JSON 格式】{\"rootName\":\"项目名\",\"summary\":\"一句话(≤40字)讲清这份代码是什么、给谁用\",\"categories\":[{\"name\":\"大类名\",\"nodes\":[{\"name\":\"\",\"tag\":\"\",\"startLine\":1,\"endLine\":10,\"summary\":\"\"}]}]}`;\n" +
  "\nconst SUB_ARCHITECT_SYS = `你是代码架构师。给定一个较大的代码块, 把它进一步细分成更小的逻辑子模块。\n" +
  "【规则】每个子模块 8-50 行, 给 name(中文4-10字)/tag/startLine/endLine/summary(≤30字)。行号必须在给定范围内, 连续覆盖不重叠。\n" +
  "【输出 JSON】{\"nodes\":[{\"name\":\"\",\"tag\":\"\",\"startLine\":1,\"endLine\":10,\"summary\":\"\"}]}`;\n" +
  "\n// 大文件先\"粗切\"(120-300行/块), 由小架构师再细分 → 层级真正长出来\n" +
  "const ARCHITECT_SYS_COARSE = `你是首席代码架构师。这是一个较大的文件, 先做\"粗切\": 把代码切成 2-6 个大类 categories, 每个大类下分若干较大的逻辑块 nodes(每块 120-300 行, 后续会有小架构师再细分)。\n" +
  "【每模块给】name(中文4-10字)/tag(英文小写关键词)/startLine/endLine/summary(1句话≤30字)。行号连续覆盖给定范围, 不重叠不遗漏。\n" +
  "【输出 JSON 格式】{\"rootName\":\"项目名\",\"summary\":\"一句话(≤40字)讲清这份代码是什么、给谁用\",\"categories\":[{\"name\":\"大类名\",\"nodes\":[{\"name\":\"\",\"tag\":\"\",\"startLine\":1,\"endLine\":150,\"summary\":\"\"}]}]}`;\n" +
  "\nconst MAX_SEG_LINES = 80;     // 超过这么多行的段, 触发\"小架构师\"再细分\n" +

  "\n// 把一个段递归细分成\"树节点\"(挂 children, 不扁平替换 — 修旧 bug)。\n" +
  "// 返回 {type:'chiefSeg'|'subSeg'|'leafSeg', name, tag, summary, startLine, endLine, category, children?}\n" +
  "async function subdivideTree(seg, depth){\n" +
  "  const leaf = ()=>({ type:'leafSeg', name:seg.name, tag:seg.tag, summary:seg.summary, startLine:seg.startLine, endLine:seg.endLine, category:seg.category });\n" +
  "  if(depth >= MAX_DEPTH) return leaf();\n" +
  "  const segLines = LINES.slice(seg.startLine-1, seg.endLine);\n" +
  "  if(segLines.length <= MAX_SEG_LINES) return leaf();   // 够小, 就是叶子\n" +
  "  try{\n    const user = `模块名: ${seg.name}\\n范围: 行 ${seg.startLine}-${seg.endLine}\\n代码:\\n${buildNumbered(segLines, seg.startLine)}`;\n" +
  "    LLM_CALLS++;\n    const r = await aiJSON(SUB_ARCHITECT_SYS, user, 'architect');\n" +
  "    const subs = (r.nodes||[]).filter(n=>n.startLine&&n.endLine).map(n=>({...n, category:seg.category}));\n" +
  "    if(!subs.length) return leaf();\n    const children = [];\n" +

  "    return { type: depth===1?'chiefSeg':'subSeg', name:seg.name, tag:seg.tag, summary:seg.summary, startLine:seg.startLine, endLine:seg.endLine, category:seg.category, children };\n" +
  "  }catch(e){ return leaf(); }   // 细分失败, 当叶子\n" +
  "}\n\n// ═══ 逐段详解(worker) ═══\nconst DETAIL_SYS = `你是双重身份的代码翻译官: 既让小白看懂宏观逻辑, 也让程序员读懂细节。\n" +
  "【输出 archFlowPoints】(给非技术人员) 3-5 条, 每条: label(思维导图节点用的极短标签, 4-8汉字含1个emoji起头, 动词短语或概念名词, 不带行号), text(完整通俗讲解1句话, 大白话+生活类比如\"就像...\", emoji起头, 不带行号), lineStart, lineEnd(对应代码起止行)。整体像讲故事/讲流程。\n" +
  "【输出 lineExplanations】(给程序员) 只解释有信息量的行(· 标记的空行/纯括号行全部跳过), 每条10-25字简洁直接, 说\"为什么这样写\"或\"实际作用\"。\n" +
  "【输出 JSON】{\"archFlowPoints\":[{\"label\":\"\",\"text\":\"\",\"lineStart\":1,\"lineEnd\":3}],\"lineExplanations\":[{\"lineNum\":1,\"explanation\":\"\"}]}`;\n" +
  "\nasync function detailSegment(seg){\n" +
  "  const segLines = LINES.slice(seg.startLine-1, seg.endLine);\n" +
  "  const user = `模块名: ${seg.name}\\n标签: ${seg.tag}\\n范围: 行 ${seg.startLine}-${seg.endLine}\\n总结: ${seg.summary}\\n\\n代码(· 是空行/纯括号可跳过):\\n${buildNumbered(segLines, seg.startLine)}`;\n" +
  "  return await aiJSON(DETAIL_SYS, user, 'worker');\n" +
  "}\nasync function fillSegment(seg, clearStale){ // 四处填段唯一实现(急切批跑/按需生成/重读过时/失败重试): 曾各抄一份且 stale 语义已漂移\n" +
  "  try{ LLM_CALLS++; const d = await detailSegment(seg); seg.archFlowPoints=d.archFlowPoints||[]; seg.lineExplanations=d.lineExplanations||[]; seg.status='done'; if(clearStale) seg.stale=false; return true; }\n" +
  "  catch(e){ seg.status='error'; seg.errorMsg=e.message; return false; }\n" +
  "}\n\n// ─── 合同 regions 助手(模块=archTree 第一层节点) ───\n" +
  "function leavesOf(node, out){ out=out||[]; if(!node) return out; if(node.type==='leafSeg'){ if(node.segmentId!=null) out.push(node.segmentId); } else (node.children||[]).forEach(c=>" +
  "leavesOf(c,out)); return out; }\nfunction moduleNodes(){ const mods=[]; if(ARCH_TREE && ARCH_TREE.children) for(const cat of ARCH_TREE.children) for(const n of (cat.children||[])) mods.push({ node:n, cat:cat.name }); return mods; }\n" +
  "function buildRegions(){\n  const byId={}; SEGMENTS.forEach(s=>byId[s.id]=s);\n" +
  "  const mods = moduleNodes();\n  if(!mods.length) return SEGMENTS.map((s,i)=>({ id:'r'+i, t:s.name, range:[s.startLine,s.endLine], brief:s.summary||'', hash:codeHash(segSlice(s)), stale:!!s.stale, segIds:[s.id] }));\n" +
  "  return mods.map((m,i)=>{\n    const ids = leavesOf(m.node); const segs = ids.map(id=>byId[id]).filter(Boolean);\n" +
  "    const a = m.node.startLine || ((segs[0]||{}).startLine||1), b = m.node.endLine || ((segs[segs.length-1]||{}).endLine||a);\n" +
  "    return { id:'r'+i, t:m.node.name, range:[a,b], brief:m.node.summary||'', hash:codeHash(LINES.slice(a-1,b).join('\\n')), stale:segs.some(s=>" +
  "s.stale), segIds:ids };\n  });\n}\nfunction detailPages(r){   // 已生成段 → 12K/页\n" +
  "  const byId={}; SEGMENTS.forEach(s=>byId[s.id]=s);\n" +
  "  const segs = (r.segIds||[]).map(id=>byId[id]).filter(s=>s && (s.status==='done' || s.lineExplanations || s.archFlowPoints));\n" +
  "  if(!segs.length) return null;\n  const pages=[]; let cur=[], chars=0;\n" +
  "  for(const s of segs){ const c=segSlice(s).length; if(cur.length && chars+c>PAGE_CHARS){ pages.push(cur); cur=[]; chars=0; } cur.push(s); chars+=c; }\n" +
  "  if(cur.length) pages.push(cur);\n  return pages.map(pg=>({ range:[pg[0].startLine, pg[pg.length-1].endLine], segments:pg }));\n" +
  "}\n\n// ═══ 主解析流程(跑在临时工作流上, 路径乙: 阶段节点表达进度, 递归编排在此) ═══\n" +
  "let stageState = {};\nfunction setStage(key, status){ stageState[key]=status; renderStages(); }\n" +
  "function renderStages(){\n  const stages = [\n" +
  "    ['skeleton','🏗','架构分析'],\n    ['subdivide','🔍','逐层细分'],\n" +

  "  ];\n  $('loading-stages').innerHTML = stages.map(([k,ico,name])=>{\n" +
  "    const st = stageState[k]||'';\n    const extra = (k==='detail' && stageState._detailProgress) ? ' ('+stageState._detailProgress+')' : '';\n" +

  "  showPane('loading');\n  $('loading-msg').textContent = '正在解析…';\n" +
  "  renderLocalSkeleton('loading-skel');\n" +
  "  stageState = {}; renderStages();\n  STARTED_AT = Date.now(); LLM_CALLS = 0; CODE_HASH = codeHash(CODE);\n" +
  "  try{\n    // ── 阶段1: 架构分段(大文件粗切, 小文件直接细分) ──\n" +
  "    setStage('skeleton','active');\n    const big = LINES.length > BIG_FILE_LINES;\n" +
  "    STRATEGY = { mode: big?'sub-architect':'direct-line',\n" +
  "      reason: big ? ('文件 '+LINES.length+' 行, 先粗切再由小架构师分层') : ('文件 '+LINES.length+' 行, 直接分段逐行'),\n" +

  "    const CHAP_CHARS = 49152;   // 分章喂: 架构师永不整本单调\n" +
  "    let skel;\n    if (CODE.length > CHAP_CHARS) {\n" +
  "      const chaps = []; { let s = 0; while (s < LINES.length) { let chars = 0, e = s; while (e < LINES.length && chars < CHAP_CHARS) { chars += LINES[e].length + 1; e++; } chaps.push([s + 1, e]); s = e; } }\n" +
  "      skel = { rootName: TARGET?.manifest?.name || '项目', summary: '', categories: [] };\n" +

  "        const [a, b] = chaps[ci];\n        $('loading-msg').textContent = '架构分段 第 ' + (ci + 1) + '/' + chaps.length + ' 章(行 ' + a + '-' + b + ')…';\n" +
  "        LLM_CALLS++;\n        const part = await aiJSON(ARCHITECT_SYS_COARSE, `这是大文件的第 ${ci+1}/${chaps.length} 章(全文共 ${LINES.length} 行, 本章为行 ${a}-${b}); 行号是全局行号, 只对本章范围分段。\\n本章代码(带行号, · 是空行/纯括号):\\n${buildNumbered(LINES.slice(a-1, b), a)}`, 'architect');\n" +
  "        if (!skel.summary && part.summary) skel.summary = part.summary;\n" +
  "        if (part.rootName) skel.rootName = part.rootName;\n" +
  "        for (const c of (part.categories || [])) { const ex = skel.categories.find(x => x.name === c.name); if (ex) ex.nodes = (ex.nodes || []).concat(c.nodes || []); else skel.categories.push(c); }\n" +
  "      }\n    } else {\n      LLM_CALLS++;\n" +
  "      skel = await aiJSON(big?ARCHITECT_SYS_COARSE:ARCHITECT_SYS, `源码总行数: ${LINES.length}\\n源码(带行号, · 是空行/纯括号):\\n${buildNumbered(LINES, 1)}`, 'architect');\n" +
  "    }\n    L0 = skel.summary || '';\n    SKELETON = skel;\n" +
  "    setStage('skeleton','done');\n\n    // ── 阶段2: 可变层级细分 → 建树(挂 children 不扁平) + 收叶 + 产 archTree ──\n" +
  "    setStage('subdivide','active');\n    // 2a. 每个大类下的节点递归细分成树节点\n" +
  "    const catTrees = [];\n    for(const cat of (skel.categories||[])){\n" +
  "      const nodes = (cat.nodes||[]).slice().sort((a,b)=>a.startLine-b.startLine);\n" +
  "      const children = [];\n      for(const n of nodes){ children.push(await subdivideTree({...n, category:cat.name}, 1)); }\n" +
  "      if(children.length) catTrees.push({ type:'category', name:cat.name, children });\n" +
  "    }\n    // 2b. 顺序收集叶子 → SEGMENTS(重编号 + 行号连续兜底), 回填 segmentId 到叶节点\n" +
  "    const leaves = [];\n    const collectLeaves=(node)=>{ if(node.type==='leafSeg') leaves.push(node); else (node.children||[]).forEach(collectLeaves); };\n" +
  "    catTrees.forEach(collectLeaves);\n" +
  "    leaves.sort((a,b)=>a.startLine-b.startLine);\n" +
  "    let cursor = 1; const segs = [];\n" +
  "    leaves.forEach((leaf,i)=>{\n      const seg = { id:i+1, name:leaf.name, tag:leaf.tag, summary:leaf.summary, category:leaf.category,\n" +
  "        startLine:leaf.startLine, endLine:leaf.endLine,\n" +

  "      if(seg.startLine > cursor) seg.startLine = cursor;\n" +
  "      if(seg.endLine < seg.startLine) seg.endLine = seg.startLine;\n" +
  "      cursor = seg.endLine + 1;\n      leaf.segmentId = seg.id; leaf.startLine = seg.startLine; leaf.endLine = seg.endLine;  // 树叶与段对齐\n" +
  "      segs.push(seg);\n    });\n    if(segs.length && segs[segs.length-1].endLine < LINES.length){ segs[segs.length-1].endLine = LINES.length; if(leaves.length) leaves[leaves.length-1].endLine = LINES.length; }\n" +
  "    SEGMENTS = segs;\n    // 2c. 产出正式 archTree(叶子只留 segmentId, 重数据在 SEGMENTS)\n" +
  "    const toArchNode=(node)=> node.type==='leafSeg'\n" +
  "      ? { type:'leafSeg', name:node.name, tag:node.tag, summary:node.summary, startLine:node.startLine, endLine:node.endLine, segmentId:node.segmentId }\n" +
  "      : { type:node.type, name:node.name, tag:node.tag, summary:node.summary, startLine:node.startLine, endLine:node.endLine, children:(node.children||[]).map(toArchNode) };\n" +
  "    ARCH_TREE = { rootName: skel.rootName || TARGET?.manifest?.name || '项目', children: catTrees.map(toArchNode) };\n" +
  "    STRATEGY.recommendedSubArchitects = countType(ARCH_TREE,'chiefSeg');\n" +

  "\n    // 先渲染结构(逐行视图骨架), 详解填充时增量更新\n    showResult();\n" +
  "\n    // ── 阶段3: 逐行详解 — 阈值内急切全量(研读体验不打折), 超阈值按模块分页按需(翻到才生成) ──\n" +
  "    LAZY = CODE.length > EAGER_L3;\n    if (LAZY) {\n" +
  "      setStage('detail','done');\n      stageState._detailProgress = '按需(源码 '+Math.round(CODE.length/1024)+'K > 阈值 '+Math.round(EAGER_L3/1024)+'K, 翻到哪个模块生成哪个)'; renderStages();\n" +
  "    } else {\n      setStage('detail','active');\n" +
  "      let done = 0;\n      stageState._detailProgress = '0/'+SEGMENTS.length; renderStages();\n" +

  "    }\n\n    // ── 阶段4: 汇总 + 落盘 ──\n    setStage('merge','active');\n" +
  "    await saveAnalysis();\n    setStage('merge','done');\n" +
  "\n    showResult();\n    if(LAZY && REGIONS && REGIONS.length) maybeGenerateRegion(activeRegion);   // 首模块自动, 其余翻到才生成\n" +
  "  }catch(e){\n    $('error-msg').textContent = e.message || String(e);\n" +
  "    showPane('error');\n  }\n}\n\n// 存解析结果回目标 miniapp (系统权限)。standalone 模式(无 TARGET_ID)只在内存展示, 不落盘。\n" +
  "async function saveAnalysis(){\n  if(!TARGET_ID) return;\n" +
  "  const stale = CODE_HASH && codeHash(CODE) !== CODE_HASH;   // 解析期间源码被改 → 标脏不覆盖逻辑由 §5(Commit节点)未来强化; 此处记录\n" +
  "  if(!REGIONS) REGIONS = buildRegions();\n" +
  "  const analysis = {   // 合同形状; skeleton 退役\n" +
  "    rootName: SKELETON?.rootName || TARGET?.manifest?.name || '项目',\n" +

  "    srcHash: codeHash(CODE),\n    at: Date.now(),\n" +

  "    totalLines: LINES.length,\n    analyzedAt: Date.now(),\n" +

  "    }\n  };\n  await appdrop.miniapp.update({ id: TARGET_ID, patch: { analysis } });\n" +
  "}\n\n// ─── 视图切换 ───\nfunction showPane(name){\n" +
  "  ['loading','empty','error','input','lines','arch','src'].forEach(p=>{\n" +
  "    const el = $('pane-'+p);\n    if(p===name){ el.classList.add('active'); el.style.display='flex'; }\n" +

  "}\nlet currentView = 'arch';   // 初见即全景(用户裁决): 解析完/打开已有解读, 第一眼是架构地图\n" +
  "function showResult(){\n  $('view-tabs').style.display = 'flex';\n" +
  "  $('actions').style.display = 'flex';\n" +
  "  $('stats').textContent = LINES.length + ' 行 · ' + SEGMENTS.length + ' 模块' + (LAZY ? ' · 按模块分页' : '');\n" +
  "  renderLinesHead(); syncStaleBtn();\n" +
  "  switchView(currentView);\n  renderLines();\n" +
  "}\n// ─── 页头条: L0+模块页签+折行开关 ───\nlet WRAP_CODE = true;   // 长行折行默认开(联动是元素级的, 不破坏对齐)\n" +
  "function applyWrap(){ const c=$('code-side'); if(c) c.classList.toggle('lv-wrap', WRAP_CODE); }\n" +
  "function renderLinesHead(){\n  const el = $('lines-head'); if(!el) return;\n" +
  "  const tabs = LAZY && REGIONS && REGIONS.length > 1;\n" +
  "  if(!L0 && !tabs){ el.style.display='none'; return; }\n" +
  "  el.style.display='flex';\n  let h = L0 ? '<span class=\"l0\">💡 '+esc(L0)+'<\/span>' : '';\n" +
  "  if(tabs){\n    const byId={}; SEGMENTS.forEach(s=>byId[s.id]=s);\n" +
  "    h += REGIONS.map((r,i)=>{\n      const segs=(r.segIds||[]).map(id=>byId[id]).filter(Boolean);\n" +
  "      const done=segs.filter(s=>s.status==='done').length;\n" +
  "      const st = r._busy ? '◌' : (segs.length && done===segs.length ? (r.stale?'⚠':'✓') : (done? done+'/'+segs.length : '·'));\n" +
  "      return '<button class=\"rg-tab'+(i===activeRegion?' active':'')+'\" data-i=\"'+i+'\" title=\"行 '+r.range[0]+'-'+r.range[1]+(r.brief?' · '+esc(r.brief):'')+'\">" +
  "'+esc(r.t)+'<span class=\"rg-st\">'+st+'<\/span><\/button>';\n" +
  "    }).join('');\n  }\n  h += '<button class=\"rg-tab'+(WRAP_CODE?' active':'')+'\" id=\"rg-wrap\" title=\"超长行折行\">↩ 折行<\/button>" +
  "';\n  el.innerHTML = h;\n  el.querySelectorAll('.rg-tab[data-i]').forEach(b=>{ b.onclick = ()=>{ const r = REGIONS[parseInt(b.dataset.i)]; if(r) jumpToLine(r.range[0]); }; });\n" +
  "  const w = el.querySelector('#rg-wrap'); if(w) w.onclick = ()=>{ WRAP_CODE=!WRAP_CODE; applyWrap(); renderLinesHead(); };\n" +
  "}\nfunction maybeGenerateRegion(ri){\n" +
  "  const r = REGIONS && REGIONS[ri]; if(!r || r._busy) return false;\n" +
  "  const byId={}; SEGMENTS.forEach(s=>byId[s.id]=s);\n" +
  "  if((r.segIds||[]).some(id=>{ const s=byId[id]; return s && s.status!=='done'; })){ generateRegion(ri); return true; }\n" +
  "  return false;\n}\nasync function generateRegion(ri){   // 翻到才生成; 油门=厂商并发闸\n" +
  "  const r = REGIONS[ri]; if(!r || r._busy) return;\n" +
  "  const byId={}; SEGMENTS.forEach(s=>byId[s.id]=s);\n" +

  "  if(!todo.length) return;\n  r._busy = true; renderLinesHead(); hint('「'+r.t+'」逐行解读生成中…');\n" +
  "  await Promise.all(todo.map(async seg=>{\n" +
  "    await fillSegment(seg, true);\n" +
  "    if(currentView==='lines' && ri===activeRegion) renderLines();\n" +
  "  }));\n  r._busy = false;\n  if(!todo.some(s=>s.status==='error')){ r.stale = false; r.hash = codeHash(LINES.slice(r.range[0]-1, r.range[1]).join('\\n')); }\n" +
  "  renderLinesHead(); syncStaleBtn(); refreshMindmap();\n" +
  "  if(_pendingJump!=null && ri===activeRegion){ const pj=_pendingJump; _pendingJump=null; requestAnimationFrame(()=>LV.jump(liveCtx, pj)); }\n" +
  "  try{ await saveAnalysis(); }catch(e){}\n" +
  "}\n// ─── 过时段重读(只重写过时段不动结构) ───\nfunction syncStaleBtn(){\n" +
  "  const b = $('btn-refresh-stale'); if(!b) return;\n" +

  "}\nasync function refreshStale(){\n  const list = SEGMENTS.filter(s=>s.stale); if(!list.length) return;\n" +

  "  if(b) b.disabled = false;\n  syncStaleBtn(); renderLinesHead(); refreshMindmap();\n" +
  "  try{ await saveAnalysis(); }catch(e){}\n" +
  "}\n// ─── 极简小提示 ───\nlet _hintEl=null;\n" +
  "function hint(t){ if(!_hintEl){ _hintEl=document.createElement('div'); _hintEl.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--bg-2);border:1px solid var(--accent);color:var(--text);padding:7px 14px;border-radius:8px;z-index:300;fo" +
  "nt-size:12px;transition:opacity .3s;pointer-events:none'; document.body.appendChild(_hintEl); } _hintEl.textContent=t; _hintEl.style.opacity='1'; clearTimeout(hint._t); hint._t=setTimeout(()=>" +
  "{ _hintEl.style.opacity='0'; }, 2200); }\n" +
  "// ─── 失败段重试(detailSegment 提示自带框架上下文) ───\n" +
  "async function retrySegment(segId){\n  const seg = SEGMENTS.find(s=>s.id===segId); if(!seg) return;\n" +
  "  seg.status='pending'; seg.errorMsg=null; if(currentView==='lines') renderLines();\n" +
  "  if(!(await fillSegment(seg, true))) hint('重试仍失败: '+(seg.errorMsg||'').slice(0,60));\n" +
  "  if(currentView==='lines') renderLines();\n" +
  "  renderLinesHead(); refreshMindmap();\n" +
  "  try{ await saveAnalysis(); }catch(e){}\n" +
  "}\n// ─── 零模型本地骨架 ───\nfunction localSkeleton(){\n" +
  "  const items = [];\n  for(let i=0;i<LINES.length && items.length<60;i++){\n" +
  "    const ln = LINES[i];\n    if(/^\\s*\\/\\*\\s*[═=─-]{4,}/.test(ln) || /^\\s*\\/\\/\\s*[═=─-]{4,}/.test(ln)){ const t=(ln+' '+(LINES[i+1]||'')).replace(/[\\/*═=─—-]/g,'').trim().slice(0,36); if(t){ items.push({line:i+1, kind:'§', name:t}); } continue; }\n" +
  "    let m;\n    if((m = ln.match(/^\\s*(?:async\\s+)?function\\s+([A-Za-z_$][\\w$]*)/)))      items.push({line:i+1, kind:'ƒ', name:m[1]});\n" +
  "    else if((m = ln.match(/^\\s*class\\s+([A-Za-z_$][\\w$]*)/)))                  items.push({line:i+1, kind:'class', name:m[1]});\n" +
  "    else if((m = ln.match(/^\\s*(?:const|let|var)\\s+([A-Za-z_$][\\w$]*)\\s*=\\s*(?:async\\s*)?(?:function\\b|\\()/))) items.push({line:i+1, kind:'ƒ', name:m[1]});\n" +
  "    else if((m = ln.match(/^\\s*def\\s+([A-Za-z_]\\w*)/)))                        items.push({line:i+1, kind:'def', name:m[1]});\n" +
  "    else if((m = ln.match(/<(script|style|body|template)\\b/i)))               items.push({line:i+1, kind:'<'+m[1].toLowerCase()+'>" +
  "', name:''});\n  }\n  return items;\n}\n" +
  "function renderLocalSkeleton(hostId){\n" +
  "  const el = $(hostId); if(!el){ return; }\n" +
  "  if(!CODE){ el.innerHTML=''; return; }\n" +
  "  const it = localSkeleton();\n  el.innerHTML = '<div class=\"lsk-head\">⚡ 本地骨架 · 零模型 · '+LINES.length+' 行 / '+Math.round(CODE.length/1024)+'K · '\n" +
  "    + (CODE.length > EAGER_L3 ? '超阈值('+Math.round(EAGER_L3/1024)+'K): 逐行将按模块分页、翻到才生成' : '阈值内: 逐行急切全量')+'<\/div>'\n" +
  "    + (it.length ? '<div class=\"lsk-list\">'+it.map(x=>'<span class=\"lsk-it\"><b>'+x.line+'<\/b> '+esc(x.kind)+(x.name?' '+esc(x.name):'')+'<\/span>" +
  "').join('')+'<\/div>' : '');\n}\nfunction switchView(view){\n" +
  "  currentView = view;\n  document.querySelectorAll('.vt-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===view));\n" +
  "  showPane(view);\n  if(view==='lines') renderLines();\n" +
  "  else if(view==='arch') renderArch();\n" +
  "  else if(view==='src') renderSrc();\n" +
  "}\n\n// ─── 调色板/段定位(委托给共享 R)───\nfunction segColor(seg){ return R.segColor(seg); }\n" +
  "function segOfLine(n){ return R.segOfLine(SEGMENTS, n); }\n" +
  "\n// ─── 逐行视图(走共享控制器 LV)───\n// 实时逐行视图: 走共享控制器 LV(行为与导出完全一致), 通过 liveCtx 注入数据源/落盘/发agent\n" +
  "const liveCtx = {\n  get codeEl(){ return $('code-side'); },\n" +
  "  get expEl(){ return $('exp-side'); },\n" +
  "  paneSwitch(name){ if(currentView!==name) switchView(name); },\n" +
  "  getData(){ const segs = (LAZY && REGIONS && REGIONS.length>1 && REGIONS[activeRegion]) ? SEGMENTS.filter(s => REGIONS[activeRegion].segIds.indexOf(s.id) >" +
  "= 0) : SEGMENTS; return { lines: LINES, segs, activeId: activeSegId }; },\n" +
  "  setActive(id){ activeSegId = id; },\n" +
  "  setData(lines, segs){ LINES = lines; CODE = lines.join('\\n'); SEGMENTS = segs; },\n" +
  "  get actions(){ return (TARGET && TARGET.readonly) ? ['ask'] : ['edit','ask']; },\n" +
  "  get pathMap(){ return buildPathMap(ARCH_TREE); },   // 面包屑: 现场算(决议4)\n" +
  "  onAsk(id){ askAgentAboutSegment(id); },\n" +
  "  onRetry(id){ retrySegment(id); },\n  onLineJump(n){ jumpToLine(n); },\n" +
  "  persist(){ persistEdit(); },\n  afterSave(){ if(currentView==='arch') refreshMindmap(); }\n" +
  "};\nfunction renderLines(){ LV.render(liveCtx); applyWrap(); }\n" +
  "function firstSegOf(n){ if(!n) return null; if(n._seg!=null) return n._seg; if(n._segId!=null) return n._segId; for(const c of (n.children||[])){ const r = firstSegOf(c); if(r!=null) return r; } return null; }\n" +
  "let _pendingJump = null;   // 目标页生成完成后的二次落点(解读卡那时才存在)\n" +
  "function jumpToLine(n){   // 唯一跳行路由(所有点击面纯委托): 定页 → 单次渲染 → 按需生成 → 落点\n" +
  "  _pendingJump = null;\n  let ri = -1;\n" +
  "  if(LAZY && REGIONS && REGIONS.length>1){\n" +
  "    ri = REGIONS.findIndex(r => n>=r.range[0] && n<=r.range[1]);\n" +
  "    if(ri<0){ let bd=1e9; REGIONS.forEach((r,i)=>{ const d=n<r.range[0]?r.range[0]-n:n-r.range[1]; if(d<bd){ bd=d; ri=i; } }); }   // 缝隙行就近归属\n" +
  "  }\n  const moved = ri>=0 && ri!==activeRegion;\n" +
  "  if(moved){ activeRegion = ri; renderLinesHead(); }\n" +
  "  if(currentView!=='lines') switchView('lines');   // switchView 自带渲染(此时分页已正确)\n" +
  "  else if(moved) renderLines();\n  if(ri>=0 && maybeGenerateRegion(ri)) _pendingJump = n;   // 仅真正开火时才登记二次落点\n" +
  "  requestAnimationFrame(()=>LV.jump(liveCtx, n));\n" +
  "}\nfunction hoverLine(n){ LV.hover(liveCtx, n); }\n" +
  "function updateExpCard(seg){ if(currentView==='lines') LV.render(liveCtx); }\n" +
  "\nasync function persistEdit(){\n  if(!TARGET_ID) return;   // standalone: 不落盘\n" +
  "  if(TARGET && TARGET.readonly){ hint('Stem 运行期只读(修改走提案+新生)'); try{ await saveAnalysis(); }catch(e){} return; }\n" +
  "  try{\n    await appdrop.miniapp.update({ id: TARGET_ID, patch: { code: CODE } });   // 写回源码\n" +
  "    await saveAnalysis();   // 更新解析存档(行号已对齐)\n" +
  "  }catch(e){ alert('保存失败: '+e.message); }\n" +
  "}\n\n// ─── D2 占位: 选段 → 把上下文发给全能 agent(改/讨论/问, 不预设) ───\n" +
  "function askAgentAboutSegment(segId){\n" +
  "  const seg = SEGMENTS.find(s=>s.id===segId);\n" +
  "  if(!seg) return;\n  const segCode = LINES.slice(seg.startLine-1, seg.endLine).join('\\n');\n" +
  "  // 把这段上下文发给宿主, 宿主唤起 agent dock 并预填(改/讨论/问由用户决定, 不预设)\n" +
