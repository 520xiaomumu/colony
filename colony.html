<!DOCTYPE html>

<title>Colony</title>
<style>
:root{color-scheme:dark;
--bg:#0a0a0a;
--bg-2:#131313;
--bg-3:#1a1a1a;
--surface:rgba(255,255,255,.035);
--surface-hover:rgba(255,255,255,.065);
--border:rgba(255,255,255,.08);
--border-strong:rgba(255,255,255,.18);
--text:#fafafa;
--text-muted:#8a8a8a;
--text-dim:#555;
--accent:#B5FF00;
--accent-soft:rgba(181,255,0,.12);
--warn:#FF9500;
--danger:#FF4444;
--radius:12px;
--radius-lg:18px;
--mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
--serif:"Fraunces",Georgia,serif}
body{background:var(--bg);
color:var(--text);
font-family:var(--sans);
margin:0}
input,select,textarea,button{font-family:inherit}
.cl-brand{font-family:var(--serif);
font-style:italic;
font-weight:700;
letter-spacing:.4px}
.cl-btn{background:var(--surface);
border:1px solid var(--border-strong);
color:var(--text);
border-radius:8px;
padding:6px 12px;
font-size:12px;
cursor:pointer}
.cl-btn:hover{border-color:var(--accent);
color:var(--accent)}
.cl-btn-primary{background:var(--accent);
border:0;
color:#000;
border-radius:8px;
padding:6px 14px;
font-size:12px;
font-weight:600;
cursor:pointer}
.cl-input{background:var(--bg-2);
border:1px solid var(--border);
color:var(--text);
border-radius:8px;
padding:7px 10px;
font-size:13px;
box-sizing:border-box}
.cl-card{background:var(--bg-2);
border:1px solid var(--border);
border-radius:var(--radius);
padding:14px}
.petri-masthead{display:flex;
align-items:baseline;
gap:12px;
padding:14px 18px;
border-bottom:1px solid var(--border)}
.petri-masthead .cl-brand{font-size:18px;
color:var(--accent)}
.pm-name{font-size:14px;
font-weight:600}
.pm-lineage{margin-left:auto;
font-size:11px;
color:var(--text-muted)}
.settings-hint{font-size:11px;
color:var(--text-muted);
line-height:1.6}
body[data-wrapper] [data-block-id]{padding:18px}
html,body{margin:0;
height:100%;
background:#0a0a0a;
color:#fafafa;
font-family:-apple-system,"PingFang SC",sans-serif}
#colony-root{min-height:100%}
.k-banner{background:#3a2a00;
color:#ffd60a;
padding:8px 14px;
font-size:13px}
.k-panel{max-width:720px;
margin:48px auto;
padding:0 20px}
.k-panel h1{font-size:20px;
margin:0 0 4px}
.k-sub{color:#8a8a8a;
font-size:12px;
margin-bottom:24px}
.k-block{display:flex;
align-items:center;
gap:10px;
padding:12px 14px;
border:1px solid rgba(255,255,255,.09);
border-radius:10px;
margin-bottom:10px;
font-size:13px}
.k-block .nm{font-weight:600}
.k-block .meta{color:#8a8a8a;
font-size:11px}
.k-block .sp{flex:1}
.k-tag{font-size:10px;
padding:2px 7px;
border-radius:4px;
background:rgba(181,255,0,.12);
color:#B5FF00}
.k-tag.warn{background:rgba(245,166,35,.12);
color:#f5a623}
.k-tag.err{background:rgba(255,87,87,.12);
color:#ff5757}
.k-btn{background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.12);
color:#fafafa;
border-radius:7px;
padding:5px 10px;
font-size:12px;
cursor:pointer}
.k-btn:hover{border-color:#B5FF00;
color:#B5FF00}
.k-acts{margin-top:20px;
display:flex;
gap:10px}
</style>

      const html = core.moltHtml({ stemText: L.stemText(), blocks: sel, bumpVersion: true, lineage: { gen: (lin.gen || 0) + 1, parent: KHASH, note: note || '' } });
      K.download('colony-gen' + ((lin.gen || 0) + 1) + '.html', html);
      return html;
    },
    wrapBlock(id) {
      const b = L.findEff(id); if (!b) throw new Error('无此块: ' + id);
      const html = core.wrapBlock(b, { stemHash: KHASH, gen: (LIN0 && LIN0.gen) || 0 });
      K.download(b.manifest.id.replace(/[^\w-]/g, '_') + '.standalone.html', html);
      return html;
    },
    unwrap(html) { return core.unwrap(html); },
    async adopt(input) { // 收养 Petri: 裸 Stem 也能组装 Colony。已知 id → 检疫覆盖; 新 id → 收养存储。两者都零执行, 启用是用户的手动决定
      const blocks = typeof input === 'string' ? core.findBlockTags(input) : (input || []);
      if (!blocks.length) throw new Error('未发现带凭证的 Petri(需要 colony/petri 块标签)');
      const out = [];
      for (const b of blocks) {
        core.validateCode(b.code, b.manifest.id);
        if (L.findEff(b.manifest.id)) { await K.saveBlock(b.manifest.id, b.code, { quarantine: true }); out.push(b.manifest.id + ' → 检疫覆盖(禁用)'); }
        else {
          await L.store.set('adopted:' + b.manifest.id, core.blockText(b.manifest, b.code));
          await L.store.set('block:' + b.manifest.id + ':disabled', true);

    refreshPanel() { if (PANEL.visible) PANEL.render(PANEL.host); },

  };

  /* ── HTML 转义(stem自用: PANEL 渲染外来块 manifest 前必经, 否则恶意块名可注入宿主) ── */
  const escHtml = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  /* ── 裸壳状态页: 无 ui 类块在岗时由stem兜底(裸壳可见且保有繁殖/恢复能力) ── */
  const PANEL = {
    visible: false, el: null, host: null,
    render(host) {
      this.host = host || null;
      const root = host || document.getElementById('colony-root');
      if (!this.el) { this.el = document.createElement('div'); this.el.className = 'k-panel'; }
      host ? host.appendChild(this.el) : root.prepend(this.el); // 裸壳: 钉 #colony-root 顶; 浮层(被 ui-shell 等调起): 渲进给定容器
      this.visible = true;
      const rows = K.listBlocks().map(b => {
        const tag = b.error ? '<span class="k-tag err">' + escHtml(b.error) + '</span>' : b.adopted ? '<span class="k-tag warn">收养</span>' : b.dirty ? '<span class="k-tag warn">已修改</span>' : '<span class="k-tag">出厂</span>';
        const inst = L.inst[b.id]; const hidden = !!(inst && inst.ctx && inst.ctx.root && inst.ctx.root.style && inst.ctx.root.style.display === 'none');
        return '<div class="k-block"><input type="checkbox" class="k-sel" data-id="' + b.id + '"' + (b.disabled ? '' : ' checked') + ' title="勾选 = 新生时带入下一代">'
          + '<span class="nm">' + escHtml(b.name) + '</span><span class="meta">' + escHtml(b.id) + ' · v' + b.version + (b.disabled ? ' · 禁用' : '') + '</span>' + tag + '<span class="sp"></span>'
          + (b.running ? '<button class="k-btn" data-act="vis" data-id="' + b.id + '">' + (hidden ? '显示UI' : '隐藏UI') + '</button>' : '')
          + '<button class="k-btn" data-act="toggle" data-id="' + b.id + '">' + (b.disabled ? '启用' : '禁用') + '</button>'
          + ((b.dirty || b.adopted) ? '<button class="k-btn" data-act="reset" data-id="' + b.id + '">' + (b.adopted ? '移除收养' : '恢复出厂') + '</button>' : '')
          + '<button class="k-btn" data-act="wrap" data-id="' + b.id + '">导出 Petri</button></div>';
      }).join('');
      const collapsed = !!this.petriCollapsed;
      this.el.innerHTML = '<h1><span style="color:#B5FF00;font-style:italic">Colony</span> · Stem' + (L.safe ? ' · 安全模式' : '') + ' · <span class="k-petri-tog" data-act="petricollapse" style="cursor:pointer;font-size:13px;color:var(--text-muted)">petri ' + (collapsed ? '▸' : '▾') + '</span></h1>'
        + (collapsed ? '' : ('<div class="k-sub">族谱 第 ' + ((K.lineage && K.lineage.gen) || '?') + ' 代 · Stem ' + KHASH + ' · ' + (L.safe ? '已忽略全部覆盖层与收养' : (rows ? '无界面 Petri 在岗, Stem 兜底页 — 导入并启用 Petri 来组装你的 Colony' : '空白种子 — 导入 Petri 开始组装你的 Colony')) + '</div>'
        + rows
        + '<div class="k-acts"><button class="k-btn" data-act="import">⬆ 导入 Petri</button><button class="k-btn" data-act="molt">🌱 新生导出(勾选)</button><button class="k-btn" data-act="src">查看可见源码</button></div>'));
      this.el.querySelectorAll('[data-act]').forEach(btn => btn.onclick = async () => {
        const id = btn.dataset.id, act = btn.dataset.act;
        try {
          if (act === 'vis') { const inst = L.inst[id]; if (inst && inst.ctx && inst.ctx.root) inst.ctx.root.style.display = (inst.ctx.root.style.display === 'none') ? '' : 'none';
               }
          else if (act === 'petricollapse') PANEL.petriCollapsed = !PANEL.petriCollapsed;
          else if (act === 'toggle') await K.setEnabled(id, btn.textContent === '启用');
          else if (act === 'reset') { if (confirm('恢复「' + id + '」到出厂版?')) await K.restoreFactory(id); }
          else if (act === 'wrap') K.wrapBlock(id);
          else if (act === 'molt') {
            const ids = [...PANEL.el.querySelectorAll('.k-sel')].filter(x => x.checked).map(x => x.dataset.id);
            K.molt(ids.length ? ids : null, '手动新生');
          }
          else if (act === 'import') {
            const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.html,.htm,.js,.txt'; inp.multiple = true;
            inp.onchange = async () => {
              const msgs = [];
              for (const f of inp.files) {
                try { const r = await K.adopt(await f.text()); msgs.push(...r); }
                catch (e) { msgs.push(f.name + ' ✗ ' + e.message); }
              }
              alert('导入结果:\n' + msgs.join('\n') + '\n\n收养/检疫块均为禁用态, 点「启用」让它上岗。');
            };
            inp.click();
          }
          else if (act === 'src') { const w = window.open('about:blank'); w.document.write('<pre>' + escHtml(K.readSource()) + '</pre>'); }
          PANEL.render(PANEL.host);
        } catch (e) { alert(e.message); PANEL.render(PANEL.host); }
      });
    },
  };

  /* ── 装载(可重入): 扫描 → 收养并入 → 覆盖层 → 拓扑 → 逐块实例化。boot 与 K.reboot 共用(修订#7) ── */
  async function assemble() {
    L.scan();
    if (!L.safe) L.factory = await core.mergeAdopted(L.factory, L.store); // 收养块并入(裸 Stem 组装 Colony 的入口)

  }

  /* ── 启动: 崩溃环检测 → 开库 → 装载 ── */
  async function boot() {

    try { crashes = parseInt(localStorage.getItem(BOOT_KEY) || '0'); localStorage.setItem(BOOT_KEY, String(crashes + 1)); } catch (_) { }
    L.safe = url.searchParams.get('safe') === '1' || crashes >= 3;

    if (L.safe && crashes >= 3) {
      const ban = document.createElement('div'); ban.className = 'k-banner';
      ban.textContent = '连续启动失败, 已自动进入安全模式(忽略覆盖层)。嫌疑块: ' + (await L.store.list('block:')).filter(e => String(e.key).endsWith(':cur')).map(e => String(e.key).slice(6,
           -4)).join(', ');
      document.body.prepend(ban);
    }
    await assemble();
    try { localStorage.setItem(BOOT_KEY, '0'); } catch (_) { }
  }
  g.__ColonyStem = { core, K, L, RT, SDK, boot };
  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  }
})(typeof window !== 'undefined' ? window : globalThis);
</script>

  /* 折叠气泡可拖动(_moved 防误触展开; 拖动期间屏蔽 iframe) */

  /* ── 群聊状态(在场即共享)与瞬态状态行: renderTranscript/renderMembers/send 共用, 须先于它们声明 ── */

  /* ── 群聊(语义归桥): 参与名单/已读游标/@解析/delta 组装都在桥块 Agent.Group, 本块只做 dock 薄接线 —

  const _dialogAuthor = m => (m.role === 'user' && m.to != null) ? ('群主 → ' + (m.toName || '?')) : (m.role === 'user' ? '群主' : (m.authorName || '全能 agent'));

  /* 问一位成员(游标制): 桥算增量(只给他没见过的) → 流式展示 → 送达 markSeen(失败不动游标, 重问不丢话) → 回复入档按成员署名 */
  /* 会话档单条追加: 当前会话走内存 _histCache 同步 push(消除"各自 S.get 拿旧基线→并发覆盖丢消息"), 非当前会话(切走)才读存储写 */
  async function appendHist(sc, entry) {

  }
  async function askMember(target, sc) { // sc=发起会话(互动/切会话下与 curSession 解绑, 不串味); 返回是否真发言(供互动跳过沉默)

    if (!d.count) { el.querySelector('.msg-body').textContent = '(没有他未读的新消息, 未发送)'; return false; }
    let acc = '', ok = false, cut = false;
    try {
      for await (const ev of br.chatWithMember(target.bridgeId, target.id, d.text, { scope: sc })) {
        if (_stop) { cut = true; break; } // 停止/全清: 掐断当前成员流(与引擎同款可停)

  }
  /* 用户点名一位成员: 用户消息先入档(房间事实先行, delta 才拿得到这条) → askMember */
  async function sendToMember(target, text) {
    try { await appendHist(curSession, { role: 'user', content: text, to: target.id, toName: target.name, ts: _tsNow() }); } catch (e) { }

  }

  /* ════ 多会话(chat.sessions / chat.currentSession / chat.transcript.<sid>) ════ */
  let sessions = [{ id: 'main', name: '默认会话' }], curSession = 'main';
  const chatKey = sid => 'chat.transcript.' + sid;
  async function loadSessions() {
    sessions = await S.get('chat.sessions', sessions);
    curSession = await S.get('chat.currentSession', 'main');

    try {   // 启动兜底: 上次会话遗留的 running 活行统一标记中断 — 无论何种停摆根因, 重开后绝不谎称在跑
      const hist = await S.get(chatKey(curSession), []);
      let dirty = false;
      for (const m of hist) if (m && m.role === 'trace' && m.status === 'running') { m.status = 'error'; m.ok = false; m.label = (m.label || '') + ' — ⚠ 上次会话中断'; dirty = true; }
      if (dirty) await S.set(chatKey(curSession), hist);
    } catch (e) { }
    lockTarget = null; _inputPlaceholder(); // 锁定连聊是会话内瞬态, 切会话即解
    // 互动状态按 scope 归桥, 切会话自然读新会话的(无需手动重置); 运行中的循环绑定发起时 scope, 切走自然收尾
    try { syncGroupUI(); renderAtRow(); syncRelayBtn(); } catch (e) { }

  }
  const saveSessions = () => Promise.all([S.set('chat.sessions', sessions), S.set('chat.currentSession', curSession)]);
  let _histCache = [];   // 内存镜像: engine push, 重绘读它
  let _streamAnswer = ''; // 最终回答的临时流式气泡(单份)。onD 边流边填, 见工具块即清, 最终轮交持久化前清 → 永不与正式并存
  let _streamEl = null;  // 流式气泡的 .msg-body 引用: 纯文字增量走快path原地更新, 不整列重建(重建=媒体高度反复塌陷=抖)
  let _interrupts = [];   // 运行中插话队列。busy 时 send 入队, engine 每轮顶端 drainInterrupts 吸收
  let _stop = false;      // 停止当前轮: 运行中工具链头⏹按钮置位, engine 在各安全点 break(防失控长跑)
  let _turnAbort = null;  // 当前轮流式请求的取消器: 停止/插话即时掐断 fetch/reader, 不等下一个 chunk
  let _loop = null;       // 自主循环激活态 {taskId, failSig:[]}; 非空时引擎在"无工具=最终回答"闸跑 verify→record→续轮/停止
  const _txt = c => typeof c === 'string' ? c : ((Array.isArray(c) ? (c.find(p => p.type === 'text') || {}).text : '') || '[附件]');
  const _chainOpen = {}; // turnId→链展开 / traceId→行详情; 用户点过才有键(没点过=默认: live 展开, 否则折叠)
  function requestStop(btn) { if (!busy || _stop) return; _stop = true; if (_turnAbort) { try { _turnAbort.abort(); } catch (e) {} } if (btn) { btn.textContent = '⏹…'; btn.disabled = true; } } // 置位 + 立即掐断当前流式请求, engine 在各安全点收尾结束本轮
  function makeChain(traces, live) {   // 折叠链: 头部 + body 收纳 trace 行; live=本轮还在跑(busy∧末轮∧无终答)
    const key = traces[0] && traces[0].turnId;

      + '<span class="chain-ttl">工具链</span><span class="chain-n">' + traces.length + ' 步 · ' + stat
      + '</span><span class="chain-tg">▾</span></div><div class="chain-body"></div>';
    box.querySelector('.chain-head').onclick = () => { box.classList.toggle('open'); if (key) _chainOpen[key] = box.classList.contains('open'); };

  async function renderTranscript(reload) {
    if (reload) _histCache = await S.get(chatKey(curSession), []);
    const conv = $('agent-convo'); const keepY = stickBottom ? null : conv.scrollTop; conv.innerHTML = '';
    // 一轮一链(按 turnId 缝合): 提问气泡→工具链折叠→最终回答(该轮最后一条非 toolTurn 的 assistant, 剥工具块)。

    const H = _histCache;
    const n = H.length;
    const isPrompt = m => m.role === 'user' && !String(_txt(m.content)).startsWith('工具结果') && !String(_txt(m.content)).startsWith('[系统]');
    const proseOf = m => String(m.content).replace(/```tool[\s\S]*?```/g, '').trim();
    let lastTid; for (let k = n - 1; k >= 0; k--) if (H[k].turnId) { lastTid = H[k].turnId; break; }
    const emitChain = (tr, lastAssist) => { if (tr.length) conv.appendChild(makeChain(tr, busy && tr[0].turnId === lastTid && !lastAssist)); };

        }

  }
  function toggleSessDrop(show) {
    const dd = $('sess-dropdown');

    dd.style.display = show ? '' : 'none';
    if (!show) return;
    dd.innerHTML = '';
    for (const s of sessions) {
      const it = document.createElement('div'); it.className = 'sess-item' + (s.id === curSession ? ' active' : '');
      it.innerHTML = '<span class="sess-item-name">' + esc(s.name)
        + '</span><span class="sess-item-acts"><button data-a="ren" title="重命名">✏</button>'
        + (sessions.length > 1 ? '<button data-a="del" title="删除">🗑</button>' : '') + '</span>';
      it.onclick = async e => {
        const a = e.target.dataset && e.target.dataset.a;
        if (a === 'ren') {
          const n = prompt('会话名', s.name);
          if (n) { s.name = n; await saveSessions(); $('sess-name').textContent = (sessions.find(x => x.id === curSession) || {}).name || ''; }
          toggleSessDrop(true); return;
        }
        if (a === 'del') {
          if (!confirm('删除会话「' + s.name + '」及其记录?')) return;
          sessions = sessions.filter(x => x.id !== s.id); await S.del(chatKey(s.id));
          try { const b2 = bridge(); if (b2 && b2.resetMemberContext) { await b2.resetMemberContext({ scope: s.id }); if (b2.dropGroupScope) await b2.dropGroupScope(s.id); } } catch (e2) { } // 该会话域的成员服务端会话+群聊参与/游标一并回收
          if (curSession === s.id) curSession = sessions[0].id;
          await saveSessions(); await loadSessions(); toggleSessDrop(false); return;
        }
        curSession = s.id; await saveSessions(); await loadSessions(); toggleSessDrop(false);
      };

    }
  }
  $('sess-current').onclick = e => { e.stopPropagation(); toggleSessDrop(); };
  $('sess-condense').onclick = async e => { // 手动压缩(🗜): 与引擎被动压缩共用 condense; busy 时不抢档
    e.stopPropagation(); if (busy) return dockStatus('任务进行中, 结束后再压缩');
    const brain = await S.get('agent.brain', {});

    dockStatus('🗜 压缩中…');

      _histCache = await S.get(chatKey(curSession), []);

  };

    e.stopPropagation();
    const name = prompt('新会话名', '会话 ' + (sessions.length + 1)); if (!name) return;
    const s = { id: 's' + Date.now().toString(36), name }; sessions.push(s); curSession = s.id;

  };

  /* ════ @快捷键行: 只列参与成员+@所有人; 单击插@名, 双击锁定连聊; 没有@全能键 — 无@默认就是对他说 ════ */

  /* ════ 互动模式(状态/次数/发言序/轮转都归桥 Group; 本块只留 running 瞬态 + 执行发言 + UI) ════
     桥不在场=无群聊(按钮自隐)。发言执行: 全能跑本块引擎(relayFullTurn), 成员流式展示(askMember) —— 碰引擎/DOM/会话档, 架构上必须在本块。 */
  let _relayRunning = false, _clearGen = 0; // _relayRunning: 是否在跑互动循环; _clearGen: 全清递增, 作废在途成员发言的写入(不必等慢成员流收尾)
  const _relayInfo = () => { const br = bridge(); return (br && br.relayInfo) ? br.relayInfo(curSession) : { on: false, count: 0, limit: 5 }; };
  function syncRelayBtn() {
    const b = $('relay-toggle'); if (!b) return;
    const br = bridge();
    if (!br || !br.relayInfo) { b.style.display = 'none'; const n = $('relay-n'); if (n) n.style.display = 'none'; return; } // 桥不在场=无群聊(功能随块)
    const info = _relayInfo();
    b.style.display = ''; const n = $('relay-n'); if (n) { n.style.display = ''; if (document.activeElement !== n) n.value = info.limit; }
    b.textContent = info.on ? ('🔁 互动中 ' + info.count + '/' + info.limit) : '🔁 互动';
    b.style.color = info.on ? 'var(--accent)' : '';

  $('relay-toggle').onclick = async e => { // 开/关归桥(状态随桥), 状态全交给按钮倒计数
    e.stopPropagation(); const br = bridge(); if (!br || !br.relayToggle) return;
    await br.relayToggle(curSession); syncRelayBtn();
  };
  ctx.listen($('relay-n'), 'change', async () => { const br = bridge(); if (!br || !br.relaySetLimit) return; const v = await br.relaySetLimit($('relay-n').value); $('relay-n').value = v; syncRelayBtn(); });
  function relayLastSpeaker() { // 最近发言者 id(全能=__builtin__): 读本块会话档(房间记录数据持有方), 供桥轮转找下一位; 自愈: 每跳从记录重新推断
    for (let i = _histCache.length - 1; i >= 0; i--) {
      const m = _histCache[i];
      if (m.role === 'member' || (m.role === 'assistant' && m.author != null)) return m.author;
      if (m.role === 'assistant' && m.turnId && !m.toolTurn) return '__builtin__';
    }
    return null;
  }
  const paintCtx = ev => { const el = $('ctx-meter'); if (el) el.textContent = (ev.used / 1000).toFixed(1) + 'k / ' + Math.round(ev.budget / 1000) + 'k · ' + Math.round(ev.used / ev.budget * 100) + '%'; };   // 上下文量表(互动/发送共用)
  const BG_RECEIPT = '[后台工作流回执]';   // 注入嗅探与构造共源(字符串协议别再各写各的)
  const mkPainter = () => {   // 刀21 流式节流三件套(send/互动接话共用一份, 别各写各的): 纯文字增量走快path只长流式气泡; 其余≤50ms一次全量重绘; 结构性事件 flush 即时
    const W = e => console.warn('[agent] 重绘出错(不中断):', e);
    const doPaint = () => { try { const r = renderTranscript(); if (r && r.catch) r.catch(W); } catch (e) { W(e); } };   // 隔离: 重绘崩不中断 engine 迭代器
    let t = 0, pend = null;
    const live = () => {
      if (_streamAnswer && _streamEl && _streamEl.isConnected) { _streamEl.textContent = _streamAnswer; chatScroll(); return; } // 快path: 整列重建会让媒体槽位高度塌陷重排=剧烈抖动
      const now = Date.now(), gap = now - t;
      if (gap >= 50) { t = now; doPaint(); }
      else if (!pend) pend = setTimeout(() => { pend = null; t = Date.now(); doPaint(); }, 50 - gap);
    };
    const flush = () => { if (pend) { clearTimeout(pend); pend = null; } t = Date.now(); doPaint(); };
    return { live, flush };
  };
  async function relayFullTurn() { // 全能接话一轮: 引擎 seed 模式(情境引导不落盘, 只留它的回复); 返回是否发言
    let brain = await S.get('agent.brain', {});
    if (!brain.providerId) return false; // 全能无大脑: 静默跳过本跳(成员继续轮)
    const seedText = '[群聊互动] 大家在群里聊天, 请你基于上面的对话自然地接一句话(简洁、有内容、别重复别人已经说过的, 别用工具)。';
    const p = mkPainter();   // 刀21 补齐: 接话流式也走节流+快path, 不再逐 token 全量重绘
    for await (const ev of engine(seedText, brain, () => p.live(), _histCache, { seed: true })) {

    p.flush();

  function maybeRelay() { if (_relayInfo().on && !_relayRunning && !_stop) relayLoop(); } // 每次用户触发的回应完成后调; 已在跑不重入
  async function relayLoop() { // 循环执行(桥给状态与"下一位", 本块只执行发言+UI)
    const br = bridge(); if (!br || !br.relayNext) return;
    const sc = curSession; // 绑定发起时会话: 中途切会话则收束(不串味)
    const info = () => br.relayInfo(sc);
    _relayRunning = true; busy = true; $('agent-send').textContent = '插话'; syncRelayBtn();
    try {
      let lastId = relayLastSpeaker(), dry = 0; // 本地维护发言者游标(每跳前移, 不靠记录推断→沉默成员不再卡住轮转)
      while (info().on && !_stop && curSession === sc && info().count < info().limit) {
        const next = br.relayNext(sc, lastId, true); // 桥算下一位(dock 含全能占位)
        if (!next) break; // 只有全能没成员=没人可轮, 静默停(按钮复位即表达)
        lastId = next.builtin ? '__builtin__' : next.id; // 前移: 沉默也跳过它, 不重复解析同一位
        const spoke = next.builtin ? await relayFullTurn() : await askMember(next, sc);
        if (spoke) { await br.relayBump(sc); dry = 0; } // 真发言才计数(limit=接话次数); 沉默不计
        else if (++dry >= br.participants(sc).length + 1) break; // 转满一圈无人发言(全员无未读)=兜底停, 防空转
        syncRelayBtn();
        await renderTranscript(true);
      }
    } catch (e) { appendMsg('系统', '互动出错: ' + e.message, 'assistant'); } // 出错才留一条(无 spinner), 正常停不插横批
    _relayRunning = false; idle();
    if (_stop || info().count >= info().limit) await br.relayEnd(sc); // 停止/到数: 静默收束
    syncRelayBtn();
  }
  async function relayInterject(text) { // 互动运行中用户插嘴: 计数清零(归桥), 消息进群记录(内存 push 防并发覆盖), 循环续跑(下一位看得到)
    const br = bridge(); if (br && br.relayResetCount) await br.relayResetCount(curSession); syncRelayBtn();

      await appendHist(curSession, { role: 'member', author: m.agentKey || m.from, authorName: m.from || 'bridge agent', content: m.content || '', ts: _tsNow() });
    } catch (e) { }
  });

  /* ════ 兜底大脑(LLMLite)配置行: petri:ai 不在岗时的最低限度配置面(colony 与独立穿衣通用) ════ */

        }

        appendMsg('系统', '内置全能 agent 还没有大脑: 有 AI 配置块就点亮框填 Key 并拉取模型; 没有就在上方大脑区点 ⚙ 配置 LLMLite 兜底(endpoint/key/model)。' + (hasBridge ? ' (你也可以直接 @ 某个 bridge 成员对话, 不需要大脑)' : ''), 'assistant');

  async function blobToWav16k(blob) {
    const AC = window.AudioContext || window.webkitAudioContext;
    const ac = new AC();
    const buf = await ac.decodeAudioData(await blob.arrayBuffer());
    const rate = 16000, len = Math.ceil(buf.duration * rate);
    const oc = new OfflineAudioContext(1, len, rate);
    const srcN = oc.createBufferSource(); srcN.buffer = buf; srcN.connect(oc.destination); srcN.start();
    const out = await oc.startRendering(); ac.close();
    const pcm = out.getChannelData(0);
    const wav = new DataView(new ArrayBuffer(44 + pcm.length * 2));
    const wr = (o, s) => { for (let i = 0; i < s.length; i++) wav.setUint8(o + i, s.charCodeAt(i)); };
    wr(0, 'RIFF'); wav.setUint32(4, 36 + pcm.length * 2, true); wr(8, 'WAVEfmt '); wav.setUint32(16, 16, true);
    wav.setUint16(20, 1, true); wav.setUint16(22, 1, true); wav.setUint32(24, rate, true); wav.setUint32(28, rate * 2, true);
    wav.setUint16(32, 2, true); wav.setUint16(34, 16, true); wr(36, 'data'); wav.setUint32(40, pcm.length * 2, true);
    for (let i = 0; i < pcm.length; i++) { const s = Math.max(-1, Math.min(1, pcm[i])); wav.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true); }
    let bin = ''; const u8 = new Uint8Array(wav.buffer); const CH = 0x8000;
    for (let i = 0; i < u8.length; i += CH) bin += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
    return { data: btoa(bin), mimeType: 'audio/wav' };
  }
  /* ════ 语音输入(一次授权终身复用) ════ */
  let micStream = null, recorder = null, chunks = [];
  $('agent-voice').onclick = async () => {
    const btn = $('agent-voice');
    if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
    try {
      if (!micStream || !micStream.active) micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      else micStream.getTracks().forEach(t => t.enabled = true);
      chunks = []; recorder = new MediaRecorder(micStream);
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = async () => {
        btn.classList.remove('recording'); btn.textContent = '…';
        micStream.getTracks().forEach(t => t.enabled = false);
        const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
        const b64 = await toB64(blob);
        try {
          const v = await resolveVoicePrefs();
          if (!v._hasSTT) throw new Error('转写需要一个声明了听觉(audio.transcribe)能力的已配 Key 厂商 — 去 ⚙ AI 配置添加');
          const wav = await blobToWav16k(blob).catch(() => null); // 统一转 16k 单声道 WAV, 提高各家兼容性
          const audio = wav || { data: b64, mimeType: blob.type };
          const r = await (await llm()).transcribeAudio({ providerId: v.sttProviderId, ...(v.sttModel ? { model: v.sttModel } : {}), audio });
          $('agent-input').value += (r && r.text || '');
        } catch (e) { alert('转写失败: ' + e.message); }
        btn.textContent = '🎤';
      };
      recorder.start(); btn.classList.add('recording'); btn.textContent = '⏹';
    } catch (e) { alert('麦克风不可用: ' + e.message); }
  };

  loadSessions();
  ctx.timer(() => { const u = ui(); if (u && u.registerBlockPage) u.registerBlockPage(ctx.id, () => applyDock(true)); }, 30);
  ctx.provide('agent', { send: t => { $('agent-input').value = t || ''; return send(); }, prim, openDock: () => applyDock(true) });
  ctx.on('workflow:bg-done', async ev => { // 后台工作流(detach)收口: 完成/失败冒泡进对话 — appendMsg 显示([[show]]自动渲染) + appendHist 入档(防 busy 期被引擎 persist 覆盖)
    try {
      const outs = (ev && ev.outputs) || {};
      const pickShow = v => { // 挖出可展示地址: 裸key / 顶层{__wfasset} / 节点输出把媒体挂在 .media|.image|.audio|.video 端口(grow/多节点图会嵌一层)
        if (!v) return null;
        if (typeof v === 'string') return /^(wfout|wfasset|media|chatasset|runtimeshot):/.test(v) ? v : null;
        if (typeof v !== 'object') return null;
        if (v.__wfasset) return 'wfasset:' + v.__wfasset;
        return pickShow(v.media) || pickShow(v.image) || pickShow(v.audio) || pickShow(v.video);
      };
      const shows = Object.values(outs).map(pickShow).filter(Boolean).slice(0, 3);
      const nOuts = Object.values(outs).filter(v => v != null && v !== '').length; // 空端口(如空text)不计, 别报"2项"却只有1个能看
      const pickText = v => (typeof v === 'string' && v.trim() && !pickShow(v)) ? v : (v && typeof v === 'object' && typeof v.text === 'string' && v.text.trim() ? v.text : null);
      const txt = Object.values(outs).map(pickText).filter(Boolean)[0]; // 纯文本成果给一句预览: 媒体有[[show]]内联, 文本不能只报"N项"却啥都看不见
      const msg = (ev && ev.status === 'done' ? '✅ 后台工作流「' + ((ev && ev.name) || '') + '」完成' : '⚠ 后台工作流「' + ((ev && ev.name) || '') + '」失败: ' + String(((ev && ev.errors) || [])[0] || '').slice(0, 120))
        + (nOuts ? ' · 成果 ' + nOuts + ' 项' : '') + shows.map(k => ' [[show:' + k + ']]').join('')
        + (txt ? '\n「' + txt.trim().slice(0, 160) + (txt.trim().length > 160 ? '…' : '') + '」' : '')
        + ((ev && ev.notes && ev.notes.length) ? '\n' + ev.notes.slice(0, 3).join('\n') : ''); // 智选替换厂商等告知透传(后台不静默顶包)
      const rid = (ev && ev.runId) || '';
      const sess = _bgSess[rid] || curSession; delete _bgSess[rid]; // 按 runId 精确回发起会话(不是完成时恰好在看的会话)
      await appendHist(sess, { role: 'assistant', content: msg, ts: _tsNow() });
      if (sess === curSession) {
        appendMsg('工作流', msg, 'assistant');
        if (busy) { _interrupts.push(BG_RECEIPT + ' ' + msg); if (_turnAbort) { try { _turnAbort.abort(); } catch (e2) { } } } // 在途轮注入真结果: 大脑看到冒泡才收尾——根治"结果在上下文之外, 看不到就编"(弱脑事后瞎总结/捏造资产id)
      }
      else dockStatus('✅ 后台工作流「' + ((ev && ev.name) || '') + '」已完成 — 结果在发起它的会话里'); // 人在别的会话: 轻提示不打断
    } catch (e) { console.warn('[agent] 后台回执处理失败(不再无声):', e); }
  });
  ctx.on('agent:ask', p => { // 选中即问(代码解读的选段/ui-shell 的点选元素等任何块都可发此事件, kind 透传; 本块不在岗自然无人接 — 松耦合)
    try {
      const dock = document.getElementById('agent-dock'); if (!dock) return;
      dock.classList.remove('collapsed'); dock.classList.add('expanded');

      renderAtts();
      const inp = document.getElementById('agent-input'); if (inp) inp.focus();
    } catch (e) { }
  });

  return { api: { prim }, dispose() { if (micStream) micStream.getTracks().forEach(t => t.stop()); } };
})

  function guardSDK(provider, fromMiniApp) { if (fromMiniApp && !provider.allowMiniAppSDK) throw new Error('厂商「' + (provider.name || provider.id) + '」未对 SDK 面开放(agent 的 run call:ai.* 与 miniapp 同走此闸) — AI 配置里该厂商勾选「允许 mini app 通过 SDK 调用」即可'); }   // 文案改真话: 调用方不一定是 miniapp, 指明开关位置
  async function mediaCall(cap, args, provider) {
    provider = provider || await getProvider(args.providerId, args.model);
    guardSDK(provider, args.fromMiniApp);
    const adapter = resolveAdapter(provider);
    const spec = MEDIA[cap];
    if (!(adapter.capabilities || []).includes(cap) || !adapter[spec.build])
      throw new Error(`provider「${provider.name}」(${provider.protocol}) 不支持${CAP_LABELS[cap]}; 请选支持 ${cap} 的 provider(如 ${spec.eg})`);
    const req = adapter[spec.build](provider, args);
    const res = await Net.fetch(req.url, { method: 'POST', headers: req.headers, body: req.body, proxy: provider.proxy, timeout: spec.timeout });
    if (!res.ok) await httpFail(res, provider, adapter);
    const payload = req._binary ? { audioBase64: Assets.bytesToB64(new Uint8Array(await res.arrayBuffer())) } : req._sse ? await res.text() : await res.json();
    return adapter[spec.parse](payload);

  // 生图: 返回标准化 {image:{type,mimeType,data|url}, text}; 不支持则报错(不假装)
  const generateImage = (a = {}) => mediaCall('image.generate', a);

  // 生视频(异步 long-running, 自动轮询); adapter 不支持则报错
  async function generateVideo({ prompt, model, image, aspectRatio, providerId, fromMiniApp, onProgress } = {}) {
    const provider = await getProvider(providerId, model);
    guardSDK(provider, fromMiniApp);
    const adapter = resolveAdapter(provider);
    if (!adapter.buildVideoRequest || !(adapter.capabilities || []).includes('video.generate'))
      throw new Error(`provider「${provider.name}」(${provider.protocol}) 不支持生视频; 请选支持 video.generate 的 provider(如 Gemini Veo)`);

    const { url, headers, body } = adapter.buildVideoRequest(provider, { prompt, model, image, aspectRatio });
    const res = await Net.fetch(url, { method: 'POST', headers, body, proxy: provider.proxy, timeout: 120000 });
    if (!res.ok) await httpFail(res, provider, adapter);

    for (let i = 0; i < 60 && !op.done; i++) {
      await new Promise(r => setTimeout(r, 10000));
      if (onProgress) try { onProgress(`视频渲染中… 已等待 ${(i + 1) * 10}s`); } catch {}

      const pres = await Net.fetch(pr.url, { method: 'GET', headers: pr.headers, proxy: provider.proxy, timeout: 30000 });
      if (!pres.ok) continue;
      const next = adapter.parseVideoOperation(await pres.json());
      if (!next.done && !next.operationName) next.operationName = op.operationName; // 中间态缺 task_id: 沿用本次轮询的句柄(状态在调用方, adapter 无共享态)
      op = next;
    }
    if (!op.done) throw new Error('生视频超时(10分钟未完成)');
    if (op.error) throw new Error('视频生成失败: ' + op.error);
    if (!op.video) throw new Error('视频任务完成但未返回视频数据');

        if (vr.ok) {

  // 消费方 = agent 朗读(playAudio)/设置页试听/miniapp SDK, 三方从此只认一种形
  function _normTTS(r) {
    if (r && !r.audioBase64 && r.audio && r.audio.data) return { audioBase64: r.audio.data, mimeType: r.audio.mimeType || 'audio/mpeg', raw: r.raw || r };

  // 音乐(文字→歌): 未指定 provider 时回退到首个支持且配了 Key 的
  async function generateMusic(a = {}) {
    let provider = null;
    if (!a.providerId) {
      provider = (await allProviders()).find(p => ((providers.get(p.protocol) || {}).capabilities || []).includes('music.generate') && p.apiKey);
      if (!provider) throw new Error('没有支持音乐生成的 provider(如 MiniMax); 在 AI 配置添加并配好 Key 再试');
    }
    return mediaCall('music.generate', a, provider);
  }

  // 某 provider(或全部)的能力声明 — 来自 adapter, 用于按能力过滤模型
  async function getCapabilities(providerId) {
    if (providerId) {
      const p = await getProvider(providerId);
      return { providerId, protocol: p.protocol, capabilities: resolveAdapter(p).capabilities || ['text.chat'] };
    }
    const all = await Settings.getProviders();
    return all.map(p => {
      const a = providers.get(p.protocol);
      return { id: p.id, name: p.name, protocol: p.protocol, capabilities: (a && a.capabilities) || ['text.chat'], allowMiniAppSDK: !!p.allowMiniAppSDK, models: p.models || [], hasKey: !!p.apiKey, verified: p.verified || {}, notes: p.notes || {}, model: p.model || '', ttsModel: p.ttsModel || '', sttModel: p.sttModel || '', imageModel: p.imageModel || '', videoModel: p.videoModel || '' };

  async function* chatStream({ messages, model, tools, temperature, providerId, fromMiniApp, signal } = {}) {

    const adapter = resolveAdapter(provider);

    const { url, headers, body } = adapter.buildChatRequest(provider, { messages, model, tools, temperature, stream: true });
    // SSE 行解析(单一解析器纪律: 直连与插件中继喂同一个)
    let buf = '';
    const parseLines = function* (txt) {
      buf += txt;
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).replace(/\r$/, '');

      for await (const t of Relay.stream({ url, method: 'POST', headers, body })) {
        if (signal && signal.aborted) return;
        yield* parseLines(t);
      }
      return;
    }

    if (!res.ok) await httpFail(res, provider, adapter);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    // idle 看门狗: 上游/代理 mid-stream 停滞不断连时, read() 会永远挂起 → 引擎假死且停止键无效。
    // 每收到一片数据重置计时; 超时 cancel 掉 reader 并如实报错(可重试), 不再无限等。
    const IDLE_MS = 90000;
    let idleTimer = null, idleHit = false;
    const armIdle = () => { clearTimeout(idleTimer); idleTimer = setTimeout(() => { idleHit = true; try { reader.cancel(); } catch (e) {} }, IDLE_MS); };
    try {
      armIdle();
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        armIdle();
        yield* parseLines(dec.decode(value, { stream: true }));
      }
      if (idleHit) throw new Error('流式响应停滞(' + (IDLE_MS / 1000) + 's 无数据), 已主动断开; 可直接重试');
    } finally {
      clearTimeout(idleTimer);
      try { reader.cancel(); } catch {}   // 取消传播终点: 消费者收摊(it.return 会走到这) → 断底层 HTTP 流, 不再计费
    }

  async function detectModels(providerId) {
    const provider = await getProvider(providerId);
    const adapter = resolveAdapter(provider);
    const { url, headers } = adapter.buildModelsRequest(provider);
    const res = await Net.fetch(url, { headers, proxy: provider.proxy, timeout: 30000 });
    if (!res.ok) await httpFail(res, provider, adapter);
    const models = adapter.parseModelsReply(await res.json());
    if (!models.length) throw new Error('未返回任何模型');
    return models;
  }

  // 轻量测试: 极短对话验通路(不限 max_tokens, 兼容"思考在 reasoning_content"的推理型模型)
  async function testConnection(providerId, model) {
    const reply = await chat({ providerId, model, messages: [{ role: 'user', content: 'hi' }], temperature: 0 });
    return { ok: true, sample: (reply.content || '').slice(0, 40) };
  }

  // 能力实测(UI 测试按钮与 agent 的 ai.test 同一套): 最小真实调用, 测通写 verified 台账, 不切活跃厂商
  const TEST_RUN = {
    'text.chat': async (id, m) => '回: ' + ((await testConnection(id, m)).sample || 'OK'),
    'audio.transcribe': async (id, m) => { const r = await transcribeAudio({ providerId: id, model: m, audio: { mimeType: 'audio/wav', data: SILENT_WAV } }); return '通路正常, 返: ' + JSON.stringify(r.text || '').slice(0, 40); },
    'audio.generate': async (id, m) => { const r = await generateAudio({ providerId: id, model: m, text: '语音链路测试。' }); if (!r.audioBase64 && !r.url) throw new Error('调用成功但无音频'); return '出声 ' + Math.round((r.audioBase64 || '').length * 3 / 4 / 1024) + 'KB'; },
    'image.generate': async (id, m) => { const r = await generateImage({ providerId: id, model: m, prompt: '一个简单的红色圆形' }); if (!r.image) throw new Error('调用成功但无图片'); return '出图'; },
    'video.generate': async (id, m) => { const r = await generateVideo({ providerId: id, model: m, prompt: '一只猫挥手，1秒' }); if (!r.video) throw new Error('调用成功但无视频'); return '出片'; },
    'music.generate': async (id, m) => { const r = await generateMusic({ providerId: id, model: m, prompt: '十秒轻快钢琴', lyrics: 'la la la' }); if (!r.audioBase64) throw new Error('调用成功但无音频'); return '出曲'; },
  };
  async function testCapability(providerId, cap, model) {
    cap = cap || 'text.chat';
    if (!TEST_RUN[cap]) throw new Error('未知能力: ' + cap + '; 可选 ' + Object.keys(TEST_RUN).join(' / '));
    const p = await getProvider(providerId);
    if (cap === 'text.chat' && !model && !p.model) throw new Error('厂商「' + p.name + '」未设主模型: 测试时传 model(可从已拉列表挑), 或先把 model 写进配置'); // 挡在发请求前, 不让厂商的 404 来猜病根
    const detail = await TEST_RUN[cap](providerId, model || undefined);
    const patch = { verified: { [cap]: { at: Date.now(), model: model || (CAP_TASK_MODEL[cap] !== undefined ? (p[CAP_TASK_MODEL[cap]] || '') : (p.model || '')) } } }; // 记录=实际请求的模型解析链; 媒体能力任务字段空就记空(空=适配器默认), 不再拿主模型冒充(曾把 step-3.7-flash 记成 STT 测通模型)
    if (model && CAP_TASK_MODEL[cap]) patch[CAP_TASK_MODEL[cap]] = model; // 测通即绑定任务模型(与设置页测试行为一致)
    if (model && cap === 'text.chat' && !p.model) patch.model = model;
    let r = { ok: true, capability: cap, detail };
    try { await Settings.updateProvider(providerId, patch); }
    catch (e) { r.note = '测通但未入台账(外部来源成员, 台账归其注册方)'; }
    return r;
  }

  return {
    init, chat, chatStream, generateImage, generateVideo, generateAudio, transcribeAudio, generateMusic,
    getCapabilities, detectModels, testConnection, testCapability, registerProvider, registerExternalSource, allProviders, protocolDefault, protocolList
  };
})();
/* ===========================================================================
 * @module      Agent.LLM.providers.openai-compatible
 * @summary     OpenAI 兼容协议 (DeepSeek/Kimi/智谱/Ollama/自定义)
 * =========================================================================== */
const OpenAICompatibleProvider = {
  protocol: 'openai-compatible',
  label: 'OpenAI 兼容 (DeepSeek/智谱/Kimi/Ollama 等)',
  order: 1,
  defaultEndpoint: 'https://api.openai.com/v1/chat/completions',
  capabilities: ['text.chat', 'image.input', 'image.generate', 'audio.generate', 'audio.transcribe'],

  // 常见 HTTP 错误 → 人话(402欠费/404未授权/400参数, 分得清; 适配器可覆盖补厂商私有码)
  explainError(status, text) {
    if (status === 401 || status === 403) return 'Key 无效或无权限, 检查 API Key';
    if (status === 402 || /quota|billing|insufficient/i.test(text)) return '账户配额/余额不足, 去厂商控制台充值或换 Key';
    if (status === 404 && /model/i.test(text)) return '模型不存在或当前套餐未授权, 重新拉取列表后从中选模型';
    if (status === 400 && /voice/i.test(text)) return '音色不被该厂商接受, 换该厂商自己的音色名';
    return '';
  },

  // 从 chat endpoint 派生其他端点(替换 /chat/completions 等结尾)
  _deriveEndpoint(provider, path) {
    return (provider.endpoint || '').replace(/\/(chat\/completions|completions|messages)(\?.*)?$/, path);
  },

  buildChatRequest(provider, { messages, model, tools, response_format, stream, temperature }) {
    // 多模态 content 数组 → OpenAI 格式(image_url with data URL); 纯文本/字符串原样
    const conv = messages.map(msg => {
      if (!Array.isArray(msg.content)) return msg;
      const content = msg.content.map(part => {
        const custom = this._mapPart && this._mapPart(part); // 子协议差异钩子(如 MiniMax: 音频当对话输入)
        if (custom) return custom;
        if (part.type === 'text') return { type: 'text', text: part.text || '' };
        if (part.type === 'image' && part.data) return { type: 'image_url', image_url: { url: `data:${part.mimeType || 'image/png'};base64,${part.data}` } };
        // OpenAI 兼容接口对 audio/video 输入支持各异, 降级为文本提示
        if (['audio', 'video'].includes(part.type)) return { type: 'text', text: `[${part.type} 附件]` };
        return { type: 'text', text: '' };
      });
      return { ...msg, content };
    });
    const body = {
      model: model || provider.model,
      messages: conv,
      ...(stream ? { stream: true } : {}),
      ...(tools ? { tools } : {}),
      ...(response_format ? { response_format } : {}),
      ...(temperature != null ? { temperature } : {}),
    };
    return {
      url: provider.endpoint,
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + provider.apiKey },
      body: JSON.stringify(body),
    };
  },

  parseChatReply(json) {
    const msg = json.choices?.[0]?.message || {};
    return { content: msg.content || '', tool_calls: msg.tool_calls, raw: json };
  },

  parseChatStreamChunk(chunk) {
    const c = chunk.choices?.[0];
    if (!c) return null;
    const d = c.delta || {};
    return { delta: d.content || '', reasoning: d.reasoning_content || '', tool_calls: d.tool_calls, finish_reason: c.finish_reason, raw: chunk };
  },

  buildModelsRequest(provider) {
    return { url: this._deriveEndpoint(provider, '/models'), headers: { 'Authorization': 'Bearer ' + provider.apiKey } };
  },

  // 兼容 OpenAI / Ollama / 各家变体
  parseModelsReply(json) {
    const list = json.data || json.models || [];
    return list.map(m => m.id || m.name || m).filter(Boolean).sort();
  },

  // 生图: 标准 OpenAI /images/generations (DALL-E 风格)
  buildImageRequest(provider, { prompt, model }) {
    const url = this._deriveEndpoint(provider, '/images/generations');
    const body = { model: model || provider.imageModel || provider.model || 'dall-e-3', prompt, n: 1, response_format: 'b64_json' };
    return { url, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + provider.apiKey }, body: JSON.stringify(body) };
  },
  parseImageReply(json) {
    const d = json.data?.[0] || {};
    const data = d.b64_json;
    const urlImg = d.url;
    if (!data && !urlImg) throw new Error('生图未返回数据');
    return { image: { type: 'image', mimeType: 'image/png', data, url: urlImg }, text: json.data?.[0]?.revised_prompt || '', raw: json };
  },

  // TTS: 标准 OpenAI /audio/speech (返回二进制音频, 不是 base64)
  buildTTSRequest(provider, { text, model, voice }) {
    const url = this._deriveEndpoint(provider, '/audio/speech');
    const body = { model: model || provider.ttsModel || 'tts-1', input: text, voice: pickVoice(voice, provider, 'alloy'), response_format: 'mp3' };
    return { url, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + provider.apiKey }, body: JSON.stringify(body), _binary: true };
  },
  // /audio/speech 返回的是二进制流, LLM 层会把它转 base64 后调这里
  parseTTSReply(arg) {
    // arg 可能是 {audioBase64} (LLM 层转好的) 或直接 json(错误)
    if (arg && arg.audioBase64) return { audio: { type: 'audio', mimeType: 'audio/mp3', data: arg.audioBase64 }, raw: {} };
    throw new Error('TTS 未返回音频数据');
  },

  // STT: 标准 OpenAI /audio/transcriptions (multipart); STT 模型必填(聊天模型不能转写)
  buildSTTRequest(provider, { audio, model, prompt }) {
    const m = model || provider.sttModel;
    if (!m) throw new Error('语音转写需要 STT 模型: 在「专用任务模型」里填 sttModel(如 whisper-1), 或调用时传 model');
    const mime = String(audio.mimeType || 'audio/webm').split(';')[0];
    const bin = atob(audio.data || ''); const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const fd = new FormData();
    fd.append('file', new Blob([u8], { type: mime }), 'audio.' + (mime.split('/')[1] || 'webm'));
    fd.append('model', m);
    if (prompt) fd.append('prompt', prompt); // whisper 系 prompt 提准
    return { url: this._deriveEndpoint(provider, '/audio/transcriptions'), headers: { 'Authorization': 'Bearer ' + provider.apiKey }, body: fd };
  },
  parseSTTReply(json) { return { text: String(json.text || '').trim(), raw: json }; },
};
/* ===========================================================================
 * @module      Agent.LLM.providers.local
 * @summary     本地模型(Ollama/LM Studio/vLLM 等): OpenAI 兼容形状, 传输走本机回环(插件在场自动中继)。
 *              基模无状态 — 与云厂商同款每次发全量 messages(自带记忆的本机 agent 端点是另一回事, 归桥管)。
 *              改端点 URL 里的端口号即适配其他本地服务: Ollama 11434 / LM Studio 1234 / vLLM 8000。
 * =========================================================================== */
const LocalProvider = {
  protocol: 'local',
  label: '本地模型 (Ollama/LM Studio 等, 免 Key)',
  order: 1.5, // 紧跟 OpenAI 兼容之后
  defaultEndpoint: 'http://127.0.0.1:11434/v1/chat/completions',
  capabilities: ['text.chat', 'image.input'], // 只诚实声明会的: 本地无 TTS/生图, 不假装
  explainError(status, text) {
    if (status === 403) return '本地服务拒绝跨域: 给 Ollama 设 OLLAMA_ORIGINS=* 或装 Colony Bridge 插件走中继';
    return OpenAICompatibleProvider.explainError(status, text);
  },
  _deriveEndpoint: OpenAICompatibleProvider._deriveEndpoint,
  buildChatRequest: OpenAICompatibleProvider.buildChatRequest, // Bearer local 占位头对本地服务无害
  parseChatReply: OpenAICompatibleProvider.parseChatReply,
  parseChatStreamChunk: OpenAICompatibleProvider.parseChatStreamChunk,
  buildModelsRequest: OpenAICompatibleProvider.buildModelsRequest,
  parseModelsReply: OpenAICompatibleProvider.parseModelsReply,
};
/* ===========================================================================
 * @module      Agent.LLM.providers.anthropic
 * @summary     Anthropic Messages API 适配器
 * =========================================================================== */
const AnthropicProvider = {
  protocol: 'anthropic',
  label: 'Anthropic Claude',
  order: 5,
  defaultEndpoint: 'https://api.anthropic.com/v1/messages',
  capabilities: ['text.chat', 'image.input'],

  buildChatRequest(provider, { messages, model, tools, stream, temperature, max_tokens = 8000 }) {
    if (tools) throw new Error('anthropic 适配器暂不支持 tools 工具调用(tool_use 结果解析未实现); 请换 openai-compatible 协议的 provider'); // 反馈诚实: 不静默丢弃

    for (const m of messages) {
      if (m.role === 'system') system += (system ? '\n' : '') + m.content;
      else msgs.push({ role: m.role, content: m.content });
    }
    const body = {
      model: model || provider.model,
      messages: msgs, max_tokens,
      ...(system ? { system } : {}),
      ...(stream ? { stream: true } : {}),
      ...(temperature != null ? { temperature } : {}),
    };
    return {
      url: provider.endpoint || 'https://api.anthropic.com/v1/messages',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': provider.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',

  parseChatStreamChunk(chunk) {

  buildModelsRequest(provider) {

/* ===========================================================================
 * @module      Agent.LLM.providers.gemini
 * @summary     Google Gemini 适配器 ({model}/{key} 占位符)
 *              关键: 流式必须加 alt=sse, 否则返回非 SSE 格式
 *              TTS 返回 PCM(L16,24kHz), 需加 WAV 头才能播放
 * =========================================================================== */
// 从 mimeType 解析采样率(如 audio/pcm;rate=24000), 默认 24000
function extractSampleRate(mimeType) {
  const m = String(mimeType || '').match(/rate=(\d+)/i);
  return m ? parseInt(m[1], 10) : 24000;
}
// PCM16 → WAV(base64): Gemini TTS 返回裸 PCM, 加 44 字节 WAV 头
function pcm16ToWavBase64(base64Pcm, sampleRate) {
  const bin = atob(base64Pcm);
  const len = bin.length;
  const pcm = new Uint8Array(len);
  for (let i = 0; i < len; i++) pcm[i] = bin.charCodeAt(i);
  const header = new ArrayBuffer(44);
  const view = new DataView(header);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); view.setUint32(4, 36 + len, true); ws(8, 'WAVE'); ws(12, 'fmt ');
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true); view.setUint16(34, 16, true); ws(36, 'data'); view.setUint32(40, len, true);
  // 拼 header + pcm, 转回 base64
  const out = new Uint8Array(44 + len);
  out.set(new Uint8Array(header), 0); out.set(pcm, 44);
  let s = '';
  for (let i = 0; i < out.length; i++) s += String.fromCharCode(out[i]);
  return btoa(s);
}

const GeminiProvider = {
  protocol: 'gemini',
  label: 'Google Gemini',
  order: 4,
  defaultEndpoint: 'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={key}',
  capabilities: ['text.chat', 'image.input', 'image.generate', 'video.generate', 'audio.input', 'video.input', 'audio.generate', 'audio.transcribe'],

  buildChatRequest(provider, { messages, model, tools, stream, temperature, generationConfig }) {
    if (tools) throw new Error('gemini 适配器暂不支持 tools 工具调用; 请换 openai-compatible 协议的 provider'); // 反馈诚实: 不静默丢弃
    const m = model || provider.model;
    let url = (provider.endpoint || 'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={key}')
      .replace('{model}', encodeURIComponent(m))
      .replace('{key}', encodeURIComponent(provider.apiKey));
    if (stream) {
      url = url.replace(':generateContent', ':streamGenerateContent');
      url += (url.includes('?') ? '&' : '?') + 'alt=sse';   // ← 关键: 没有这个流式解析不了
    }
    let systemInstr = '';
    const contents = [];
    // content 可为字符串(纯文本)或数组[{type:'text'|'image'|'audio'|'video', text/mimeType/data}]
    const toParts = (content) => {
      if (typeof content === 'string') return [{ text: content }];
      if (!Array.isArray(content)) return [{ text: String(content || '') }];
      return content.map(part => {
        if (part.type === 'text') return { text: part.text || '' };
        if (['image', 'audio', 'video'].includes(part.type) && part.data) return { inlineData: { mimeType: part.mimeType || `${part.type}/*`, data: part.data } };
        return { text: '' };
      });
    };
    for (const msg of messages) {
      if (msg.role === 'system') systemInstr += (systemInstr ? '\n' : '') + (typeof msg.content === 'string' ? msg.content : '');

    }

      contents,
      ...(systemInstr ? { systemInstruction: { parts: [{ text: systemInstr }] } } : {}),
      ...((temperature != null || generationConfig) ? { generationConfig: { ...(temperature != null ? { temperature } : {}), ...(generationConfig || {}) } } : {}),
    };

  },

  // 生图: 用 generateContent + responseModalities:["TEXT","IMAGE"]
  buildImageRequest(provider, { prompt, model, image, aspectRatio, generationConfig }) {
    const m = model || provider.imageModel || provider.model;
    const url = (provider.endpoint || 'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={key}')
      .replace('{model}', encodeURIComponent(m))
      .replace('{key}', encodeURIComponent(provider.apiKey));
    const parts = [{ text: prompt }];
    if (image) {  // 参考图(图生图): {mimeType, data(base64)}

    }
    const body = {
      contents: [{ role: 'user', parts }],

    };

  },
  // 标准化返回: 提取 inlineData 成 image 对象, agent/miniapp 不用自己递归找
  parseImageReply(json) {

  },

  // 视频生成(Veo, 异步 long-running): 发起请求, 返回 operation; LLM.generateVideo 负责轮询
  buildVideoRequest(provider, { prompt, model, image, aspectRatio }) {
    const m = model || provider.videoModel || provider.model || 'veo-3.1-fast-generate-preview';
    const base = 'https://generativelanguage.googleapis.com/v1beta/models/';

    const instances = [{ prompt }];

  },
  // 轮询 operation 状态的 URL
  buildVideoPollRequest(provider, operationName) {

  parseVideoOperation(json) {
    // 发起时返回 {name:'operations/xxx'}; 轮询完成时 done:true + response 含视频
    if (json.error) return { done: true, error: json.error.message || '视频生成出错', raw: json };
    if (json.name && !json.done) return { operationName: json.name, done: false };

      const resp = json.response || {};

      const samples = resp.generateVideoResponse?.generatedSamples || resp.generatedSamples || resp.generatedVideos || resp.videos || resp.predictions || [];
      const s = samples[0] || {};

      const data = v.bytesBase64Encoded || v.encodedVideo;

    }

  },

  parseChatReply(json) {
    const parts = json.candidates?.[0]?.content?.parts || [];

  },

  // TTS(文字→语音): Gemini 走 generateContent + responseModalities:["AUDIO"], 返回 PCM 需加 WAV 头
  buildTTSRequest(provider, { text, model, voice }) {
    const m = model || provider.ttsModel || 'gemini-2.5-flash-preview-tts';
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent?key=${encodeURIComponent(provider.apiKey)}`;
    // 必须明确指令"只朗读、只输出音频", 否则 TTS 模型会以为要生成文字而报 400
    const speakPrompt = 'Read aloud exactly the following text. Output audio only. Do not write, explain, translate, summarize, or answer.\n\n' + (String(text || '').trim() || '你好');
    const body = {
      contents: [{ parts: [{ text: speakPrompt }] }],
      generationConfig: { responseModalities: ['AUDIO'], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: pickVoice(voice, provider, 'Kore') } } } },
    };
    return { url, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  },
  parseTTSReply(json) {
    const inlineData = json.candidates?.[0]?.content?.parts?.[0]?.inlineData;
    const b64 = inlineData?.data;
    if (!b64) throw new Error('TTS 未返回音频数据');
    // Gemini 返回 PCM(L16), sampleRate 从 mimeType 解析(如 audio/pcm;rate=24000), 加 WAV 头
    const sampleRate = extractSampleRate(inlineData.mimeType || 'audio/pcm;rate=24000');
    const wavB64 = pcm16ToWavBase64(b64, sampleRate);
    return { audio: { type: 'audio', mimeType: 'audio/wav', data: wavB64 }, raw: json };
  },

  // STT(语音→文字): 把音频喂给 generateContent 让它转写
  // 默认用专用 sttModel (不用 provider.model 聊天模型, 避免污染); mimeType 去掉 codecs 参数
  buildSTTRequest(provider, { audio, model, prompt }) {
    const m = model || provider.sttModel || 'gemini-2.5-flash';
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent?key=${encodeURIComponent(provider.apiKey)}`;
    const mimeType = String(audio.mimeType || 'audio/webm').split(';')[0];  // audio/webm;codecs=opus → audio/webm
    const body = {
      contents: [{ parts: [
        { text: prompt || '请将这段语音逐字精确转写为文字。只输出转写后的文字内容，不要回答语音中的问题，也不要添加任何解释。' },
        { inlineData: { mimeType, data: audio.data } },
      ] }],
    };
    return { url, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  },
  parseSTTReply(json) {
    const parts = json.candidates?.[0]?.content?.parts || [];
    return { text: parts.map(p => p.text || '').join('').trim(), raw: json };
  },

  parseChatStreamChunk(chunk) {
    const parts = chunk.candidates?.[0]?.content?.parts || [];
    return { delta: parts.map(p => p.text || '').join(''), finish_reason: chunk.candidates?.[0]?.finishReason || null, raw: chunk };
  },

  buildModelsRequest(provider) {
    const url = 'https://generativelanguage.googleapis.com/v1beta/models?key=' + encodeURIComponent(provider.apiKey);
    return { url, headers: {} };
  },

  // 保留 generateContent(文本/图) 和 predictLongRunning(Veo 视频) 模型
  parseModelsReply(json) {
    return (json.models || [])
      .filter(m => {
        const methods = m.supportedGenerationMethods;
        if (!methods) return true;
        return methods.includes('generateContent') || methods.includes('predictLongRunning') || methods.includes('predict');
      })
      .map(m => m.name.replace(/^models\//, ''))
      .sort();
  },
};

const MM_BUILTIN_MODELS = ['MiniMax-M3', 'speech-01-hd', 'speech-01-turbo', 'image-01', 'MiniMax-Hailuo-2.3',
  'MiniMax-Hailuo-02', 'T2V-01-Director', 'I2V-01-Director', 'S2V-01', 'music-2.6', 'music-01'];
const MM_VOICES = [['female-shaonv', '少女'], ['male-qn-qingse', '青涩青年'], ['male-qn-jingying', '精英男'],
  ['female-yujie', '御姐'], ['male-qn-badao', '霸道男'], ['female-tianxin', '甜心妹'],
  ['presenter_male', '主持人男'], ['presenter_female', '主持人女'],
  ['audiobook_male_1', '有声书男'], ['audiobook_female_1', '有声书女']];
function mmHexToB64(hex) { const u = new Uint8Array(hex.length / 2); for (let i = 0; i < u.length; i++) u[i] = parseInt(hex.substr(i * 2, 2), 16); return Assets.bytesToB64(u); }

const MiniMaxProvider = {
  protocol: 'minimax',
  label: 'MiniMax (多模态: 对话/听觉/TTS/音乐)',
  order: 2,
  defaultEndpoint: 'https://api.minimaxi.com/v1/chat/completions',
  capabilities: ['text.chat', 'image.input', 'audio.input', 'audio.transcribe', 'audio.generate', 'image.generate', 'video.generate', 'music.generate'],
  _base(provider) { return (provider.endpoint || 'https://api.minimaxi.com/v1/chat/completions').replace(/\/(chat\/completions)(\?.*)?$/, ''); },
  explainError(status, text) { try { return MiniMaxProvider._explain(JSON.parse(text)).replace(/^ → /, ''); } catch (e) { return OpenAICompatibleProvider.explainError(status, text); } },

  /* ── 生图: POST /image_generation (image-01); 与 chat 完全不同的专用端点 ── */
  buildImageRequest(provider, { prompt, model, aspectRatio, generationConfig }) {

    if (json.task_id && !json.status) return { done: false, operationName: 'task:' + json.task_id, raw: json }; // 发起回执
    if (json.status === 'Fail' || json.status === 'Failed') return { done: true, error: json.error_message || ('任务失败 ' + JSON.stringify(json.base_resp || {})), raw: json };

      ? { model: model || 'music-01', prompt, lyrics: lyrics || 'la la la', audio_setting: { sample_rate: 44100, bitrate: 256000, format: 'mp3' } }

  },
  parseMusicReply(json) {
    if (json.base_resp && json.base_resp.status_code !== 0) throw new Error('MiniMax 音乐失败: ' + json.base_resp.status_msg);

  buildTTSRequest(provider, { text, model, voice }) {

        model: model || provider.ttsModel || 'speech-01-hd', // speech-02 是无效名(2013), 出厂默认用已验证模型
        text: String(text || '').slice(0, 2000),
        voice_setting: { voice_id: pickVoice(voice, provider, 'female-shaonv'), speed: (voice && voice.speed) || 1.0, vol: 1.0 },
        audio_setting: { sample_rate: 32000, bitrate: 128000, format: 'mp3' },

  },
  _explain(json) { // MiniMax 常见错误码翻译(给用户人话)
    const code = json && json.base_resp && json.base_resp.status_code;
    const M = {
      2056: '套餐用量已达上限, 等重置时间或升级套餐',
      1004: '鉴权失败, 检查 API Key',
      1008: '账户余额不足',

  parseTTSReply(json) {
    const hex = json.data && json.data.audio;

  },

  buildSTTRequest(provider, { audio, model, prompt }) {
    const fmt = String(audio.mimeType || 'audio/webm').split('/')[1].split(';')[0];
    const body = {
      model: model || provider.sttModel || 'MiniMax-M3',
      messages: [{ role: 'user', content: [
        { type: 'text', text: prompt || '请将这段语音逐字精确转写为文字。只输出转写后的文字内容，不要回答语音中的问题，也不要添加任何解释。' },
        /* 双格式投递: 不同网关对音频部件的 schema 不一(官方文档外无从校准), 两种都给, 命中即用, 另一种被容忍忽略 */
        { type: 'input_audio', input_audio: { data: audio.data, format: fmt } },
        { type: 'audio_url', audio_url: { url: 'data:' + (audio.mimeType || 'audio/wav') + ';base64,' + audio.data } },
      ] }],
    };
    return { url: provider.endpoint, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + provider.apiKey }, body: JSON.stringify(body) };
  },
  parseSTTReply(json) { const c = json.choices && json.choices[0]; return { text: ((c && c.message && c.message.content) || '').trim(), raw: json }; },
};
/* ===========================================================================
 * 阶跃 StepFun 适配器 — OpenAI 风格, 委托 openai-compatible 只写差异(委托式范式: 新厂商=包一层改端点)。
 * step_plan 计划与主计划是两套模型池/两套配额; TTS 必须中文音色名; ASR 走专用 SSE 端点(非 multipart)。
 * 模型列表拉到什么算什么, 不并内置清单(套餐只授权部分模型, 并入会造出必 404 的假选项)。
 * =========================================================================== */
const STEP_VOICES = [['cixingnansheng', '磁性男声'], ['wenrounvsheng', '温柔女声'], ['qinqienvsheng', '亲切女声'], ['tianmeinvsheng', '甜美女声'],
  ['jingdiannvsheng', '经典女声'], ['qingchunshaonv', '清纯少女'], ['yuanqishaonv', '元气少女'], ['jilingshaonv', '机灵少女'],
  ['ruanmengnvsheng', '软萌女声'], ['youyanvsheng', '优雅女声'], ['zhixingjiejie', '知性姐姐'], ['linjiajiejie', '邻家姐姐'],
  ['linjiameimei', '邻家妹妹'], ['shuangkuaijiejie', '爽快姐姐'], ['wenjingxuejie', '文静学姐'], ['lengyanyujie', '冷艳御姐'],
  ['wenroushunv', '温柔熟女'], ['wenrounansheng', '温柔男声'], ['wenrougongzi', '温柔公子'], ['yuanqinansheng', '元气男声'],
  ['zhengpaiqingnian', '正派青年'], ['qingniandaxuesheng', '青年大学生'], ['boyinnansheng', '播音男声'], ['ruyananshi', '儒雅男士'],
  ['shenchennanyin', '深沉男音']]; // 阶跃官方音色(静态: 无查询端点)
const StepFunProvider = {
  protocol: 'stepfun',
  label: '阶跃 StepFun (对话/TTS/ASR/生图)',
  order: 3,
  defaultEndpoint: 'https://api.stepfun.com/step_plan/v1/chat/completions',
  capabilities: ['text.chat', 'image.input', 'audio.transcribe', 'audio.generate', 'image.generate'],
  _base(provider) { return (provider.endpoint || this.defaultEndpoint).replace(/\/chat\/completions(\?.*)?$/, ''); },
  explainError: OpenAICompatibleProvider.explainError,
  buildChatRequest: OpenAICompatibleProvider.buildChatRequest,
  parseChatReply: OpenAICompatibleProvider.parseChatReply,
  parseChatStreamChunk: OpenAICompatibleProvider.parseChatStreamChunk,
  buildModelsRequest(provider) { return { url: this._base(provider) + '/models', headers: { 'Authorization': 'Bearer ' + provider.apiKey } }; },
  parseModelsReply: OpenAICompatibleProvider.parseModelsReply,
  // 生图/图编辑: /images/generations (step-image-edit-2), OpenAI 风格 + 阶跃专有参数
  buildImageRequest(provider, { prompt, model, generationConfig }) {
    const g = generationConfig || {};
    const body = { model: model || provider.imageModel || 'step-image-edit-2', prompt, response_format: 'b64_json', cfg_scale: g.cfg_scale == null ? 1.0 : g.cfg_scale, steps: g.steps || 8, text_mode: g.text_mode !== false };
    if (g.seed != null) body.seed = g.seed;
    return { url: this._base(provider) + '/images/generations', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + provider.apiKey }, body: JSON.stringify(body) };
  },
  parseImageReply(json) { return OpenAICompatibleProvider.parseImageReply(json); },
  // TTS: /audio/speech, 默认中文音色(OpenAI 的 alloy 会被拒 voice_id_invalid)
  buildTTSRequest(provider, { text, model, voice }) {
    const body = { model: model || provider.ttsModel || 'stepaudio-2.5-tts', input: String(text || '').slice(0, 2000), voice: pickVoice(voice, provider, 'cixingnansheng'), response_format: 'mp3' };
    return { url: this._base(provider) + '/audio/speech', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + provider.apiKey }, body: JSON.stringify(body), _binary: true };
  },
  parseTTSReply: OpenAICompatibleProvider.parseTTSReply,
  // ASR: 阶跃专用 SSE 端点(JSON 进、SSE 出), 与 multipart 转写不同形; _sse 让统一层按文本交回来解析
  buildSTTRequest(provider, { audio, model }) {
    const mime = String(audio.mimeType || 'audio/wav').toLowerCase();
    const isWav = /wav/.test(mime);
    if (!isWav && !/pcm/.test(mime)) throw new Error('阶跃 ASR 仅接受 wav 或 pcm_s16le(16kHz 单声道); 当前是 ' + mime + ', 请先转码(MediaRecorder 的 webm/opus 不能直接用)'); // 不静默硬塞成 pcm
    const body = { audio: { data: audio.data, input: { transcription: { model: model || provider.sttModel || 'stepaudio-2.5-asr', language: 'zh', enable_itn: true }, format: isWav ? { type: 'wav' } : { type: 'pcm', codec: 'pcm_s16le', rate: 16000, bits: 16, channel: 1 } } } };
    return { url: this._base(provider) + '/audio/asr/sse', headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream', 'Authorization': 'Bearer ' + provider.apiKey }, body: JSON.stringify(body), _sse: true };
  },
  parseSTTReply(text) {
    const finals = [], deltas = [];
    for (const j of splitSSE(text)) { if (/error/i.test(String(j.type || j.event || '')) || (j.code && j.message)) throw new Error('阶跃 ASR: ' + (j.message || j.code)); // 错误事件不吞: 静默空转写=假成功
      const t = j.text || j.result || j.transcript || (j.data && (j.data.text || j.data.result || j.data.transcript)) || ''; if (!t) continue; const tp = String(j.type || j.event || ''); if (/done|completed|final/i.test(tp) || j.is_final === true || j.final === true) finals.push(t); else deltas.push(t); }
    const finalText = finals.length ? finals[finals.length - 1] : '';
    return { text: (finalText || deltas.join('')).trim(), raw: text };
  },
};

/* ── 设置区: renderProviderChips / renderProviderDetail(协议下拉从适配器注册表生成; 样式统一在顶部组件库) ── */
const changed = () => ctx.emit('providers:changed');

async function renderProviderChips(secRoot) {
  const providers = await Settings.getProviders();
  const activeId = await Settings.getActiveProviderId();
  const chips = secRoot.querySelector('#provider-chips');
  chips.innerHTML = '';
  for (const p of providers) {
    const chip = document.createElement('button');
    chip.className = 'prov-chip' + (p.id === activeId ? ' active' : '') + (p.verified && p.verified['text.chat'] ? ' tested' : '');
    chip.dataset.pid = p.id;
    chip.innerHTML = '<span class="prov-dot"></span>' + esc(p.name || '(未命名)');
    chip.onclick = () => renderProviderDetail(secRoot, p.id);
    chips.appendChild(chip);
  }
  secRoot.querySelector('#prov-add-btn').onclick = async () => {
    const p = await Settings.addProvider({ name: '新厂商', protocol: 'openai-compatible', endpoint: 'https://api.openai.com/v1/chat/completions', apiKey: '', model: '' });
    changed();
    await renderProviderChips(secRoot);
    renderProviderDetail(secRoot, p.id);
  };
  if (providers.length) renderProviderDetail(secRoot, activeId || providers[0].id);
  else secRoot.querySelector('#provider-detail').innerHTML = '<p class="settings-hint" style="padding:16px 0">点 + 添加一个 AI 厂商 (DeepSeek/MiniMax/Gemini/Claude/Ollama…)</p>';
}

        <option value="image.generate">测试: 生图</option>

  const get = (s) => root.querySelector(s);

  root.querySelectorAll('.ai-cap-chip').forEach(el => el.ondblclick = async () => {
    if (!el.classList.contains('ok')) return;
    await persist({ verified: { [el.dataset.cap]: null } });

  get('#s-stt-model').onchange = (e) => persist({ sttModel: e.target.value.trim() });

  get('#s-fetch-models').onclick = async () => {
    showResult('⋯ 拉取中...', 'ok');
    try {
      const models = await LLM.detectModels(id);
      await persist({ models });
      renderProviderDetail(secRoot, id);   // 重新渲染 → 模型出现在下拉和各 datalist 里

/* ── 音色模板: 按协议分发(MiniMax 动态拉取+兜底, 其余静态官方表; 未知协议如实返回空) ── */
const OAI_VOICES = [['alloy', '中性'], ['nova', '明亮女声'], ['shimmer', '柔和女声'], ['coral', '活泼女声'], ['sage', '平和'],
  ['echo', '男声'], ['onyx', '低沉男声'], ['ash', '沉稳男声'], ['fable', '英式叙述'], ['verse', '抒情']];
const GEM_VOICES = [['Kore', '坚定女声'], ['Zephyr', '明亮女声'], ['Leda', '年轻女声'], ['Aoede', '轻快女声'],
  ['Puck', '活泼男声'], ['Charon', '低沉男声'], ['Fenrir', '有力男声'], ['Orus', '沉稳男声'],
  ['Callirrhoe', '柔和女声'], ['Autonoe', '明快女声'], ['Enceladus', '气声男声'], ['Iapetus', '清晰男声']];

async function listVoices(providerId) {
  const all = await Settings.getProviders();
  const p = providerId && all.find(x => x.id === providerId);
  if (!p) return []; // 未指定/找不到厂商 → 如实返回空(调用方降级手填), 不偏心任何协议
  if (p.protocol === 'minimax') {
    try {
      const res = await Net.fetch(MiniMaxProvider._base(p) + '/get_voice', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + p.apiKey },
        body: JSON.stringify({ voice_type: 'system' }), proxy: p.proxy, timeout: 15000, retries: 0,
      });

        const j = await res.json();
        const arr = j.system_voice || j.voices || [];
        if (arr.length) return arr.map(v => [v.voice_id || v.id, v.voice_name || v.name || v.voice_id]);

/* ── 配置种子: 保存→随块源码出走→导入方一次性播种(运输走现成的 saveBlock 覆盖层/wrapBlock 导出/adopt 检疫, 零新机制) ── */
const seedSig = o => { const s = JSON.stringify(o); let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h + ':' + s.length; };
async function applySeed() { // 同指纹只播一次(不碾用户后改); 重新导出的新种子指纹变→自动升级; 按厂商名合并, 不删接收方已有厂商
  if (!PROVIDER_SEED || !Array.isArray(PROVIDER_SEED.providers) || !PROVIDER_SEED.providers.length) return;
  const sig = seedSig(PROVIDER_SEED);
  if ((await Store.settings.get('ai.seedApplied', null)) === sig) return;
  for (const sp of PROVIDER_SEED.providers) {
    if (!sp.name) continue;
    const patch = { ...sp }; delete patch.id; // id 不随种子走: 同名合并/新名新增(判据与 ai.configure 一致), 防撞 id
    const old = (await Settings.getProviders()).find(x => x.name === sp.name);
    if (old) await Settings.updateProvider(old.id, patch); else await Settings.addProvider(patch);
  }
  if (PROVIDER_SEED.activeName) { const p = (await Settings.getProviders()).find(x => x.name === PROVIDER_SEED.activeName); if (p) await Settings.setActiveProvider(p.id); }
  await Store.settings.set('ai.seedApplied', sig);
  changed();
}
async function saveSeedToBlock() { // 「打包配置版」: 种子写进本块源码覆盖层(saveBlock 热替换自己) → wrapBlock 直接出带配置的独立 Petri
  const provs = await Settings.getProviders();
  if (!provs.length) return alert('还没有配置任何厂商');
  const activeId = await Settings.getActiveProviderId();
  const seed = { providers: provs.map(p => { const c = { ...p }; delete c.id; return c; }), activeName: (provs.find(p => p.id === activeId) || {}).name || null };
  if (!confirm('把 ' + provs.length + ' 个厂商的配置(含明文 API Key 与已测通台账)写进本块源码, 并导出自带配置的独立 Petri?\n\n对方导入并启用后拿来即用。\n⚠ 导出文件含明文 Key, 只给信任的人。')) return;
  const b = ctx.stem.getBlock(ctx.id);
  const json = JSON.stringify(seed).replace(/</g, '\\u003c'); // 转义 <: 块源码不得含字面闭合脚本标签(validateCode 拒)
  const nc = b.code.replace(/const PROVIDER_SEED = \/\*⚘SEED\*\/[\s\S]*?\/\*⚘SEED\*\//, () => 'const PROVIDER_SEED = /*⚘SEED*/' + json + '/*⚘SEED*/'); // 替换函数防 Key 里的 $ 被当替换模式
  if (nc === b.code) return alert('种子槽标记(⚘SEED)丢失, 无法写入 — 块源码被改动过?');
  await Store.settings.set('ai.seedApplied', seedSig(seed)); // 先记指纹: 本机热替换重启后不重播自己
  try { await ctx.stem.saveBlock(ctx.id, nc); } catch (e) { return alert('写入源码失败: ' + e.message); }
  try { ctx.stem.wrapBlock(ctx.id); } catch (e) { alert('配置已写入源码, 但自动导出失败(' + e.message + ') — 去 源码管理→导出本块 手动导出'); }

LLM.init();

const api = {
  chat: LLM.chat, chatStream: LLM.chatStream, generateMusic: LLM.generateMusic,
  generateImage: LLM.generateImage, generateVideo: LLM.generateVideo,
  generateAudio: LLM.generateAudio, transcribeAudio: LLM.transcribeAudio,
  getCapabilities: LLM.getCapabilities, detectModels: LLM.detectModels, testConnection: LLM.testConnection,
  listVoices,
  getProviders: LLM.allProviders, getActiveProviderId: Settings.getActiveProviderId, getActiveProvider: Settings.getActiveProvider, // getProviders=合并读(settings+外部来源); 设置 UI 编辑仍走 Settings 纯读
  registerExternalSource: LLM.registerExternalSource, registerProvider: LLM.registerProvider, // RB-7: 桥等块注册端点大脑(记录来源+协议适配器)
  updateProvider: async (id, patch) => { const r = await Settings.updateProvider(id, patch); changed(); return r; },
  setActiveProvider: async (id) => { await Settings.setActiveProvider(id); changed(); },
};
/* ── miniapp SDK 能力全套注册(谁提供能力谁注册; 全部过 allowMiniAppSDK 权限闸) ──
   provider 可传内部 id, 也可传名称或协议名(如 'minimax'), 这里统一解析。 */
async function _findProv(v) { // id/名称/协议名 → provider(协议名优先取配了 Key 的)
  const all = await LLM.allProviders();
  return all.find(x => x.id === v) || all.find(x => x.name === v) || all.find(x => x.protocol === v && x.apiKey) || all.find(x => x.protocol === v) || null;

async function _withProv(a) {

ctx.sdk.handle('ai.transcribe', async a => { // 入参宽容: {audio:{data,mimeType}} 或 {audioBase64,mimeType} → {text}

ctx.sdk.handle('ai.imagine', async a => LLM.generateImage(await _withProv(a)));
ctx.sdk.handle('ai.video', async a => LLM.generateVideo(await _withProv(a)));
ctx.sdk.handle('ai.music', async a => LLM.generateMusic(await _withProv(a))); // 与其余多模态同构: 统一层按能力分发+权限闸

  for await (const ch of LLM.chatStream(await _withProv(a))) yield { delta: (ch && ch.delta) || '', reasoning: (ch && ch.reasoning) || '' };

/* ai.models 三档: 不传参=现状形状(兼容存量); kind:'text'=测试通过的文本模型跨厂商聚合(与 AI 配置完全同步, 选择器现取现用);
   kind:'multimodal'=文本之外全量(图/视频/音乐/TTS/STT 及归属厂商, 带 verified 实测标)。 */
const NON_TEXT_RE = /(tts|speech|image|video|veo|imagen|embedding|music|hailuo|asr|audio|router)/i;
ctx.sdk.handle('ai.models', async (a) => {
  a = a || {};
  if (a.kind === 'text') {
    const settingsIds = new Set((await LLM.getCapabilities()).map(x => x.id));
    const activeId = await Settings.getActiveProviderId();
    const out = [];
    for (const p of (await LLM.allProviders()).filter(p => p.allowMiniAppSDK && p.apiKey)) {
      const isExternal = !settingsIds.has(p.id); // 桥端点成员: 活探在线即等效已验
      if (!isExternal && !(p.verified && p.verified['text.chat'])) continue; // 与 AI 配置同步: 只给测试通过的
      const ms = (p.models || []).filter(m => !NON_TEXT_RE.test(m));
      if (p.model && !ms.includes(p.model)) ms.unshift(p.model);
      // default 全局唯一 = 默认厂商的默认模型(应用下拉预选它)
      for (const m of ms) out.push({ model: m, providerId: p.id, provider: p.name, protocol: p.protocol, default: p.id === activeId && m === p.model, ...(p.notes && p.notes[m] ? { note: p.notes[m] } : {}) });

    for (const p of (await LLM.getCapabilities()).filter(p => p.allowMiniAppSDK && p.hasKey)) {
      for (const c of p.capabilities) {

        const tm = p[CAP_TASK_MODEL[c]] || '';
        const note = p.notes[tm] || p.notes[c] || '';
        out.push({ capability: c, providerId: p.id, provider: p.name, protocol: p.protocol, model: tm, verified: !!(p.verified && p.verified[c]), ...(note ? { note } : {}) });

    .filter(p => p.allowMiniAppSDK && p.apiKey)
    .map(p => ({ id: p.id, name: p.name, protocol: p.protocol, models: p.models || [], ttsModel: p.ttsModel || null, sttModel: p.sttModel || null }));
});
/* ── agent 自配置门面: 用户把 Key 交给 agent → agent 自己配厂商/测通路/记台账/标注模型问题。
