  "      miniappId: TARGET_ID,\n      miniappName: TARGET?.manifest?.name || TARGET_ID,\n" +
  "      segmentName: seg.name,\n      lineRange: [seg.startLine, seg.endLine],\n" +
  "      code: segCode\n    }).then(r=>{ if(r&&r.ok===false) hint(r.note||'agent 不在岗'); });\n  }catch(e){ alert('发送失败: '+e.message); }\n" +
  "}\n\n// ─── 架构全景(自写 SVG 思维导图, 不依赖外部库; 离线可用, agent 可改) ───\n" +
  "// ═══ 思维导图共享渲染核心(实时视图 + 导出网页 共用同一份, 不依赖全局状态)═══\n" +
  "// 所有差异(折叠集/点击回调/数据源)通过参数传入。导出时此对象会被 .toString() 打包进离线网页。\n" +
  "const MM = {\n  HGAP: 180, VGAP: 26,\n" +
  "  // 建树: 有 archTree 走层级递归(§4.2); 否则旧 fallback(segments+skeleton 的 category 分组, 旧数据不崩)\n" +
  "  buildTree(segments, skeleton, archTree){\n" +
  "    if(archTree && archTree.children){\n" +
  "      const byId = {}; (segments||[]).forEach(s=>{ byId[s.id]=s; });\n" +
  "      // 自包含递归(不依赖未注入的 MM 方法): category/chiefSeg/subSeg → 结构节点; leafSeg → 段节点(point 子)\n" +
  "      const conv = (node, path)=>{\n        const key = path;\n" +
  "        if(node.type==='leafSeg'){\n          const seg = byId[node.segmentId];\n" +
  "          const pts = (seg && seg.archFlowPoints) ? seg.archFlowPoints.map(p=>({ name:p.label, _point:p, _segId:node.segmentId })) : [];\n" +
  "          return { name:node.name, _seg:node.segmentId, _key:'seg:'+node.segmentId, children:pts };\n" +
  "        }\n        return { name:node.name, _cat:true, _struct:node.type, _key:key, children:(node.children||[]).map((c,i)=>" +
  "conv(c, key+'/'+i+':'+(c.name||''))) };\n" +
  "      };\n      const squash = nd => { while(nd.children && nd.children.length===1 && nd._seg==null && !nd._point){ const c=nd.children[0]; if(c._point) break; nd.name = (nd.name===c.name) ? nd.name : (nd.name+' › '+c.name); nd._seg=c._seg; nd._key=c._key||nd._key; nd._struct=c" +
  "._struct; nd.children=c.children; } (nd.children||[]).forEach(squash); return nd; };   // 单链压扁: 体现真实分叉结构\n" +
  "      return squash({ name: archTree.rootName||'项目', _root:true, children:(archTree.children||[]).map((c,i)=>conv(c, 'c'+i+':'+(c.name||''))) });\n" +
  "    }\n    const root = { name: (skeleton&&skeleton.rootName)||'项目', _root:true, children: [] };\n" +
  "    const cats = (skeleton&&skeleton.categories) || [];\n" +
  "    if(cats.length){\n      cats.forEach(cat=>{\n" +
  "        const catNode = { name: cat.name, _cat:true, children: [] };\n" +
  "        segments.filter(s=>s.category===cat.name).forEach(seg=>{\n" +
  "          const segNode = { name: seg.name, _seg:seg.id, children: [] };\n" +
  "          (seg.archFlowPoints||[]).forEach(p=>{ segNode.children.push({ name: p.label, _point:p, _segId:seg.id }); });\n" +
  "          catNode.children.push(segNode);\n" +
  "        });\n        if(catNode.children.length) root.children.push(catNode);\n" +
  "      });\n    } else {\n      segments.forEach(seg=>{ root.children.push({ name: seg.name, _seg:seg.id, children: (seg.archFlowPoints||[]).map(p=>" +
  "({name:p.label,_point:p,_segId:seg.id})) }); });\n" +
  "    }\n    return root;\n  },\n  nodeKey(n){ return n._key || (n._root?'root':n._cat?('cat:'+n.name):n._seg?('seg:'+n._seg):('pt:'+n._segId+':'+n.name)); },\n" +
  "  nodeWidth(n){ return Math.min(170, 24 + (n.name||'').length * (n._root?13:11.5)); },\n" +
  "  // 布局: 横向树。isCollapsed(node)→bool 决定是否展开子节点(导出恒 false)\n" +
  "  layout(node, depth, cursor, isCollapsed){\n" +
  "    node._depth = depth; node._x = depth * this.HGAP;\n" +
  "    const kids = isCollapsed(node) ? [] : (node.children||[]);\n" +
  "    if(!kids.length){ node._y = cursor.y; cursor.y += this.VGAP; return; }\n" +
  "    let first=null, last=null;\n    kids.forEach(k=>{ this.layout(k, depth+1, cursor, isCollapsed); if(first===null)first=k._y; last=k._y; });\n" +
  "    node._y = (first + last)/2;\n  },\n" +
  "  collect(node, arr, parent, isCollapsed){\n" +

    pg.innerHTML = '<div class="cr-topbar"><h2>🔬 代码解读</h2><span style="flex:1"></span><button class="cl-btn" id="pg-src">🧫 源码管理器</button><button class="cl-btn" id="pg-close">✕ 关闭</button></div><div style="flex:1;min-height:0" id="pg-host">' +
      '</div>';

  /* ════ 桥接处理器: 真身的 miniapp/agent 能力由本块代答 ════ */
  ctx.sdk.handle('code.getMiniapp', async ({ id }) => {
    if (id === 'stem') {

        id: 'stem', name: 'Stem', manifest: { name: 'Stem' },

        id, name: b.manifest.name || id, manifest: { name: b.manifest.name || id },

  ctx.sdk.handle('code.updateMiniapp', async ({ id, patch }) => {
    patch = patch || {};

      if (patch.code !== undefined) throw new Error('Stem 运行期只读(修改走提案+新生)');
      if (patch.analysis !== undefined) await ctx.kv.set('ana:stem', patch.analysis);
      return { ok: true };
    }
    if (String(id).startsWith('block:')) {
      const bid = id.slice(6);

        const b = ctx.stem.getBlock(bid); if (!b) throw new Error('无此块');
        const old = b.code;
        await ctx.stem.saveBlock(bid, patch.code);
        if (patch.analysis === undefined) { const ana = await ctx.kv.get('ana:' + id); if (ana) await ctx.kv.set('ana:' + id, alignAna(old, patch.code, ana)); }
        ctx.emit('blocks:changed');

      if (patch.analysis !== undefined) await ctx.kv.set('ana:' + id, patch.analysis);

    }
    const m = await ctx.kv.get('miniapp:' + id); if (!m) throw new Error('无此应用');
    if (patch.code !== undefined && patch.analysis === undefined && m.analysis) m.analysis = alignAna(m.code, patch.code, m.analysis);   // 带外改码: 对齐存量解析(解读页随后的 analysis patch 会覆盖, 顺序天然正确)
    Object.assign(m, patch, { updatedAt: Date.now() });
    await ctx.kv.set('miniapp:' + id, m); ctx.emit('apps:changed');
    return { ok: true };
  });
  ctx.sdk.handle('code.listTargets', async () => {   // 解读页顶栏切换器的数据源: Stem + 所有 Petri 块 + 全部应用(kind 分组)
    const out = [{ id: 'stem', name: '🧬 Stem(只读)', kind: 'stem', done: !!(await ctx.kv.get('ana:stem')) }];
    for (const b of ctx.stem.listBlocks()) out.push({ id: 'block:' + b.id, name: (b.name || b.id), kind: 'block', done: !!(await ctx.kv.get('ana:block:' + b.id)) });
    for (const e of (await ctx.kv.list('miniapp:') || [])) {
      const m = e.value; if (!m || m.deleted) continue;
      out.push({
        id: m.id || String(e.key).slice(8), name: (m.name || m.id), kind: 'app',
        done: !!(m.analysis && ((m.analysis.regions || []).length || (m.analysis.segments || []).length))
      });

  ctx.sdk.handle('code.ask', async p => {
    if (!ctx.service('agent')) return { ok: false, note: 'agent 不在岗 — 这段代码没人接' };   // 诚实回执: 不许无人接还回 ok
    const ref = ((p && p.miniappName) || '') + ((p && p.segmentName) ? ' · ' + p.segmentName : '') + ((p && p.lineRange) ? ' L' + p.lineRange[0] + '-' + p.lineRange[1] : '');

  /* ════ 卡片解读芯片: 数据=记录本体 analysis/analysisDraft, 随导出走 ════ */
  function chipState(m) {

  async function decorateCards() { // 芯片是本块的 DOM 装饰: 界面块只供 data-id 中性管道; 本块卸载芯片消失

      chip.onclick = e => { e.stopPropagation(); openAnalyzerPage('miniapp:' + id); };

  ctx.on('apps:changed', () => ctx.timer(decorateCards, 60));

  ctx.provide('code', { open: openSourceManager, openAnalyzer: openAnalyzerPage });

  /* 无壳兜底: 只读浏览 */
  function petriHeadless(ctxx, title, desc, render) {

  /* 独立(无stem runtime): 全屏挂解读真身 + 自架 colony 桥, 让离线文件也能配 AI 并真解析。
     去掉 petriHeadless 中转卡(截图那层重复的"代码解读"标题) —— 全屏盖住 masthead, 只剩真身一层。
     桥: colony.ai.chat→LLMLite / store→本地 localStorage / ai.models→Lite 伪 provider / code.*→本地降级。 */
  function mountAnalyzerSolo() {
    const page = document.createElement('div'); page.className = 'cr-page'; ctx.root.appendChild(page);
    page.innerHTML = '<div style="display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--border)"><span class="settings-hint" style="margin-right:auto">离线代码解读 · AI 经 LLMLite 兜底(填好配置即可解析)</span><button class="cl-btn" id="cr-solo-ai">🧠 AI 配置</button></div><div style="flex:1;min-height:0" id="cr-solo-host"></div>';
    page.querySelector('#cr-solo-ai').onclick = openLiteCfg;
    const host = page.querySelector('#cr-solo-host');

    fr.style.cssText = 'width:100%;height:100%;border:0'; fr.setAttribute('allow', 'clipboard-read; clipboard-write');
    const B = '<scr' + 'ipt>(function(){var seq=0,wait={};window.addEventListener("message",function(e){var d=e.data;if(d&&d.__crReply&&wait[d.id]){var w=wait[d.id];delete wait[d.id];d.ok?w.res(d.result):w.rej(new Error(d.error||"调用失败"));}});function call(n,a){return new Promise(function(res,rej){var id=++seq;wait[id]={res:res,rej:rej};parent.postMessage({__crCall:1,id:id,name:n,args:a||{}},"*");});}window.colony={call:call,callStream:function(){return Promise.reject(new Error("独立模式不支持流式"));},ai:{chat:function(a){return call("ai.chat",a);}},store:{get:function(a){return call("store.get",a);},set:function(a){return call("store.set",a);}}};})();</scr' + 'ipt>';
    fr.srcdoc = ANALYZER_HTML.replace('"__CRCTX__"', JSON.stringify({ targetMiniappId: null })).replace(/<head(\s[^>]*)?>/i, m => m + B);
    const soloAPI = {
      'ai.chat': a => Lite.chat(a),
      'store.get': async a => { const k = (a && a.key) || a; return ctx.store ? ctx.store.get(k) : undefined; },
      'store.set': async a => { if (ctx.store && a) await ctx.store.set(a.key, a.value); return { ok: true }; },
      'ai.models': async () => { const c = await Lite.cfg(); return (c.endpoint && c.key) ? [{ id: 'llmlite', name: 'LLMLite', models: c.model ? [c.model] : [] }] : []; },
      'code.getMiniapp': async () => { throw new Error('独立模式无 miniapp 库 — 直接粘贴代码解析即可'); },
      'code.updateMiniapp': async a => { if (a && a.patch && a.patch.analysis && ctx.kv) await ctx.kv.set('ana:solo', a.patch.analysis); return { ok: true }; },
      'code.ask': async () => ({ ok: false, note: '独立模式无 agent 在岗' }),
    };
    const onMsg = e => {
      const d = e.data; if (!(d && d.__crCall && e.source === fr.contentWindow)) return;
      const fn = soloAPI[d.name];
      Promise.resolve(fn ? fn(d.args) : Promise.reject(new Error('未知调用 ' + d.name)))
        .then(r => { try { fr.contentWindow.postMessage({ __crReply: 1, id: d.id, ok: true, result: r == null ? null : r }, '*'); } catch (x) { } })
        .catch(err => { try { fr.contentWindow.postMessage({ __crReply: 1, id: d.id, ok: false, error: (err && err.message) || String(err) }, '*'); } catch (x) { } });
    };

  ctx.timer(() => {
    const u = ctx.service('ui');

      u.registerSettingsSection({
        id: 'code', blockId: ctx.id, label: '代码解读', title: '🔬 代码解读', order: 6,
        render(el) {
          el.innerHTML = '<p class="settings-hint">解读任意代码的结构与逻辑(粘贴/上传/应用卡片左下角芯片直达), 架构全景 + 逐行解读, 解析结果随应用导出; 另含整机源码管理。</p><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="cl-btn-primary" id="cr-open">打开代码解读</button>' +
            '<button class="cl-btn" id="cr-src">源码管理器</button><button class="cl-btn" id="cr-ai" title="模型配置(LLMLite 兜底; AI 配置块在岗时自动让位)">🧠 AI 配置</button><span class="settings-hint" style="margin:0 0 0 8px">逐行急切阈值(KB)</span><input id="cr-eager" class="cl-input" type="number" min="4" step="4" style="width:72px" title="源码 ≤ 此体积: 逐行急切全量生成;' +
            ' 超出: 按模块分页, 翻到才生成"></div>';
          el.querySelector('#cr-open').onclick = () => openAnalyzerPage();

          el.querySelector('#cr-ai').onclick = openLiteCfg;
          const ip = el.querySelector('#cr-eager');
          ctx.kv.get('settings:code.eagerL3').then(v => { ip.value = Math.round((parseInt(v) || 40960) / 1024); });
          ip.onchange = () => {
            const kb = Math.max(4, parseInt(ip.value) || 40);
            ip.value = kb;
            ctx.kv.set('settings:code.eagerL3', kb * 1024);
            toast('逐行急切阈值: ' + kb + 'KB(下次打开解读页生效)');
          };
        }
      });
      if (u.registerBlockPage) u.registerBlockPage(ctx.id, () => openAnalyzerPage()); // 顶栏亮框点击直达解读页
    }
    else if (ctx.runtime && ctx.runtime.mount) petriHeadless(ctx, '🔬 代码解读',
      '无壳模式·全功能: 只要 AI 块在岗, 解析/导出/解读报告全部可用(SDK 经stem直通, 与界面无关)。', el => {
      const btn = document.createElement('button'); btn.className = 'cl-btn-primary'; btn.textContent = '打开代码解读';
      btn.onclick = () => openAnalyzerPage(); el.appendChild(btn);
      const sm = document.createElement('button'); sm.className = 'cl-btn'; sm.style.marginLeft = '8px'; sm.textContent = '源码管理器';
      sm.onclick = () => openSourceManager(); el.appendChild(sm);
      const ai = document.createElement('button'); ai.className = 'cl-btn'; ai.style.marginLeft = '8px'; ai.textContent = '🧠 AI 配置';
      ai.onclick = openLiteCfg; el.appendChild(ai);
    });
    else mountAnalyzerSolo();   // 独立(无stem runtime): 全屏真身 + 自架 colony 桥, 去 petriHeadless 中转卡(少一层套娃), 离线也能配 AI 真解析
  }, 70);

  return { api: {}, dispose() { if (smEl) { smEl.remove(); smEl = null; } if (pgEl) { pgEl.remove(); pgEl = null; } document.querySelectorAll('.analyze-chip').forEach(x => x.remove()); } };
})

<script type="colony/petri" data-id="petri:plugin-manager">
/*BLOCK*/{"id":"petri:plugin-manager","name":"插件管理","version":1,"after":[],"requires":[],"provides":["pluginmgr"],"category":"feature","degrade":"缺席时插件本体与中继不受影响; 无 porter 时读写面如实报缺","sdk":["plugin.status","plugin.write","plugin.edit","plugin.backup","plugin.revert","plugin.reload","plugin.ping"]}/*CODE*/
(function (ctx) {
  /* 数据自报: 快照与状态 → 次元口袋按归属聚合 */
  if (ctx.kv) ctx.kv.set('datamap:petri:plugin-manager', {
    owner: 'petri:plugin-manager',
    label: '插件管理',
    icon: '🔌',
    ns: [
      { prefix: 'pluginfs:', label: '插件源码快照', kind: 'backup' },
      { prefix: 'skill:petri:plugin-manager:', label: '最佳实践技能', kind: 'seed' }
    ]
  }).catch(() => { });
  /* petri:plugin-manager v1 — 让全能 agent 能改浏览器插件(Colony Bridge)源码并自动重载: "读→改→重载→验活→回滚"闭环。
     地基复用不重造: 磁盘读写走 porter 的 fs.*(File System Access 工作区, 用户在 ⚙设置→次元口袋 连接文件夹); 重载/验活走插件
     bg.js 原生自带的 __colonyRelay reload/ping 口。本块只补真缺口: ① plugin.write = 写前自动快照的 fs.write(每文件环形 5 版,
     kv pluginfs:backup:*; manifest.json 默认拒写 — 改坏它扩展加载失败, 自动重载都救不了, 唯一死穴, force 才放行);
     ② plugin.backup/revert 机械快照与回滚; ③ plugin.reload/ping 插件桥; ④ skill 播种闭环用法。
     跨块契约(软): 经 ctx.sdk.handlers 直调 porter 的 fs.read/write — porter 缺席时如实报缺, 不装哑巴。
     注意: 插件 reload 后本页 content script 即失效(浏览器行为), 桥接要刷新页面才恢复 — skill 已教 agent。 */
  ctx.css('.pm-wrap{max-width:560px;font-size:13px;line-height:1.7}\n' +
    '.pm-row{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}\n' +
    '.pm-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--text-dim)}\n' +
    '.pm-dot.ok{background:var(--accent)}.pm-dot.warn{background:var(--warn)}\n' +
    '.pm-stat{color:var(--text-muted);font-size:12px}\n' +
    '.pm-out{font-family:var(--mono);font-size:11.5px;color:var(--text-muted);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;max-height:180px;overflow:auto;white-space:pre-wrap}\n' +
    '.pm-hint{font-size:11px;color:var(--text-muted);line-height:1.6;margin-top:8px}');

  const KEEP = 5, BK = 'pluginfs:backup:';
  /* ── 复用 porter 的 fs 能力面(直调已注册 handler; 缺席如实报) ── */
  function capCall(ns, args) {
    const h = ctx.sdk && ctx.sdk.handlers && ctx.sdk.handlers[ns];
    if (!h) throw new Error('能力 ' + ns + ' 不在岗 — 磁盘读写由「次元口袋」提供, 请确认 porter 块在岗');
    return (typeof h === 'function' ? h : h.fn)(args || {}, { context: {} });
  }
  const normPath = p => { const s = String(p || '').replace(/\\/g, '/').replace(/^\/+/, ''); if (!s) throw new Error('需要 {path}'); return s; };
  const isManifest = p => /(^|\/)manifest\.json$/i.test(p);

  async function backup(path) {
    path = normPath(path);
    let cur = null;
    try { cur = await capCall('fs.read', { path }); } catch (e) { throw new Error('备份失败(读不到 ' + path + '): ' + e.message); }
    const ts = Date.now();
    await ctx.kv.set(BK + path + ':' + ts, { file: path, ts, content: (cur && (cur.text != null ? cur.text : cur.content)) || '' });
    const all = (await ctx.kv.list(BK + path + ':')).sort((a, b) => (a.value.ts || 0) - (b.value.ts || 0));
    while (all.length > KEEP) { const e = all.shift(); await ctx.kv.del(BK + e.value.file + ':' + e.value.ts).catch(() => { }); }
    return { ok: true, file: path, ts, versions: Math.min(all.length, KEEP) };
  }
  async function guardedWrite(path, text, force) {
    path = normPath(path);
    if (typeof text !== 'string') throw new Error('plugin.write 需要 {path, text}(纯文本源码; 二进制请直接用 fs.write dataUrl)');
    if (isManifest(path) && !force) throw new Error('manifest.json 默认拒写 — 改坏它扩展加载失败, 连自动重载都救不了(唯一死穴)。确认无误再带 {force:true}, 且写前先 plugin.backup');
    let backedUp = false;
    try { await backup(path); backedUp = true; } catch (e) { } // 新文件无旧版, 跳过快照不阻断
    const r = await capCall('fs.write', { path, text });
    return Object.assign({ backedUp }, r && typeof r === 'object' ? r : { ok: true, path });
  }
  async function revert(path, ts) {
    path = normPath(path);
    const all = (await ctx.kv.list(BK + path + ':')).sort((a, b) => (b.value.ts || 0) - (a.value.ts || 0));
    if (!all.length) throw new Error('没有 ' + path + ' 的快照可回滚(plugin.write/backup 才会留快照)');
    const pick = ts ? all.find(e => e.value.ts === ts) : all[0];
    if (!pick) throw new Error('无 ts=' + ts + ' 的快照; 现有: ' + all.map(e => e.value.ts).join(','));
    await capCall('fs.write', { path, text: pick.value.content });

    const o = ui().modal('<h2>导入应用到桌面</h2><p class="ad-modal-sub">从短码/链接载入、粘贴 HTML、上传或拖入文件均可。带凭证的独立系统块会自动识别并走检疫融入。</p>'
      + '<label>从短码 / 分享链接 / 网页 URL 载入 <span style="color:var(--text-muted);font-weight:400;font-size:11px">— 默认源 htmlcode.fun, 可在设置改</span></label>'
      + '<div class="ad-load-row"><input id="x-url" placeholder="my-app 或 https://www.htmlcode.fun/s/my-app 或任意网页 URL"><button class="ad-btn-ghost" id="x-fetch">载入</button></div>'
      + '<label>名称<input id="x-name" placeholder="例: 我的工具"></label><label>说明<input id="x-desc" placeholder="一句话说明"></label>'
      + '<label>HTML 代码<textarea id="x-code" class="paste-area" placeholder="<!DOCTYPE html>..."></textarea></label>'
      + '<div class="ad-modal-actions"><button class="ad-btn-ghost" id="x-upload">上传文件</button><input type="file" id="x-file" accept=".html,.htm" style="display:none"><span style="flex:1"></span><button class="ad-btn-ghost" id="x-cancel">取消</button>' +
        '<button class="ad-btn-primary" id="x-save">添加</button></div>', true);
    function handleFile(f) {
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        const html = String(r.result);
        const found = ctx.stem.unwrap(html); // 带凭证 → 自动剥衣走系统块检疫; 无凭证 → 普通应用(不猜剥)
        if (found.length) { o.remove(); importBlocks(found, html); return; }
        o.querySelector('#x-code').value = html;
        if (!o.querySelector('#x-name').value) o.querySelector('#x-name').value = f.name.replace(/\.html?$/i, '');
      };
      r.readAsText(f);
    }
    o.querySelector('#x-upload').onclick = () => o.querySelector('#x-file').click();
    o.querySelector('#x-file').onchange = e => { handleFile(e.target.files[0]); e.target.value = ''; };
    /* 短码/链接载入(htmlcode.fun, 可扩展): 拉到 HTML 后填进表单, 走同一个「添加」路径(含凭证检查) */
    o.querySelector('#x-fetch').onclick = async () => {
      const inp = o.querySelector('#x-url').value.trim(); if (!inp) { ui().toast('先填短码或链接'); return; }
      const btn = o.querySelector('#x-fetch'), orig = btn.textContent; btn.textContent = '载入中…'; btn.disabled = true;
      try {
        const res = await loadRemote(inp);
        o.querySelector('#x-code').value = res.code;
        if (!o.querySelector('#x-name').value) o.querySelector('#x-name').value = res.name || '';
        if (!o.querySelector('#x-desc').value && res.desc) o.querySelector('#x-desc').value = res.desc;
        ui().toast('已载入「' + (res.name || inp) + '」, 检查后点添加');
      } catch (e) { ui().toast('载入失败: ' + (e && e.message || e)); }
      finally { btn.textContent = orig; btn.disabled = false; }
    };
    o.querySelector('#x-url').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); o.querySelector('#x-fetch').click(); } };
    /* 拖拽进窗口 = 上传 */
    o.addEventListener('dragover', e => { e.preventDefault(); o.firstChild.style.outline = '2px dashed var(--accent)'; });
    o.addEventListener('dragleave', () => { o.firstChild.style.outline = ''; });
    o.addEventListener('drop', e => { e.preventDefault(); o.firstChild.style.outline = ''; if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
    /* 粘贴文件(剪贴板里的 .html) */
    o.addEventListener('paste', e => { for (const it of ((e.clipboardData || {}).items || [])) if (it.kind === 'file') { handleFile(it.getAsFile()); e.preventDefault(); return; } });
    o.querySelector('#x-cancel').onclick = () => o.remove();
    o.querySelector('#x-save').onclick = async () => {
      let name = o.querySelector('#x-name').value.trim();
      const code = o.querySelector('#x-code').value.trim();
      if (!code) { ui().toast('先粘贴 HTML 代码'); return; }
      const found = ctx.stem.unwrap(code); // 粘贴文本同样验凭证(与上传/拖拽一致)
      if (found.length) { o.remove(); importBlocks(found, code); return; }
      if (!name) name = (((code.match(/<title[^>]*>([^<]*)/i) || [])[1]) || '').trim() || '未命名应用';
      await apps().create({ name, desc: o.querySelector('#x-desc').value.trim(), code, origin: 'user' });
      ctx.emit('apps:changed');   // 确保桌面应用栅格刷新(导入后立即出现)
      o.remove(); ui().toast(/<head[\s>]/i.test(code) ? '已添加' : '已添加 · ⚠ 未检测到 <head>: SDK 无法注入, 应用内用不了 colony 能力(块规范 v1.5)');
    };
  }

  /* ── 系统块导入: 检疫(禁用待激活) / 待孵化 ── */
  async function importBlocks(found, html) {
    const lines = [];
    for (const b of found) {
      const exist = ctx.stem.getBlock(b.manifest.id);
      lines.push('<div class="k-block"><span class="nm">' + esc(b.manifest.name || b.manifest.id) + '</span><span class="meta">' + esc(b.manifest.id) + ' · v' + b.manifest.version + '</span>'
        + (exist ? '<span class="k-tag warn">回流: 写覆盖层并禁用, 体检后手动激活</span>' : '<span class="k-tag">陌生块: 存为待孵化, 下次新生并入</span>') + '</div>');
    }
    const o = ui().modal('<h2>导入 Petri(检疫)</h2><p class="ad-modal-sub">导入的块默认不运行。回流块写入覆盖层后保持禁用, 请先在系统块详情里查看源码确认, 再手动启用。</p>' + lines.join('')
      + '<div class="ad-modal-actions"><button class="ad-btn-ghost" id="ib-cancel">取消</button><button class="ad-btn-primary" id="ib-ok">确认导入</button></div>', true);
    o.querySelector('#ib-cancel').onclick = () => o.remove();
    o.querySelector('#ib-ok').onclick = async () => {
      await ctx.stem.adopt(found); // 已知 id → 检疫覆盖; 新 id → 收养。都零执行、禁用态(启用是用户的手动决定)
      ctx.emit('blocks:changed'); o.remove(); ui().toast('已导入(禁用态, 启用后上岗)');
    };
  }

  /* ── 设置区: 仅导入/导出。新生与系统块管理统一在界面的源码管理入口, 不在此重复 ── */
  function petriHeadless(ctx, title, desc, render) { // 无壳兜底: Petri 离开任何界面也有自己的脸
    const card = document.createElement('div');
    card.className = 'cl-card';
    card.style.cssText = 'max-width:760px;margin:18px auto;';
    const head = document.createElement('div');
    head.innerHTML = '<h3 style="margin:0 0 4px;font-size:15px">' + title + '</h3>' + (desc ? '<p class="settings-hint" style="margin:0 0 12px">' + desc + '</p>' : '');
    card.appendChild(head);
    const host = document.createElement('div');
    card.appendChild(host);
    ctx.root.appendChild(card);
    const toast = t => {
      const d = document.createElement('div');
      d.textContent = t;
      d.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg-2);border:1px solid var(--accent);color:var(--text);padding:8px 16px;border-radius:8px;z-index:200;font-size:12px';
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 2200);
    };
    try { render(host, { toast, modal: () => null }); } catch (e) { host.textContent = '渲染失败: ' + e.message; }
  }

          r.onload = () => go(String(r.result));
          r.readAsText(f);
        });
      });
      return;
    }
    u.registerSettingsSection({
      id: 'porter', blockId: ctx.id, label: '次元口袋', title: '📦 次元口袋', order: 9,
      async render(el, h) {

          el.querySelector('#pt-proxy-save').onclick = async () => {

  // 次元口袋数据浏览器 App = 构建期注入的真身(blocks/parts/pocket_app.html), 经 openPocketApp 全屏挂载(与 code 解读页同构)。
  // data.* 全局数据通道 — 次元口袋的「内部数据」半边: 把 Colony 全局库(skill/task/settings/应用/缓存/会话/残留)暴露给沙箱 miniapp 读写。纯 porter 自包含, over 全局 ctx.kv, 零 bridge、零 Stem。缺位才注册(幂等)。
  /* 数据自报: 每个 Petri 声明自己的 kv 归属 datamap:<owner> = {owner,label,icon,ns:[{prefix,label,media?}]};
     porter 只聚合上报的, 新块一来自报一句即自动映射进次元口袋, porter 无需改。未上报的前缀落「未分类/残留」(可见不崩)。
     媒体(图/音/视/文本)按内容探测、跨块横切成独立桶, 每条同时带 origin 归属——同一张图既在归属(如工作流)又在图片桶。本块先自报自己。 */
  function seedFactory() {   // init 调一次; 恢复出厂走 porter.reload → K.reboot 全家重装, 本函数随 init 自然重播

        { prefix: 'backup:', label: '备份', kind: 'state' },
        { prefix: 'porter.', label: '次元口袋状态', kind: 'state' },

        { prefix: 'appstore:', label: '应用数据', kind: 'user' }]
    }).catch(() => { });
    // 文件储存箱(临时件)最终融入次元口袋, 故由本块托管声明
    ctx.kv.set('datamap:files', {
      owner: 'files', label: '上传文件', icon: '🗂️', ns: [{ prefix: 'filevault:', label: '文件', media: true, kind: 'user' }]
    }).catch(() => { });
    // 透明: datamap 元数据本身也可见可审计(归「系统数据地图」)
    ctx.kv.set('datamap:_sys', {
      owner: 'sys', label: '系统数据地图', icon: '🗺️', ns: [{ prefix: 'datamap:', label: '块自报声明', kind: 'seed' }]
    }).catch(() => { });
    // stem持久前缀(stem.* 代际打点/崩溃计数、block:* 覆盖层/版本/禁用、runtimeshot:* 运行截图缓存)
    ctx.kv.set('datamap:_stem', {
      owner: 'stem', label: 'stem/系统状态', icon: '⚙️', ns: [{ prefix: 'stem.', label: 'stem 运行状态(代际继承打点/崩溃计数)', kind: 'state' }, // A-1: 声明 stem. 为 state → cleanupPlan cache 档不再误删 stem.lastBoot(代际继承选库靠它)
        { prefix: 'block:', label: '块覆盖层/版本/禁用', kind: 'state' }]   // runtimeshot: 归属挪回写者 agent(刀30 写者认领惯例)
    }).catch(() => { });
    /* 次元口袋使用技能(seed-once, 用户可删改): 教全能 agent 高效挖掘 porter 全部潜能。挂 skill:petri:porter:* 是因为这些能力都由 porter 提供。 */
    const PORTER_SKILLS = {
      'skill:petri:porter:机制-net.fetch外部API': { desc: '访问外部API/发布/导入外链时读', guide: 'porter 提供 net.fetch = 通用外部连接底座(任何开放 CORS 的 API 都能用, 不止 htmlcode.fun)。run call:net.fetch {url, method, headers, body, responseType?, timeout?, credentials?}: body ' +
        '是对象会自动 JSON.stringify + 补 content-type; 返回完整 {ok,status,headers,contentType,text,json}; responseType:"dataUrl" 则抓二进制(图/音/视频/任意文件)回 {dataUrl,mimeType} —— 配了免 CORS 代理即可绕墙把任意站的媒体抓回来存/用。text 不截断、HTTP 4xx/5xx 不抛错原样返回(自己看 ok/status/json/text 判断), CORS/网络错返回 status:0 + error。别再写临时 iframe 探针, 别把单站逻辑写死。发布应用 = read miniapp:<id> 拿 code ' +
        '→ net.fetch POST 发布端点(responseType:json)→ 读 json.url/code/detailUrl 回用户; 导入外链 = net.fetch GET 拿 HTML。依赖 window.colony/colony.call 的应用发到外部只能离线展示, 要提醒用户。' },
      'skill:petri:porter:机制-data全局库': { v: 2, desc: '浏览/搜索/读写/诊断全局数据时读', guide: 'porter 把 Colony 全局 KV 暴露为 data.*(活体真实库, 非只读)。浏览一个动词管全部: data.list {prefix|owner|kind|media|residual|q} 列条目(q 全文搜索); data.list {group:1} 出数据地图(namespaces 归属聚合+kinds 性质+buckets 用户语言四桶+totalBytes, {includeEmptyOwners:1} 含空主); data.list {stat:1} 看总量+最大 12 条。' +
        ' data.get/set/del 单 key 读写删 —— get 返回 {key,value,exists} 信封, 真值在 value 字段(miniapp 里 colony.data.get 同样); set 的 value:null 是写入 null 值, 删键用 data.del(注意: agent 的 write kv value:null 才是删, 两边语义不同)。data.copy {from,to,patch?} 库内直传零抄写。诊断膨胀/残留 = {group:1}+{stat:1} 看谁大、{residual:true} 找未归属; 分清 seed/config/user/cache/residual, 别一概当垃圾删。' },

        ' 预演再真删 —— tier=cache(缓存+残留, 可再生不丢内容)/ user(用户数据: 会话/台账/文件/应用/工作流, 留配置与能力)/ factory(全清, 各块下次启动重播出厂, 按返回 reload 提示刷新); 真删可带 keys:[] 只清勾选。执行前把 count/bytes 与关键 items 报给用户; residual 别默认当垃圾, 先看归属。' },
      'skill:petri:porter:机制-开发与导入新Petri': { desc: '从零开发或导入一个新系统块时读', guide: 'Petri ≠ miniapp: miniapp 是完整 HTML 用户应用(write miniapp); Petri 是带 manifest 的系统块, 代码形态是 (function(ctx){...})。① 块文本格式 = /*BLOCK*/{manifest}/*CODE*/ 换行 (function(ctx){...}' +
        '); manifest 必须有 id, 常带 name/version/category/after/requires/provides/degrade。② 代码里不能出现字面闭合脚本标签(core.validateCode 会拒), 含 HTML 串时拆写成 \'<\' + \'/scr\' + \'ipt>\' 之类。③ ctx 面: ctx.css(注样式) / ctx.root(挂 UI) / ctx.kv(读写库) / ctx.service(name)' +
        '(取别的块服务) / ctx.provide(name, api)(对外提供服务) / ctx.sdk.handle(\'ns.method\', fn)(注册 miniapp/agent 可 run call 的能力) / ctx.stem(四原语底座) / return {api, dispose()}。④ 最小可跑模板: (function(ctx){ ctx.css(\'.x{padding:12px}\'); if(ctx.root) ctx.root.innerHTML=\'<div ' +
        'class=x>新块已启动</div>\'; const api={ ping(){return {ok:true, id:ctx.id};} }; ctx.provide(\'x\', api); if(ctx.sdk&&ctx.sdk.handle) ctx.sdk.handle(\'x.ping\', async()=>api.ping()); return {api, dispose(){}}; }) —— 先跑通再加能力。⑤ 改已有块: write ' +
        '{block:<id>, code} 热替换(失败自动回滚, 改前可 read 存 kv:backup:)。⑥ 全新 id 导入: 把块文本包进 colony/petri 凭证壳(<script type="colony/petri" data-id="petri:xxx">块文本<\/script>), 经次元口袋"导入应用到桌面"或 run call 走 ctx.stem.adopt → 检疫: 已知 id=写覆盖层+禁用, 新 id=存 adopted:<id>' +
        '+禁用, 两者零执行、默认不运行, 用户看过源码手动启用(裸 Stem 页或界面块管理处); 恢复出厂=删 adopted 收养即移除。坑: 别用 write miniapp 冒充新 Petri(那只进用户应用不进系统块); 别绕检疫直接跑陌生块; 别漏 manifest.id; 别在代码字符串里写字面闭合脚本标签; 别假设新块自动运行; 别改 Stem 去实现业务——功能一律做成 Petri。' },
      'skill:petri:porter:机制-fs本地文件': { desc: '要读写用户本地磁盘文件/把数据镜像到真实文件夹时读', guide: 'porter 提供 fs.* = File System Access 通道(Chrome/Edge; 目录句柄存 porter.fsDir, 重开自动复权)。先 run call:fs.status 看 supported/connected; 未连接让用户在 ⚙ 设置 → 次元口袋 点「连接本地文件夹」' +
        '(浏览器强制用户手势, fs.pickDir 直调会被浏览器拒)。fs.read {path, encoding?}(默认 text, 二进制用 dataUrl); fs.write {path, text|dataUrl|fromKey+field?}(自动创建子目录; fromKey=库→磁盘直传不烧上下文); fs.list {path?, depth?, limit?}(默认深 2/500 项, 超限如实标注截断)。路径一律相对工作区, 禁 ..。' +
        '直传范式: 应用导出 = fs.write {path:"apps/x.html", fromKey:"miniapp:<id>", field:"code"}; 整库镜像 = data.exportLayer {mapped:true, toPath:"colony-pocket.html"}。' },
      'skill:petri:porter:套路-基本操作直达': { desc: '删除/复制/改名/导入/导出/发布/备份应用或数据前必读 — 全部有直达一步, 防绕路', guide: '铁则: 值能在库内/库→磁盘直传就绝不读进上下文再手抄(丢字节+烧token); 别为基础操作造 miniapp/临时脚本/自制镜像页。' +

        '② 复制/搬运/备份: run call:data.copy {from, to, patch?} — 值库内直传零抄写。复制应用 = data.copy {from:"miniapp:a", to:"miniapp:<新id>", patch:{name:"xx 副本"}}(记录 id/updatedAt 自动随键); 备份 = copy 到 backup:<名>, 恢复 = copy 回来。' +

        '④ 导出磁盘: fs.write {path:"apps/x.html", fromKey:"miniapp:<id>", field:"code"}(应用 code 就是完整 HTML); 整库镜像 data.exportLayer {mapped:true, toPath:"..."}; 未连 fs 先 fs.status, 没连就让用户去设置区点连接, 别自制下载器。' +
        '⑤ 导入: fs.read {path} 拿文本 → 带 colony/petri 凭证走检疫收养(见 机制-开发与导入新Petri), 普通 HTML → write {miniapp, record:{name, code}}; 线上发布/外链导入走 net.fetch(见 机制-net.fetch外部API)。' +
        '⑥ 大文件永远 {find,around}/{range} 定位读, 禁整读进上下文。' }
    };
    for (const k of Object.keys(PORTER_SKILLS)) { try { const val = Object.assign({ seededBy: 'petri:porter' }, PORTER_SKILLS[k]); ctx.kv.get(k).then(v => { if (!v || v.v !== val.v) ctx.kv.set(k, val); }).catch(() => { }); } catch (e) { } } // 版本式重播: 文案随块升级到达存量库(与 workflow/ai 同款)
  } }
  seedFactory();

  /* ── 代际数据继承(修订#7 配套): stem换代 → 库名随 hash 变 → 新库空 → 从最近活跃的旧代库搬运用户数据。
     继承范围: 除 stem.*(库自身状态)、block:*:cur(旧覆盖层可能与新stem不容)、backup:* 外的全部键。
     搬完 ctx.stem.reboot() 热重载, 各块直接读到继承后的数据。标志键 stem.migrated 防重跑。 */
  async function inheritLegacyData() {
    if (!ctx.kv || !ctx.stem || typeof indexedDB === 'undefined' || !indexedDB.databases) return;
    if (typeof ctx.stem.reboot !== 'function') return; // 独立穿衣无代际概念: 别把同源 colony 库误当旧代搬进 solo 口袋(S1 冒烟暴露的既有隐患)
    try {
      if (await ctx.kv.get('stem.migrated')) return;
      const mine = (await ctx.kv.list('')).map(e => String(e.key));
      // "空库"判定要排除块播种(skill:/datamap:, 各块 init 即写)与库自身状态(stem.*) — 只有用户数据才算"非空"
      if (mine.filter(k => !/^(stem\.|skill:|datamap:)/.test(k)).length > 3) { await ctx.kv.set('stem.migrated', 'not-empty'); return; }
      const gen = ((ctx.stem.lineage || {}).gen) || 0;
      const cur = 'stem@' + ctx.stem.hash + '@g' + gen;
      const names = (await indexedDB.databases()).map(d => d.name).filter(n => n && /^stem@/.test(n) && n !== cur);
      if (!names.length) { await ctx.kv.set('stem.migrated', 'no-legacy'); return; }
      const open = name => new Promise((res, rej) => { const r = indexedDB.open(name); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
      const req = (st, m) => new Promise(res => { const q = m(st); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); });
      let best = null, bestScore = -1;
      for (const n of names) { // 选最近活跃旧库: stem.lastBoot 为主(毫秒时间戳远大于键数), 老代无打点按键数兜底
        try {
          const db = await open(n);
          if (!db.objectStoreNames.contains('kv')) { db.close(); continue; }
          const st = db.transaction('kv', 'readonly').objectStore('kv');
          const score = ((await req(st, s => s.get('stem.lastBoot'))) || 0) + ((await req(db.transaction('kv', 'readonly').objectStore('kv'), s => s.count())) || 0);
          db.close();
          if (score > bestScore) { bestScore = score; best = n; }
        } catch (e) { }
      }
      if (!best) { await ctx.kv.set('stem.migrated', 'no-usable'); return; }
      const db = await open(best);
      const keys = (await req(db.transaction('kv', 'readonly').objectStore('kv'), s => s.getAllKeys())) || [];
      let moved = 0;
      for (const k of keys) {
        const key = String(k);
        if (/^stem\./.test(key) || /^block:.+:cur$/.test(key) || /^backup:/.test(key)) continue;
        const v = await req(db.transaction('kv', 'readonly').objectStore('kv'), s => s.get(k));
        if (v !== undefined) { await ctx.kv.set(key, v); moved++; }
      }

  const shellWins = new Map(); let shellZ = 56;
  function bumpWinZ(el) {
    if (!el) return;
    if (shellZ > 84) { shellZ = 56; shellWins.forEach(w => { if (w.el && !w.min) w.el.style.zIndex = String(shellZ++); }); }

  /* ── apps CRUD + store.*(全 Colony 唯一实现): 桌面是 miniapp 的家, 注册表与壳生死同频, 壳为提供者。

     agent 有 kv 兜底 appsOr, porter 导入判空降级)。独立穿衣时 provide/sdk 是空壳 → 原正当降级不变。 ── */
  const ICONS = ['🎨', '🛠', '📊', '📝', '🔧', '⚡', '🎯', '💡', '🚀', '🧩', '💎', '🌟'], COLORS = ['#B5FF00', '#FF9500', '#00B8FF', '#FF4488', '#9D4EDD', '#FFD60A'];
  const AppsAPI = {
    async list() { return (await ctx.kv.list('miniapp:')).map(e => e.value).filter(m => m && !m.deleted).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)); },
    async get(id) { return ctx.kv.get('miniapp:' + id); },
    async create(rec) {
      rec = rec || {}; const id = rec.id || 'm' + Date.now().toString(36);
      if (!rec.name) { const t = /<title[^>]*>\s*([^<\n]{1,60})/i.exec(rec.code || ''); if (t) rec.name = t[1].trim(); } // 名字缺省时从 <title> 兜底, 免得桌面一排"未命名"
      let h = 0; const s = (rec.name || '') + (rec.desc || ''); for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
      const full = Object.assign({ id, name: '未命名', desc: '', code: '', icon: ICONS[Math.abs(h) % ICONS.length], color: COLORS[Math.abs(h) % COLORS.length], origin: 'user', createdAt: Date.now() }, rec, { id, updatedAt: Date.now() });
      await ctx.kv.set('miniapp:' + id, full); ctx.emit('apps:changed'); return full;

  };

  const apps = () => ctx.service('apps'); // 消费面统一走服务(独立穿衣 provide 为空 → null → 正当降级)

    const appOf = meta => (meta && meta.context && meta.context.miniappId) || '(anon)';

  function desktopCell() { return innerWidth <= 620 ? { w: 86, h: 104 } : { w: 104, h: 114 }; }
  function clampPos(x, y) { const g = $('apps-grid'); const w = (g && g.clientWidth) || innerWidth, h = (g && g.clientHeight) || innerHeight; return { x: Math.max(0, Math.min(Math.round(x), Math.max(0, w - 96))), y: Math.max(0, Math.min(Math.round(y), Math.max(0, h - 112))) }; }
  function snapPos(x, y) { const c = desktopCell(); return clampPos(Math.round((x || 0) / c.w) * c.w, Math.round((y || 0) / c.h) * c.h); }
  function posSlot(pos) { const c = desktopCell(); const p = snapPos(pos && pos.x || 0, pos && pos.y || 0); return Math.round(p.x / c.w) + ':' + Math.round(p.y / c.h); }
  function nextGridPos(i) { const c = desktopCell(); const cols = Math.max(1, Math.floor((($('apps-grid') && $('apps-grid').clientWidth) || innerWidth) / c.w)); return clampPos(Math.floor(i / cols) * c.w, (i % cols) * c.h); }
  function findFreePos(prefer, used) {
    let p = snapPos(prefer && prefer.x || 0, prefer && prefer.y || 0); let k = posSlot(p);

    for (let i = 0; i < 400; i++) { p = nextGridPos(i); k = posSlot(p); if (!used.has(k)) { used.add(k); return p; } }
    used.add(k); return p;

  function appCardHTML(m) { // .badges 常驻(workflow 贴 node 徽章的挂点); analyze-chip 由 code 块自贴

  function folderTargetAt(x, y) {
    const els = document.elementsFromPoint(x, y);

  function bindDrag(el, opts) { // 通用拖: 触摸才拦默认(防滚/下拉刷新, 鼠标保留单击双击); 松开与中断同一收口
    let s = null;
    const done = e => {
      if (!s || (e && e.pointerId !== s.id)) return;
      const st = s, d = { moved: st.moved, dx: st.dx, dy: st.dy }; s = null;
      document.body.classList.remove('u-dragging');
      if (opts.end) opts.end(e, d, st);
    };
    el.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      if (opts.filter && opts.filter(e) === false) return;

  /* ── 应用网格: 绝对定位桌面(位置持久化, 冲突自动找空位) ── */
  async function renderApps() {

      else used.add(posSlot(p));

    };

      bindDesktopDrag(el, 'folder:' + f.id);
      el.onclick = () => { if (Date.now() < suppressClickUntil) return; openFolder(f); };
      el.oncontextmenu = e => { e.preventDefault(); showMenu(e.clientX, e.clientY, [

        { k: 'paste', t: '粘贴到此文件夹', disabled: !deskClipboard, fn: () => pasteTo(f.id) }, '-',
        { k: 'ren', t: '重命名', fn: async () => { const name = prompt('文件夹名称', f.name || '新建文件夹'); if (!name) return; const fs = await getFolders(); const it = fs.find(x => x.id === f.id); if (it) it.name = name; await putFolders(fs); renderApps(); } },
        { k: 'del', t: '删除文件夹', fn: async () => { if ((f.items || []).length && !confirm('文件夹里有应用，删除后应用会回到桌面，继续?')) return; const fs = (await getFolders()).filter(x => x.id !== f.id); await putFolders(fs); renderApps(); } }
      ]); };

      card.dataset.id = m.id; // 中性管道: 卡片可被任何块按 id 装饰(node 徽章/解读芯片)
      card.style.left = p.x + 'px'; card.style.top = p.y + 'px';

  const AI_NODE_DESC = 'AI 能力包: 一个节点七模态(params.mode=对话/生图/生视频/语音合成/语音转写/音乐/代码); provider/model 留空走默认厂商与任务模型; task 口可加 task2/task3 按名序拼接, media 宽容(dataURL/资产引用/URL; 对话带 media=看图, 语音转写吃 media); 对话模态提示词要求输出 JSON+自定义输出端口→自动拆流到同名端口(text 恒原文); grow=true 自生长, 输出 {text,plan,spawned}; mode=代码: params.code 函数体(收 input 返回对象=输出端口, 5s 超时无 IO, 确定性加工零成本); 模态专属参数与 extras(JSON) 见参数表。生成类模态 model 留空=自动用已测通任务模型(点亮表见 catalog.aiDefaults), 填错模态的模型发请求前会被点名';
  const AI_NODE_SCHEMA = {

      { name: 'code', label: '代码(函数体: 收 input=全部输入端口对象, return 对象=键名即输出端口; 5s 超时, 无 IO)', control: 'textarea', showIf: { mode: ['代码'] } },

      { name: 'prompt', label: '系统提示词(怎么做; 素材走 task 输入; 对话模态走 system 角色)', control: 'textarea' },
      { name: 'grow', label: '🌱 自生长(收到任务后自己规划并长出下游 AI 节点)', control: 'toggle', type: 'boolean', showIf: { mode: ['对话'] } },
      { name: 'maxSpawn', label: '单次最多长几个节点', type: 'number', default: 4, showIf: { mode: ['对话'] } },
      { name: 'voice', label: '音色', control: 'voice-select', showIf: { mode: ['语音合成'] } },
      { name: 'speed', label: '语速(0.5~2, 留空=默认; 厂商支持才生效)', type: 'number', showIf: { mode: ['语音合成'] } },
      { name: 'aspectRatio', label: '长宽比(留空=默认)', control: 'select', options: ['', '1:1', '16:9', '9:16', '4:3', '3:4', '2:3', '3:2'], showIf: { mode: ['生图', '生视频'] } },
      { name: 'lyrics', label: '歌词(留空=按提示词生成)', control: 'textarea', showIf: { mode: ['音乐'] } },

  /* 旧种子清退: AI 节点已降为纯引擎内建(桌面不再出现"打不开的 app"), 未被用户改过的播种记录删掉;
     用户改过的保留(引擎照走 miniapp 路径, 诚实不覆盖)。seedHash 自洽校验=没改过 */
  const seedHashOf = s => { let x = 5381; for (let i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0; return (x >>> 0).toString(36); };
  async function cleanupAiSeed() {
    const A = apps(); if (!A) return;
    try {
      const cur = await A.get(AI_NODE_ID);
      if (cur && cur.seededBy === 'petri:workflow' && cur.seedHash && seedHashOf(cur.code || '') === cur.seedHash) {

  /* ═══════════════════ ④ 数据层: 资产 / 定义存储 / 运行记录持久化 / 即焚运行时(一切运行的唯一管道) ═══════════════════ */
  /* ════ 资产薄层(多模态: 大 data URL 卸到 kv, 节点间传引用)。媒体阈值=运行记录截断线(compactValue 的 VAL_STR_MAX):
     凡可能被运行记录截断的图/音/视频 dataURL 必先资产化, 否则回放时媒体是坏的; 资产化时从 dataURL 前缀提 mime, 口袋才能按图/音/视频归类 ════ */
  const Assets = {
    THRESH: 65536, MEDIA_THRESH: 4000,
    async save(dataUrl, mimeType) {
      const id = uid('a_');
      await ctx.kv.set('wfasset:' + id, { data: dataUrl, mimeType: mimeType || '', at: Date.now() });
      return { __wfasset: id, mimeType: mimeType || '' };
    },
    async get(id) { const r = await ctx.kv.get('wfasset:' + id); return r ? r.data : null; },
    async normalize(o) {
      if (o == null || typeof o !== 'object') return o;
      const walk = async v => {
        if (typeof v === 'string' && /^data:/.test(v)) {
          const mime = (/^data:([^;,]+)/.exec(v) || [])[1] || '';
          if (v.length > (/^(image|audio|video)\//.test(mime) ? Assets.MEDIA_THRESH : Assets.THRESH)) return await Assets.save(v, mime);
        }
        if (Array.isArray(v)) { const out = []; for (const x of v) out.push(await walk(x)); return out; }
        if (v && typeof v === 'object') { const out = {}; for (const k of Object.keys(v)) out[k] = await walk(v[k]); return out; }
        return v;
      };
      return await walk(o);
    },
  };
  /* 远程资产固化: 取远程 URL 二进制 → dataURL → 存 wfasset:(永久, 不随 OSS 签名过期)。复用次元口袋 net.fetch(responseType:dataUrl) 抓取 —— 配了代理即绕 CORS; 口袋不在岗/失败则优雅返回 null, 调用方保留原 URL 引用(与从前一致) */
  async function archiveOn() { try { return !!(await ctx.kv.get('settings:workflow.archiveAssets')); } catch (e) { return false; } }   // 默认关=只存引用; 开=运行后自动固化
  async function archiveUrl(url, mimeType) {
    if (!ctx.kv || !/^https?:\/\//.test(url || '')) return null;
    const h = ctx.sdk.handlers && ctx.sdk.handlers['net.fetch'];   // 抓 URL 复用次元口袋 net.fetch 唯一实现(配了代理即绕 CORS); 口袋不在岗则不固化, 返回 null 让调用方保留原 url
    if (!h) return null;
    try {
      const r = await (typeof h === 'function' ? h : h.fn)({ url, responseType: 'dataUrl' }, { context: {} });
      if (!r || !r.ok || !r.dataUrl) return null;
      return await Assets.save(r.dataUrl, mimeType || r.mimeType || '');
    }
    catch (e) { return null; }
  }

  /* ════ 工作流持久化(薄 CRUD: kv workflow:<id>; 运行记录在独立 wfrun: 前缀, 故 list 不被污染; Array.isArray(nodes) 结构守卫防迁移竞态/脏数据被当定义打开成空画布) ════ */
  const Store = {
    async list() {
      return (await ctx.kv.list('workflow:'))
        .map(e => e.value)
        .filter(w => w && !w.deleted && Array.isArray(w.nodes))
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    },
    async get(id) { const w = await ctx.kv.get('workflow:' + id); return w && Array.isArray(w.nodes) ? w : null; },
    async save(w) {
      const id = w.id || uid('wf_');
      const full = Object.assign({ createdAt: Date.now() }, w, { id, updatedAt: Date.now() });
      await ctx.kv.set('workflow:' + id, full);
      try { ctx.emit('data:changed', { owner: 'petri:workflow', op: 'set', key: 'workflow:' + id, reason: 'workflow-def' }); } catch (e) { }
      return full;
    },
    async remove(id) { await ctx.kv.del('workflow:' + id); try { ctx.emit('data:changed', { owner: 'petri:workflow', op: 'del', key: 'workflow:' + id, reason: 'workflow-def' }); } catch (e) { } },
  };

  /* ════ 即焚运行时(用完即焚: 焚定义, 留成果与痕迹; events[] 即可观测痕迹, 第7节预留 agent 接口) ════ */
  const running = new Map(); const ephListeners = new Set(); const ephEventListeners = new Set();
  let pendingRecover = null;   // 阻塞即恢复现场: 配置类失败的 {def,inputs,name,mode,err}, 配齐后提示条一键重跑
  const emitEph = () => { for (const fn of ephListeners) { try { fn(Eph.list()); } catch (e) { } } };
  const emitEphEvent = (phase, rec, ev) => { for (const fn of ephEventListeners) { try { fn(phase, rec, ev); } catch (e) { console.warn('[workflow] 运行事件订阅异常', e); } } };   // 逐事件广播: 画布常驻订阅据此把"别处(agent/SDK)发起的运行"实时画上画布

  /* ════ 运行记录持久化(落 KV wfrun:<id> — 独立前缀, 不与 workflow:<id> 定义同名空间 → 不污染 Store.list; 口袋可见+刷新可回看; 环形上限防膨胀, 保留量 settings:workflow.runKeep 可调, 越限预警) ════ */
  const RUN_KEY = 'wfrun:';
  const RUN_KEEP_DEFAULT = 50, RUN_KEEP_MIN = 1, RUN_KEEP_MAX = 1000, MEM_RUN_KEEP = 20;
  const VAL_STR_MAX = 4000, VAL_ARR_MAX = 50, VAL_DEPTH_MAX = 8;
  let lastTrimWarn = 0;
  async function runKeep() {
    let n = RUN_KEEP_DEFAULT;
    try { const v = await ctx.kv.get('settings:workflow.runKeep'); if (v != null && isFinite(+v)) n = +v; } catch (e) { }
    return Math.max(RUN_KEEP_MIN, Math.min(RUN_KEEP_MAX, Math.round(n) || RUN_KEEP_DEFAULT));
  }
  /* 输出截断: 防单条运行记录膨胀(如 data list miniapp 把整份 miniapp code 塞进 outputs)。超长串/大数组/深层做摘要标记, 保留诊断价值不撑爆 KV。函数等不可序列化项→null */
  function compactValue(v, d) {
    d = d || 0;
    if (v == null || typeof v === 'number' || typeof v === 'boolean') return v;
    if (typeof v === 'string') return v.length > VAL_STR_MAX ? v.slice(0, VAL_STR_MAX) + '…[+' + (v.length - VAL_STR_MAX) + '字符]' : v;
    if (d > VAL_DEPTH_MAX) return '[深度截断]';
    if (Array.isArray(v)) { const out = v.slice(0, VAL_ARR_MAX).map(x => compactValue(x, d + 1)); if (v.length > VAL_ARR_MAX) out.push('…[+' + (v.length - VAL_ARR_MAX) + '项]'); return out; }
    if (typeof v === 'object') {
      const o = {}; const ks = Object.keys(v); let n = 0;
      for (const k of ks) {
        if (n++ >= 60) { o['…'] = '[+' + (ks.length - 60) + '字段]'; break; }
        o[k] = compactValue(v[k], d + 1);
      }
      return o;
    }
    return null;
  }
  /* 紧凑化: 剥 rec.control(含函数)+ compactValue 截断超大项 + JSON 往返兜底; 透明哲学保留 events/快照/inputs/outputs 结构, 仅对超大值做摘要 */
  function compactRun(rec) {
    const wf = rec.workflow || {};
    const out = {
      id: rec.id,
      workflowId: rec.workflowId || wf.id || null,
      name: rec.name || wf.name || '工作流运行',
      source: rec.source || 'ephemeral',
      status: rec.status || 'done',
      startedAt: rec.startedAt || null,
      finishedAt: rec.finishedAt || null,
      duration: (rec.finishedAt && rec.startedAt) ? rec.finishedAt - rec.startedAt : null,
      elapsed: (rec.status === 'running' && rec.startedAt) ? Date.now() - rec.startedAt : null,
      workflow: { id: wf.id || null, name: wf.name || '', nodes: wf.nodes || [], edges: wf.edges || [], inputs: wf.inputs || null, outputs: wf.outputs || null, runConfig: wf.runConfig || null },
      initialInputs: rec.initialInputs != null ? rec.initialInputs : (wf.initialInputs != null ? wf.initialInputs : null),
      events: rec.events || [],
      outputs: rec.outputs != null ? rec.outputs : null,
      error: rec.error || null
    };
    try { return JSON.parse(JSON.stringify(compactValue(out, 0))); }
    catch (e) {
      return {
        id: out.id, workflowId: out.workflowId, name: out.name, source: out.source, status: out.status,
        startedAt: out.startedAt, finishedAt: out.finishedAt, error: ['运行记录序列化失败: ' + (e && e.message)]
      };
    }
  }
  async function trimPersistedRuns() {
    let rows; try { rows = await ctx.kv.list(RUN_KEY); } catch (e) { return; }
    const keep = await runKeep(); if (rows.length <= keep) return;
    rows.sort((a, b) => ((b.value && (b.value.finishedAt || b.value.startedAt)) || 0) - ((a.value && (a.value.finishedAt || a.value.startedAt)) || 0));
    const drop = rows.slice(keep);
    for (const e of drop) {
      try { await ctx.kv.del(e.key); } catch (_e) { }
      try { await delRunOutputs(String(e.key).slice(RUN_KEY.length)); } catch (_e) { }
    }
    const now = Date.now();
    if (drop.length && now - lastTrimWarn > 60000) {
      lastTrimWarn = now;
      const msg = '工作流运行历史已达上限 ' + keep + ' 条, 已自动清理最旧 ' + drop.length + ' 条(在「次元口袋→工作流→配置」改 settings:workflow.runKeep 调整保留量)';
      const u = ui();
      if (u && u.toast) u.toast(msg);
      else if (typeof console !== 'undefined') console.warn('[workflow]', msg);
    }
  }
  function trimRunningMemory() {
    const done = [...running.values()].filter(r => r.status !== 'running').sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0));
    for (const r of done.slice(MEM_RUN_KEEP)) running.delete(r.id);
  }
  /* 成果索引: 只抽【最终工作流输出】里的媒体(图/音/视频), 各自落一条 porter 能识别的顶层媒体 KV(wfout:<runId>:<i>, 带 type/mimeType/src), 次元口袋图片/视频/音频分类直接可见。不收中间节点产物。不联网, 远程 URL 仅存引用 */
  function buildOutcome(rec) {
    const items = [], seen = new Set();
    // 只需 image|audio|video/ 前缀供 porter 归类(probe), 精确子类型无意义
    const mimeOf = (kind, src) => {
      const dm = /^data:([\w.+-]+\/[\w.+-]+)/.exec(src || '');
      if (dm) return dm[1];
      const ext = (String(src || '').split('?')[0].match(/\.(\w+)$/) || [])[1];
      return kind + '/' + (ext ? ext.toLowerCase() : '*');
    };
    const add = (name, v) => {
      let m = detectMedia(v);
      if (!m && typeof v === 'string' && /^https?:\/\//.test(v)) {   // 无扩展名远程 URL 按字段名兜底
        const lk = String(name).toLowerCase();
        const k = /(image|img|photo|picture|图|封面|cover)/.test(lk) ? 'image'
          : /(audio|sound|music|voice|音|语音|歌)/.test(lk) ? 'audio'
          : /(video|movie|视频|影)/.test(lk) ? 'video'
          : null;
        if (k) m = { kind: k, src: v };
      }
      if (!m) return false;
      const key = m.src || m.assetId; if (key && seen.has(key)) return true; if (key) seen.add(key);
      const kind = m.kind === 'asset' ? ((/(image|audio|video)\//.exec(m.mimeType || '') || [])[1] || 'image') : m.kind;
      items.push({ name: name, type: kind, src: m.src || null, assetId: m.assetId || null, mimeType: m.mimeType || mimeOf(kind, m.src) }); return true;
    };
    const scan = (obj, d) => {
      if (!obj || typeof obj !== 'object' || d > 2) return;
      for (const k of Object.keys(obj)) {
        const v = obj[k];
        if (!add(k, v) && v && typeof v === 'object') scan(v, d + 1);
      }
    };
    scan(rec.outputs, 0);   // 只看最终输出(单终端节点=扁平媒体; 多终端=按节点id嵌套, 故递归一两层)
    return items;
  }
  async function persistOutcome(rec) {
    if (!ctx.kv || !rec || !rec.id || rec.status !== 'done') return;
    const items = buildOutcome(rec); if (!items.length) return;
    const base = {
      kind: 'workflow-output',
      workflowId: rec.workflowId || (rec.workflow && rec.workflow.id) || null,
      workflowName: rec.name || (rec.workflow && rec.workflow.name) || '工作流',
      runId: rec.id,
      createdAt: rec.finishedAt || Date.now()
    };
    const doArchive = await archiveOn();
    for (let i = 0; i < items.length; i++) {
      const it = items[i]; let asset = it.assetId ? { __wfasset: it.assetId } : null;
      if (doArchive && !asset && it.src && /^https?:\/\//.test(it.src)) {   // 自动固化: 远程图转 wfasset
        const a = await archiveUrl(it.src, it.mimeType);
        if (a) asset = { __wfasset: a.__wfasset };
      }
      const v = Object.assign({}, base, { name: it.name, type: it.type, mimeType: it.mimeType, src: it.src || null, url: it.src || null }, asset || {});
      try { await ctx.kv.set('wfout:' + rec.id + ':' + i, v); } catch (e) { }   // 顶层媒体形状: 固化后 __wfasset 永久, src 留原URL兜底
    }
  }
  async function persistRun(rec) {
    if (!ctx.kv || !rec || !rec.id) return;
    try { await ctx.kv.set(RUN_KEY + rec.id, compactRun(rec)); } catch (e) { console.warn('[workflow] 运行记录落盘失败(本次运行结果刷新后不可回看):', e); return; }
    try { await persistOutcome(rec); } catch (e) { console.warn('[workflow] 成果落口袋失败(媒体不会出现在次元口袋):', e); }
    try { await trimPersistedRuns(); } catch (e) { console.warn('[workflow] 运行历史裁剪失败:', e); }
    try { ctx.emit('data:changed', { owner: 'petri:workflow', reason: 'workflow-run' }); } catch (e) { }
  }
  async function getPersistedRun(id) { if (!id) return null; try { return (await ctx.kv.get(RUN_KEY + id)) || null; } catch (e) { return null; } }
  async function listPersistedRuns() {
    let rows;
    try { rows = await ctx.kv.list(RUN_KEY); } catch (e) { return []; }
    return rows.map(e => e.value).filter(Boolean).sort((a, b) => ((b.finishedAt || b.startedAt) || 0) - ((a.finishedAt || a.startedAt) || 0));
  }

  /* 运行成果级联清理唯一实现: 历史裁剪/删运行/debugRun 即清共用 */
  async function delRunOutputs(rid) { for (const o of await ctx.kv.list('wfout:' + rid)) { try { await ctx.kv.del(o.key); } catch (e) { } } }
  const Eph = {
    list() { return [...running.values()].filter(r => r.source !== 'editor' && r.source !== 'single').map(r => ({ id: r.id, workflowId: r.workflowId || null, name: r.name, status: r.status, nodeCount: (r.workflow.nodes || []).length, startedAt: r.startedAt, finishedAt: r.finishedAt })); },   // 画布运行(editor)由 runningWf 在侧栏标注、单跑(single)即用即清, 都不在即焚列表露出; workflowId 供打包运行器按包过滤回执
    get(id) { return running.get(id) || null; },
    remove(id) { if (running.delete(id)) emitEph(); },
    on(fn) { ephListeners.add(fn); return () => ephListeners.delete(fn); },
    onRunEvent(fn) { ephEventListeners.add(fn); return () => ephEventListeners.delete(fn); },
    async run(workflow, opts) {
      opts = opts || {};
      const depth = (opts.depth || 0);
      if (depth > MAX_WF_DEPTH) return { id: null, error: ['工作流嵌套超过深度上限 ' + MAX_WF_DEPTH], status: 'error' };
      const chain = opts.chain || [];
      if (workflow.id && chain.indexOf(workflow.id) >= 0) return { id: null, error: ['工作流自引用(环): ' + workflow.id], status: 'error' };
      const id = opts.id || uid('eph_'); const control = {}; // detach 回执要携 runId(冒泡按 id 回发起会话, 不再按名字排队赌顺序) → 调用方可预生成传入
      const wf = Object.assign({}, workflow, { id, ephemeral: true, _wfDepth: depth, _wfChain: chain.concat(workflow.id || id) });
      const rec = {
        id, workflowId: workflow.id || null, source: opts.source || 'ephemeral', name: workflow.name || '临时工作流',
        workflow: wf, status: 'running', events: [], outputs: null, error: null,
        initialInputs: workflow.initialInputs || {}, startedAt: Date.now(), finishedAt: null, control
      };
      running.set(id, rec); emitEph();
      if (opts.onStart) try { opts.onStart(rec); } catch (e) { console.warn('[workflow] onStart 异常', e); }
      emitEphEvent('start', rec);
      const consume = (async () => {
        try {
          for await (const ev of Engine.run(wf, workflow.initialInputs || {}, control)) {
            rec.events.push(ev);

     asBoard=展开成背景板(带 packId+idmap 的组): 板可「▣收拢」回打包节点(改动写回子工作流), 点 ✕ 取消板=彻底还原成普通节点 */
  async function unpackNode(n, asBoard) {
    const A = apps(); if (!A) { toast('无应用库'); return; }
    const m = await A.get(n.miniappId);
    const pack = m && m.pack; if (!pack) { toast('这不是打包节点'); return; }
    const sub = await Store.get(pack.workflowId); if (!sub) { toast('子工作流已不在: ' + pack.workflowId); return; }
    const ren = {};
    for (const sn of sub.nodes) { let nid = sn.id, i = 2; while (cur.nodes.some(x => x.id === nid) || Object.values(ren).indexOf(nid) >= 0) nid = sn.id + '_' + (i++); ren[sn.id] = nid; }
    const minX = Math.min.apply(null, sub.nodes.map(s => s.x || 0)), minY = Math.min.apply(null, sub.nodes.map(s => s.y || 0));
    for (const sn of sub.nodes) { const c = JSON.parse(JSON.stringify(sn)); c.id = ren[sn.id]; c.x = (n.x || 0) + ((sn.x || 0) - minX); c.y = (n.y || 0) + ((sn.y || 0) - minY); cur.nodes.push(c); }

        w: Math.max.apply(null, nx) - Math.min.apply(null, nx) + 220, h: Math.max.apply(null, ny) - Math.min.apply(null, ny) + 266,

  /* 收拢: 背景板内现状写回子工作流(改板内=改节点行为), 跨界边按打包端口映射接回 ▣ 节点; 结构变了(新跨界线)如实拒绝并指路 */

    if (!innerIds.size) { toast('板内已无打包成员, 点 ✕ 取消背景板即可'); return; }
    const inFix = [], outFix = [];
    for (const e of (cur.edges || [])) {
      const fi = innerIds.has(e.from.node), ti = innerIds.has(e.to.node);
      if (fi === ti) continue;

        outFix.push({ e, port: om.name });

    }
    const innerNodes = cur.nodes.filter(x => innerIds.has(x.id));
    const bx = Math.min.apply(null, innerNodes.map(x => x.x || 0)), by = Math.min.apply(null, innerNodes.map(x => x.y || 0));
    subDef.nodes = innerNodes.map(x => { const c = JSON.parse(JSON.stringify(x)); c.id = idmap[x.id]; c.x = (x.x || 0) - bx; c.y = (x.y || 0) - by; delete c._spawnedBy; return c; });

    cur.nodes = cur.nodes.filter(x => !innerIds.has(x.id));

    for (const f of inFix) f.e.to = { node: packNode.id, port: f.port };

      const baseName = type === 'text' ? (side === 'in' ? 'task' : 'text') : 'media';
      const names = ((side === 'in' ? nd.inputs : nd.outputs) || []).map(p => p.name);
      let i = 2; while (names.indexOf(baseName + i) >= 0) i++;
      n.ports[key].push({ name: baseName + i, type: type === 'text' ? 'text' : 'any', label: (type === 'text' ? '文本' : '媒体') + i });
      renderCanvas(); reopenParams(n);
    });
    panel.querySelectorAll('[data-delport]').forEach(b => b.onclick = () => {
      const side = b.dataset.delport.split(':')[0], idx = +b.dataset.delport.split(':')[1];
      const key = side === 'in' ? 'inputs' : 'outputs';
      const arr = (n.ports && n.ports[key]) || []; const p = arr[idx]; if (!p) return;
      arr.splice(idx, 1);
      cur.edges = (cur.edges || []).filter(ed => !((side === 'out' && ed.from.node === n.id && ed.from.port === p.name) || (side === 'in' && ed.to.node === n.id && ed.to.port === p.name)));
      if (n.seedInputs) delete n.seedInputs[p.name];
      renderCanvas(); reopenParams(n);
    });
    panel.querySelectorAll('[data-seed]').forEach(el => el.onchange = () => {
      const p = seedPorts.find(x => x.name === el.dataset.seed) || {};
      let val = el.value;
      if (p.type === 'number') val = Number(val);
      else if (p.type === 'json') { try { val = JSON.parse(val); } catch (e) { } }
      if (val === '' || val == null) delete n.seedInputs[el.dataset.seed];
      else n.seedInputs[el.dataset.seed] = val;
      renderCanvas();
    });
    /* 文本框全宽拖拽横杆: 原生 resize 抓手会和滚动条打架且只有一角可拖, 换成摸到下边线即可拉的横杆 */
    panel.querySelectorAll('textarea').forEach(ta => {
      const grip = document.createElement('div'); grip.className = 'wf-ta-grip'; grip.title = '拖动调高';
      ta.insertAdjacentElement('afterend', grip);
      grip.onmousedown = e => {
        e.preventDefault();
        const sy = e.clientY, sh = ta.offsetHeight;
        const mv = ev => { ta.style.height = Math.max(44, Math.min(480, sh + (ev.clientY - sy))) + 'px'; };
        const up = () => { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); };
        document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
      };
    });
    /* 媒体收纳箱(agent 输入框同款): 多素材 chips, 拖入/粘贴文件或文本, ✕ 单删; 值按 media/media2/media3… 顺次落 seedInputs(引擎按名序收) */
    const mbox = panel.querySelector('[data-mbox]');
    if (mbox) {
      const mkeys = () => Object.keys(n.seedInputs).filter(k => /^media\d*$/i.test(k)).sort();
      const repack = vals => { for (const k of mkeys()) delete n.seedInputs[k]; vals.forEach((v, i) => { n.seedInputs['media' + (i ? i + 1 : '')] = v; }); };
      const chips = () => {
        mbox.querySelectorAll('.wf-mchip').forEach(c => c.remove());
        const vals = mkeys().map(k => n.seedInputs[k]);
        mbox.querySelector('.wf-mbox-hint').style.display = vals.length ? 'none' : '';
        vals.forEach((v, i) => {
          const c = document.createElement('div'); c.className = 'wf-mchip';
          const s = String(v || ''), mtc = /^data:(image|video|audio)/.exec(s);
          c.innerHTML = (mtc ? (mtc[1] === 'image' ? '<img src="' + s + '">' : mtc[1] === 'video' ? '<video src="' + s + '" muted></video>' : '🎵') : (s.indexOf('__wfasset') >= 0 ? '📦资产' : '🔗' + esc(s.slice(0, 18)))) + '<span class="mx" data-mi="' + i + '">✕</span>';
          c.querySelector('.mx').onclick = e => { e.stopPropagation(); const vs = mkeys().map(k => n.seedInputs[k]); vs.splice(i, 1); repack(vs); chips(); renderCanvas(); };
          mbox.appendChild(c);
        });
      };
      const addMedia = v => { if (v == null || v === '') return; const vs = mkeys().map(k => n.seedInputs[k]); vs.push(v); repack(vs); chips(); renderCanvas(); };
      const readFiles = fl => { for (const f of fl) { const rd = new FileReader(); rd.onload = () => addMedia(rd.result); rd.onerror = () => toast('读取文件失败: ' + f.name); rd.readAsDataURL(f); } };
      mbox.ondragover = e => { e.preventDefault(); mbox.classList.add('over'); };
      mbox.ondragleave = () => mbox.classList.remove('over');
      mbox.ondrop = e => { e.preventDefault(); mbox.classList.remove('over'); if (e.dataTransfer.files && e.dataTransfer.files.length) readFiles(e.dataTransfer.files); };
      mbox.onpaste = e => {
        e.preventDefault();
        const cf = e.clipboardData.files;
        if (cf && cf.length) readFiles(cf);
        else { const t = (e.clipboardData.getData('text') || '').trim(); if (t) addMedia(t); }
      };
      mbox.onclick = () => mbox.focus();   // 聚焦即可 Ctrl+V 粘贴
      chips();
    }
    studio.querySelector('.wf-canvas-wrap').appendChild(panel);
  }

  async function saveCurrent() {
    if (!cur) return;
    if (ephView) { toast('即焚工作流只读'); return; }
    const w = await Store.save(cur); cur.id = w.id;
    if (w.createdAt) cur.createdAt = w.createdAt;
    activeWf = cur.id; toast('已保存'); renderTopbar(); refreshHome();
  }
  function toast(m) { const u = ui(); if (u && u.toast) u.toast(m); }

  /* ════ 节点结果渲染(一套核, 不再"只点开才看到"): renderValue 按媒体类型出 图/音/视频/资产ref/文本/JSON; inline=卡片缩略, 否则=检视器全量。renderNodeResult 选主值内联到卡片; openResultInspector 全量分栏。历史回放复用同一套 ════ */
  function detectMedia(v) {
    if (typeof v === 'string') {
      const m = /^data:(image|audio|video)\//.exec(v);
      if (m) return { kind: m[1], src: v };
      if (/^https?:\/\/\S+\.(png|jpe?g|gif|webp|svg|mp3|wav|ogg|mp4|webm)(\?\S*)?$/i.test(v)) {
        const ext = (v.split('?')[0].match(/\.(\w+)$/) || [])[1].toLowerCase();
        return { kind: /mp3|wav|ogg/.test(ext) ? 'audio' : /mp4|webm/.test(ext) ? 'video' : 'image', src: v };
      }
      return null;
    }
    if (v && typeof v === 'object') {
      if (v.__wfasset) return { kind: 'asset', assetId: v.__wfasset, mimeType: v.mimeType || '' };
      const s = v.dataUrl || v.url || v.src;
      if (typeof s === 'string') {
        const d = detectMedia(s);
        if (d) return d;
        const k = /^(image|audio|video)\//.exec(v.mimeType || '');
        if (k) return { kind: k[1], src: s };
      }
    }
    return null;
  }
  /* 去重公共件: 媒体标签 / 节点耗时badge / 日志行格式(execViz 实时 + replayRunUI 重建共用) */
  function mediaTag(kind, src, full) {
    src = esc(src);
    return kind === 'audio' ? '<audio controls src="' + src + '"></audio>'
      : kind === 'video' ? '<video ' + (full ? 'controls' : 'muted') + ' src="' + src + '"></video>'
      : '<img loading="lazy" src="' + src + '">';
  }
  function setDur(el, ms) {
    if (ms == null || !el) return;
    const tt = el.querySelector('.wf-node-title');
    if (!tt || tt.querySelector('.wf-node-dur')) return;
    const ds = document.createElement('span'); ds.className = 'wf-node-dur';
    ds.textContent = ms >= 1000 ? (ms / 1000).toFixed(1) + 's' : ms + 'ms';
    tt.insertBefore(ds, tt.querySelector('.wf-node-del'));
  }
  function logFor(e) {
    if (e.type === 'node:start') return { t: '▶ ' + (e.title || e.nodeId) + ' …' };
    if (e.type === 'node:done') return { t: '✓ ' + e.nodeId + ' (' + e.duration + 'ms)' + (e.picked ? ' · 模型: ' + e.picked : ''), c: 'success' };
    if (e.type === 'node:error') return { t: '✗ ' + e.nodeId + ' [' + (e.code || '') + ']: ' + e.error, c: 'error' };
    if (e.type === 'graph:patch') return { t: '+ ' + (e.addNodes || []).length + ' 节点(动态扩图)' };
    if (e.type === 'workflow:cancelled') return { t: '■ 已停止' + (e.reason ? ': ' + e.reason : ''), c: 'error' };
    if (e.type === 'workflow:done') return { t: '✓ 完成 · ' + JSON.stringify(e.outputs || {}).slice(0, 120), c: 'success' };
    if (e.type === 'workflow:error') return { t: '✗ ' + (e.errors || []).join('; '), c: 'error' };
    return null;
  }
  const asOut = o => (o && typeof o === 'object' && !Array.isArray(o)) ? o : { result: o };   // 输出归一: 对象直用, 否则裹成 {result}
  async function renderValue(container, v, inline) {
    const media = detectMedia(v);
    if (media) {
      let src = media.src, kind = media.kind;
      if (kind === 'asset') {
        try { src = await Assets.get(media.assetId); } catch (e) { }
        const mt = media.mimeType || ((/^data:([^;]+)/.exec(src || '') || [])[1]) || '';
        kind = /^audio/.test(mt) ? 'audio' : /^video/.test(mt) ? 'video' : 'image';
      }
      if (!src) { container.innerHTML = '<span class="sm">资产已丢失或被清理</span>'; return; }
      container.innerHTML = mediaTag(kind, src, !inline);
      return;
    }
    if (typeof v === 'string' && v.trim()) {
      const d = document.createElement('div'); d.className = inline ? 'txt' : '';
      if (!inline) { const p = document.createElement('pre'); p.textContent = v; container.appendChild(p); return; }
      d.textContent = v; container.appendChild(d); return;
    }
    const pre = document.createElement('pre'); if (inline) pre.className = 'sm'; pre.textContent = v == null ? '(空)' : JSON.stringify(v, null, inline ? 0 : 2); container.appendChild(pre);
  }
  /* 卡片内联: 选主展示值(优先媒体, 其次首个非空文本, 否则整体) */
  async function renderNodeResult(el, outputs) {
    el.style.display = 'block'; el.innerHTML = ''; el.title = '点击查看完整结果';
    const out = asOut(outputs);
    const ks = Object.keys(out); let pick;
    for (const k of ks) { if (detectMedia(out[k])) { pick = out[k]; break; } }
    if (pick === undefined) for (const k of ks) { if (typeof out[k] === 'string' && out[k].trim()) { pick = out[k]; break; } }
    if (pick === undefined) pick = ks.length === 1 ? out[ks[0]] : out;
    await renderValue(el, pick, true);
  }
  function openResultInspector(title, outputs) {
    if (!studio) return;
    const wrap = studio.querySelector('.wf-canvas-wrap'); if (!wrap) return; const old = wrap.querySelector('.wf-result-modal'); if (old) old.remove();
    const modal = document.createElement('div'); modal.className = 'wf-result-modal';
    modal.innerHTML = '<div class="box"><h4>' + esc(title || '节点结果') + '<span class="px">✕</span></h4><div class="rbody"></div></div>';
    wrap.appendChild(modal);
    modal.querySelector('.px').onclick = () => modal.remove(); modal.onclick = e => { if (e.target === modal) modal.remove(); };
    const body = modal.querySelector('.rbody');
    const out = asOut(outputs);
    const keys = Object.keys(out);
    if (!keys.length) { body.innerHTML = '<pre>(无输出)</pre>'; return; }
    for (const k of keys) {
      const row = document.createElement('div'); row.className = 'ro';
      const lab = document.createElement('div'); lab.className = 'rk'; lab.textContent = k;

  /* ════ 左侧列表交互: 单击打开 / 双击 inline 重命名(防抖消歧, 避免开图重渲染吞掉输入框) ════ */
  async function renameWorkflow(id, name) { const w = await Store.get(id); if (!w) return; w.name = name; await Store.save(w); if (cur && cur.id === id) { cur.name = name; renderTopbar(); } }
  function startRename(el, w) {

  }
  function attachWfItemHandlers(el, id) {

    el.onclick = e => { if (e.target.closest('[data-del]') || e.target.closest('.wf-rename')) return; if (t) return; t = setTimeout(() => { t = null; openWorkflow(id); }, 200); };
    el.ondblclick = async e => { if (e.target.closest('[data-del]')) return; if (t) { clearTimeout(t); t = null; } e.preventDefault(); const w = await Store.get(id); if (w) startRename(el, w); };

  /* 运行入口: 初始输入做到节点里(点起点节点→参数面板填初始输入, 存 node.seedInputs); 点运行直接跑——引擎按节点喂各自种子, 多入口并行 */
  async function runCurrent() {
    if (!cur || !cur.nodes.length) { toast('先添加节点'); return; }
    if (ephView) { toast('历史运行只读, 切回工作流再跑'); return; }
    if (runningWf.has(cur.id || cur)) {   // 运行中再点同一颗按钮 = 停止(保险丝: 长节点/烧钱扩图随时可断)
      if (curRec && curRec.control && curRec.control.abort) curRec.control.abort('用户停止');
      else toast('该工作流正在运行中, 等它跑完');
      return;
    }
    execViz({});
  }
  /* 运行/回放态端口瘦身: 没有连线且没喂种子的端口收起, 给生成内容(图/音/文)腾展示空间; 任何编辑重绘自动还原全端口 */
  function slimPorts(runWf) {
    if (!studio || !runWf || !runWf.nodes) return;
    const eset = runWf.edges || [];
    for (const n of runWf.nodes) {
      const el = studio.querySelector('.wf-node[data-node-id="' + n.id + '"]'); if (!el) continue;
      el.querySelectorAll('.wf-port').forEach(pe => {
        const dir = pe.dataset.dir, pn = pe.dataset.port || '';
        const used = dir === 'in'
          ? eset.some(e => e.to.node === n.id && (e.to.port || '') === pn) || (n.seedInputs && n.seedInputs[pn] != null)
          : eset.some(e => e.from.node === n.id && ((e.from.port || '') === pn || (!e.from.port && e.label === pn)));
        pe.style.display = used ? '' : 'none';
      });
    }
  }
  /* 智能避让: 按节点实际渲染高度垂直下推同列节点(粗分列 200px 桶), 生成的图/视频完整可见; 只下推不动横向布局, 幂等可反复调 */
  let _ovT = null;
  function resolveOverlaps() {
    if (!studio || !cur || !cur.nodes) return;
    const GAP = 26, cols = {};
    for (const n of cur.nodes) {
      const el = studio.querySelector('.wf-node[data-node-id="' + n.id + '"]'); if (!el) continue;
      const ck = Math.round((n.x || 0) / 200);
      (cols[ck] = cols[ck] || []).push({ n, el });
    }
    let moved = false;
    for (const k in cols) {
      const list = cols[k].sort((a, b) => (a.n.y || 0) - (b.n.y || 0));
      for (let i = 1; i < list.length; i++) {
        const need = (list[i - 1].n.y || 0) + list[i - 1].el.offsetHeight + GAP;
        if ((list[i].n.y || 0) < need) { list[i].n.y = need; list[i].el.style.top = need + 'px'; moved = true; }
      }
    }
    if (moved && renderCanvas._draw) renderCanvas._draw();
  }
  function nudgeOverlaps() { clearTimeout(_ovT); _ovT = setTimeout(resolveOverlaps, 120); }
  /* 唯一 settle 钩子: 节点内容任何尺寸变化(图/视频加载、结果渲染、端口瘦身)→去抖避让。style.top 不触发 RO, 无反馈环 */
  const _settleRO = (typeof ResizeObserver !== 'undefined') ? new ResizeObserver(nudgeOverlaps) : null;
  function watchSettle(el) { if (_settleRO) _settleRO.observe(el); }
  /* 日志抽屉: 头条常驻一行(条数+错误红标), 内容默认收起点头条拉开 — 不再吃画布视觉空间 */
  function logShell(log, fold) {
    if (!log.querySelector('.log-body')) {
      log.innerHTML = '<div class="wf-log-h">📜 日志 <span class="cnt">0</span><span class="err"></span><span class="tg">▸</span></div><div class="log-body"></div>';
      log.classList.add('folded');
    }
    if (fold === true) log.classList.add('folded');
    const h = log.querySelector('.wf-log-h');
    h.onclick = () => { log.classList.toggle('folded'); h.querySelector('.tg').textContent = log.classList.contains('folded') ? '▸' : '▾'; };
    return log.querySelector('.log-body');
  }
  function logCount(log, n, isErr) {
    const c = log.querySelector('.wf-log-h .cnt'); if (c) c.textContent = n;
    if (isErr) { const e = log.querySelector('.wf-log-h .err'); if (e) e.textContent = ' ⚠有报错'; }
    else if (n === 0) { const e = log.querySelector('.wf-log-h .err'); if (e) e.textContent = ''; }
  }
  function setRunning(on, ms, count) {
    const b = studio && studio.querySelector('#wf-run');
    if (!b) return;
    b.classList.toggle('on', !!on);
    b.textContent = on ? ('■ 停止' + (count ? ' ' + count + '节点' : '') + (ms != null ? ' ' + Math.round(ms / 1000) + 's' : '…')) : '▶ 运行';
    b.title = on ? '点击停止本次运行' : '';
  }
  /* ── 节点卡片回填与扩图合并的唯一实现: live 运行/单跑/回放三径共用 ── */
  function applyNodeDoneUI(el, ev) {
    if (!el) return;
    el.classList.remove('run-active'); el.classList.add('run-done'); el.__out = ev.outputs;
    const r = el.querySelector('.wf-node-result'); if (r) renderNodeResult(r, ev.outputs);
    setDur(el, ev.duration);
  }
  function applyNodeErrorUI(el, msg) {
    if (!el) return;
    el.classList.remove('run-active'); el.classList.add('run-error');
    const r = el.querySelector('.wf-node-result'); if (r) { r.style.display = 'block'; r.innerHTML = '<div class="wf-err">✗ ' + esc(msg || '出错') + '</div>'; }
  }
  /* graph:patch → 图合并(去重/_spawnedBy 软边/源右侧 240px 错位落点); autoLayout 由调用方决定时机 */
  function patchIntoGraph(wf, e) {
    const src = wf.nodes.find(n => n.id === e.sourceNodeId);
    let i = 0;
    for (const an of (e.addNodes || [])) {
      if (wf.nodes.find(n => n.id === an.id)) continue;
      const node = { id: an.id, miniappId: an.miniappId, kind: an.kind, title: an.title, params: an.params || {}, _spawnedBy: e.sourceNodeId || null };
      if (an.ports) node.ports = an.ports; if (an.seedInputs) node.seedInputs = an.seedInputs;
      if (an.x != null) { node.x = an.x; node.y = an.y; }
      else if (src && src.x != null) { node.x = src.x + 240; node.y = (src.y || 0) + i * 120; }
      wf.nodes.push(node); i++;
    }
    wf.edges = (wf.edges || []).concat((e.addEdges || []).filter(ed => !(wf.edges || []).find(x => x.from.node === ed.from.node && x.to.node === ed.to.node && x.to.port === ed.to.port)));
  }
  /* 单跑一个节点: 输入取上次运行留下的上游输出(现场数据重放), 结果回填卡片并记入现场 → 可顺着链逐个诊断, 调好再按总运行。
     走正式跑道(Eph.run, noHistory+noOutcome): 进 running 表 → 单跑 grow 节点 patchGraph 不再 NO_RUN, 长出的子图实时合并上画布; 单跑是调试中间态, 历史与成果都不落 */
  async function runSingleNode(n) {
    if (!cur) return;
    if (runningWf.has(cur.id || cur)) { toast('工作流正在运行中, 先停止再单跑'); return; }
    const lastOut = {};
    for (const e of ((curRec && curRec.events) || [])) if (e.type === 'node:done') lastOut[e.nodeId] = e.outputs;
    const incoming = (cur.edges || []).filter(e => e.to.node === n.id);
    const missing = [...new Set(incoming.filter(e => lastOut[e.from.node] == null).map(e => e.from.node))];
    const inputs = foldEdgeInputs(Object.assign({}, n.seedInputs || {}), incoming, id => lastOut[id]);
    const el = studio.querySelector('.wf-node[data-node-id="' + n.id + '"]');
    const r = el && el.querySelector('.wf-node-result');
    if (el) { el.classList.remove('run-done', 'run-error'); el.classList.add('run-active'); const d = el.querySelector('.wf-node-dur'); if (d) d.remove(); }
    if (r) { r.style.display = 'block'; r.innerHTML = '<span class="sm">● 单跑中…' + (missing.length ? ' (上游 ' + esc(missing.join(',')) + ' 无现成输出, 对应输入缺省)' : '') + '</span>'; }
    if (!curRec) curRec = { id: uid('solo_'), workflowId: cur.id || null, source: 'single-node', name: cur.name, workflow: cur, status: 'done', events: [], outputs: null, error: null, startedAt: Date.now(), finishedAt: null };
    const single = { name: '单跑·' + (n.title || n.id), nodes: [Object.assign({}, n, { seedInputs: inputs })], edges: [], runConfig: cur.runConfig };
    const res = await Eph.run(single, {
      source: 'single', noHistory: true, noOutcome: true,
      onEvent: ev => {
        // 永远现查元素: graph:patch 会 renderCanvas 重建 DOM, 闭包捕获的旧 el 已脱挂
        const q = id => studio.querySelector('.wf-node[data-node-id="' + id + '"]');
        if (ev.type === 'node:done') { applyNodeDoneUI(q(ev.nodeId), ev); curRec.events.push(ev); }
        else if (ev.type === 'node:error') applyNodeErrorUI(q(ev.nodeId), (ev.code ? ev.code + ': ' : '') + (ev.error || '出错'));
        else if (ev.type === 'workflow:error') applyNodeErrorUI(q(n.id), (ev.errors || []).join('; '));
        else if (ev.type === 'graph:patch') { patchIntoGraph(cur, ev); curRec.events.push(ev); autoLayout(cur); renderCanvas(); }
      }
    });
    if (res && res.id) Eph.remove(res.id);   // 即用即清

  /* ── 阻塞即恢复: 监听 AI 配置变化, 缺口补齐(该模态有了已测通模型)→提示条明示将用模型+一键重跑 — 半自动(不静默烧钱), 模型替换如实告知 ── */
  async function checkRecover() {
    if (!pendingRecover || !studio) return;
    const cap = CAP_OF_MODE[pendingRecover.mode];
    let picked = '';
    if (cap && cap !== 'text.chat') {
      try {
        const cat = await aiCall('models', { kind: 'multimodal' });
        const row = (((cat && cat.capabilities) || []).filter(r => r.capability === cap && r.verified && r.model))[0];
        if (!row) return;   // 缺口还没补齐, 继续等
        picked = (row.provider || row.providerId) + ' · ' + row.model + '(已测通)';
      } catch (e) { return; }
    }
    let bar = studio.querySelector('.wf-recover-bar');
    if (!bar) { bar = document.createElement('div'); bar.className = 'wf-recover-bar'; studio.querySelector('.wf-canvas-wrap').appendChild(bar); }
    bar.innerHTML = '<span>「' + esc(pendingRecover.mode || 'AI') + '」已就绪' + (picked ? ': ' + esc(picked) : '') + ' — 上次因配置失败的「' + esc(pendingRecover.name || '运行') + '」可以续上了</span>'
      + '<button class="cl-btn-primary" data-rr>重跑</button><span class="wf-od-x" data-rx>✕</span>';

      toast('已重跑「' + (p.name || '工作流') + '」(后台, 侧栏可见)' + (picked ? ' · 模型: ' + picked : ''));
